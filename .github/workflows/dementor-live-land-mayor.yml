name: Dementor Live — Land, Mayor and Regional QA
on:
  push:
    branches:
      - 'feature/dementor-live-land-mayor-feedback-*'
  pull_request:
    paths:
      - 'projects/dementor-live/runtime/**'
      - 'projects/dementor-live/architecture/**'
      - 'projects/dementor-live/design/**'
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/dementor-live/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: node --test test/combat-p0.test.mjs test/combat-touch.test.mjs
      - run: npm run test:integration
      - run: npm run test:persistence
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: projects/dementor-live/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-cairosvg python3-pil
      - run: python3 tools/build-terrain.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chrome
      - run: node test/interface-world-polish.cjs
      - run: node test/estate-mayor-ui.cjs
      - run: npm run test:mobile
      - run: node test/city-mobile-gameplay.cjs
      - run: npm run test:quests
      - run: node test/combat-mobile-qa.cjs
