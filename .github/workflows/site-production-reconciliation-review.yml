name: Review Residual Staging Deltas

on:
  push:
    branches: [result/site-production-reconciliation-v1]
    paths:
      - '.github/workflows/site-production-reconciliation-review.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: result/site-production-reconciliation-v1
          fetch-depth: 0
      - name: Fetch branches
        run: |
          git fetch origin dementor-club-production:dementor-club-production
          git fetch origin dementor-club-site:dementor-club-site
          git fetch origin dementor-club:dementor-club
      - name: Build residual review
        shell: python
        run: |
          import subprocess, pathlib
          review_paths = [
            'README.md',
            'assets/home/events/fuengirola-banner.webp',
            'community/board/telegram-worker-trigger-v3.js',
            'dementor-account-sync-v8.js',
            'design-system/dc9-entry-state-test/index.html',
            'design-system/dc9-mobile-qa/index.html',
            'design-system/dc9-mobile-result-qa/index.html',
            'docs/FEATURE_ACTIVATION_MATRIX_v1.md',
            'join/join-progress-map-v2.js',
            'join/result/GRAPH_LINKED_CARDS_V5.md',
            'join/result/result.js',
            'scripts/validate-dc9-result-model.mjs',
            'ui-redesign-drive-v1.css',
            'vercel.json'
          ]
          def run(args):
              p=subprocess.run(args,text=True,capture_output=True)
              return p.stdout.strip()
          lines=['# Site / Production Reconciliation — Residual Review','', 'These are the 14 paths that preliminary inventory could not safely collapse by timestamp/existence alone.','']
          for path in review_paths:
              lines += [f'## `{path}`','']
              prod_exists=subprocess.run(['git','cat-file','-e',f'dementor-club-production:{path}'],capture_output=True).returncode==0
              site_exists=subprocess.run(['git','cat-file','-e',f'dementor-club-site:{path}'],capture_output=True).returncode==0
              lines.append(f'- production exists: `{str(prod_exists).lower()}`')
              lines.append(f'- staging exists: `{str(site_exists).lower()}`')
              if prod_exists:
                  lines.append(f'- production last: `{run(["git","log","-1","--format=%H %cI %s","dementor-club-production","--",path])}`')
              if site_exists:
                  lines.append(f'- staging last: `{run(["git","log","-1","--format=%H %cI %s","dementor-club-site","--",path])}`')
              semantic=run(['git','grep','-n','-F',path,'dementor-club','--','.weekly-os','operations','concept','projects','docs'])
              prod_refs=run(['git','grep','-n','-F',path,'dementor-club-production','--',':(exclude)'+path])
              base=path.split('/')[-1]
              prod_base_refs=run(['git','grep','-n','-F',base,'dementor-club-production','--',':(exclude)'+path]) if base!=path else ''
              lines += ['','Semantic references:','```text',semantic[:6000] or 'NONE','```','','Production references to exact path:','```text',prod_refs[:6000] or 'NONE','```']
              if base!=path:
                  lines += ['','Production references to basename:','```text',prod_base_refs[:6000] or 'NONE','```']
              lines.append('')
          pathlib.Path('operations/SITE_PRODUCTION_RECONCILIATION_RESIDUAL_REVIEW_2026-09-17.md').write_text('\n'.join(lines))
      - name: Commit review and self-remove
        run: |
          git config user.name SLEDZARI
          git config user.email sharecraftwideo@gmail.com
          git add operations/SITE_PRODUCTION_RECONCILIATION_RESIDUAL_REVIEW_2026-09-17.md
          git commit -m "reconciliation: review residual staging deltas"
          git rm .github/workflows/site-production-reconciliation-review.yml
          git commit -m "chore: remove residual review workflow"
          git push origin result/site-production-reconciliation-v1
