name: Design Batch 2 Feature Relation

on:
  push:
    branches:
      - design-audit-batch-2026-08-27

permissions:
  contents: write

jobs:
  feature-relation:
    if: ${{ !contains(github.event.head_commit.message, '[feature-relation-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply FEATURE and RELATION migration
        run: node scripts/batch2-feature-relation.mjs
      - name: Run design audits
        run: |
          node scripts/audit-style-graph.mjs
          node scripts/audit-dementor-hero.mjs
          node scripts/audit-event-hero.mjs
          node scripts/audit-feature-relation.mjs
      - name: Commit FEATURE and RELATION migration
        run: |
          git config user.name "Dementor Design Audit"
          git config user.email "design-audit@users.noreply.github.com"
          git add index.html events/fuengirola/index.html visual-standard-v2.css artifacts/design-style-graph.json
          if git diff --cached --quiet; then
            echo "No FEATURE / RELATION migration changes"
            exit 0
          fi
          git commit -m "Batch 2: align FEATURE and RELATION components [feature-relation-auto]"
          git pull --rebase origin design-audit-batch-2026-08-27
          git push origin HEAD:design-audit-batch-2026-08-27
