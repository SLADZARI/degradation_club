name: ThingProjection #213 G8 close

on:
  push:
    branches: [dementor-club]
    paths:
      - .github/workflows/thing-projection-g8-close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dementor-club
          fetch-depth: 0
      - name: Close ThingProjection Result in kernel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p_path=Path('.weekly-os/PROJECT.json')
          a_path=Path('.weekly-os/ARTIFACT_INDEX.json')
          p=json.loads(p_path.read_text())
          a=json.loads(a_path.read_text())

          assert p['_artifact']['version']=='1.95'
          assert a['_artifact']['version']=='1.92'
          cr=p['currentResult']
          assert cr['artifactId']=='dementor-club.result.thing-projection-runtime-v1'
          assert cr['version']=='0.3'
          assert cr['productionCommit']=='23d4266a4009d34042b29ec1fb73fb0cbad6b62e'

          p['_artifact']['version']='1.96'
          p['_artifact']['supersedes']='1.95'
          p['_artifact']['gate']='G8_CLEANUP'
          p['_artifact']['projectStage']='RELEASE'
          p['_artifact']['updated']='2026-09-17'
          p['gate']='G8_CLEANUP'
          p['projectStage']='RELEASE'

          result_path='.weekly-os/results/thing-projection-runtime-v1.v1.0.md'
          pages_ev='operations/THING_PROJECTION_RUNTIME_PAGES_RELEASE_2026-09-17.md'
          live_ev='operations/THING_PROJECTION_RUNTIME_LIVE_RETEST_2026-09-17.md'
          g8_ev='operations/THING_PROJECTION_RUNTIME_G8_2026-09-17.md'
          rf=p['readFirst']
          rf=[result_path if x=='.weekly-os/results/thing-projection-runtime-v1.v0.3.md' else x for x in rf]
          insert_after=result_path
          for ev in [g8_ev,live_ev,pages_ev]:
              if ev not in rf:
                  rf.insert(rf.index(insert_after)+1,ev)
                  insert_after=ev
          p['readFirst']=rf

          completed={
            'artifactId':'dementor-club.result.thing-projection-runtime-v1',
            'version':'1.0','status':'APPROVED','path':result_path,'gate':'G8_CLEANUP','issue':213,
            'candidateCommit':'7dc040fe90696caf303b0fb43f1f53296ad7fd97',
            'validationRun':1200,'validationRunId':35256632481,'validationConclusion':'SUCCESS',
            'productionCommit':'23d4266a4009d34042b29ec1fb73fb0cbad6b62e',
            'productionDeployRun':120,'productionDeployRunId':35259685738,
            'pagesArtifactId':10514141329,
            'pagesArtifactDigest':'sha256:4e10d17049a3280d0ec219e1344b73ca94a7a4a07c363a637e76993b12b6844d',
            'productionDeployStatus':'SUCCESS','liveRetest':'PASS_LIVE_RUNTIME_BOUNDARY',
            'liveEvidence':live_ev,'g8Evidence':g8_ev,
            'note':'Released exact production 23d4266a... via Pages run #120 / 35259685738; live runtime boundary PASS; G8 closed. #202 and #214 remain separate.'
          }
          assert not any(x['artifactId']==completed['artifactId'] for x in p['completedResults'])
          p['completedResults'].insert(0,completed)
          p['currentResult']=None
          p['activeIntegrationBranch']=None
          p['activeReleaseBranch']=None

          a['_artifact']['version']='1.93'
          a['_artifact']['supersedes']='1.92'
          a['_artifact']['gate']='G8_CLEANUP'
          a['_artifact']['projectStage']='RELEASE'
          a['_artifact']['updated']='2026-09-17'
          for item in a['currentArtifacts']:
              if item['artifactId']=='dementor-club.kernel.project':
                  item['currentVersion']='1.96'; item['updated']='2026-09-17'
              elif item['artifactId']=='dementor-club.kernel.artifact-index':
                  item['currentVersion']='1.93'; item['updated']='2026-09-17'
              elif item['artifactId']=='dementor-club.result.thing-projection-runtime-v1':
                  item.update({
                    'currentVersion':'1.0','status':'APPROVED','location':result_path,'canonicalLocation':result_path,
                    'relation':'COMPLETED_RESULT','gate':'G8_CLEANUP','productionMergeAuthorized':True,
                    'productionDeployAuthorized':True,'productionCommit':'23d4266a4009d34042b29ec1fb73fb0cbad6b62e',
                    'productionDeployRun':120,'productionDeployRunId':35259685738,'productionDeployStatus':'SUCCESS',
                    'pagesArtifactId':10514141329,'pagesArtifactDigest':'sha256:4e10d17049a3280d0ec219e1344b73ca94a7a4a07c363a637e76993b12b6844d',
                    'liveRetest':'PASS_LIVE_RUNTIME_BOUNDARY','liveEvidence':live_ev,'g8Evidence':g8_ev,
                    'note':'Released and G8 closed; #202 and #214 remain separate.'
                  })

          additions=[
            {'artifactId':'dementor-club.operations.thing-projection-runtime-pages-release-2026-09-17','documentType':'RELEASE_EVIDENCE','currentVersion':'1.0','status':'PASS','location':pages_ev,'sourceSystem':'GIT','authorityType':'RELEASE_EVIDENCE','updated':'2026-09-17','canonicalProject':'dementor-club','canonicalLocation':pages_ev,'relation':'PRODUCTION_DEPLOY_EVIDENCE','result':completed['artifactId'],'productionCommit':completed['productionCommit'],'productionDeployRun':120,'productionDeployRunId':35259685738,'pagesArtifactId':10514141329,'pagesArtifactDigest':completed['pagesArtifactDigest'],'referencedBy':[]},
            {'artifactId':'dementor-club.operations.thing-projection-runtime-live-retest-2026-09-17','documentType':'VALIDATION_EVIDENCE','currentVersion':'1.0','status':'PASS_LIVE_RUNTIME_BOUNDARY','location':live_ev,'sourceSystem':'GIT','authorityType':'VALIDATION_EVIDENCE','updated':'2026-09-17','canonicalProject':'dementor-club','canonicalLocation':live_ev,'relation':'LIVE_RETEST_EVIDENCE','result':completed['artifactId'],'productionCommit':completed['productionCommit'],'referencedBy':[]},
            {'artifactId':'dementor-club.operations.thing-projection-runtime-g8-2026-09-17','documentType':'VALIDATION_EVIDENCE','currentVersion':'1.0','status':'PASS_G8_CLEANUP','location':g8_ev,'sourceSystem':'GIT','authorityType':'VALIDATION_EVIDENCE','updated':'2026-09-17','canonicalProject':'dementor-club','canonicalLocation':g8_ev,'relation':'G8_EVIDENCE','result':completed['artifactId'],'productionCommit':completed['productionCommit'],'referencedBy':[]}
          ]
          ids={x['artifactId'] for x in a['currentArtifacts']}
          assert all(x['artifactId'] not in ids for x in additions)
          a['currentArtifacts'][6:6]=additions

          p_path.write_text(json.dumps(p,ensure_ascii=False,separators=(',',':'))+'\n')
          a_path.write_text(json.dumps(a,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
      - name: Verify G8 closure invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.weekly-os/PROJECT.json'))
          a=json.load(open('.weekly-os/ARTIFACT_INDEX.json'))
          assert p['_artifact']['version']=='1.96'
          assert a['_artifact']['version']=='1.93'
          assert p['currentResult'] is None
          assert p['activeIntegrationBranch'] is None
          assert p['activeReleaseBranch'] is None
          c=p['completedResults'][0]
          assert c['artifactId']=='dementor-club.result.thing-projection-runtime-v1'
          assert c['version']=='1.0'
          assert c['productionDeployRunId']==35259685738
          assert c['liveRetest']=='PASS_LIVE_RUNTIME_BOUNDARY'
          item=next(x for x in a['currentArtifacts'] if x['artifactId']==c['artifactId'])
          assert item['relation']=='COMPLETED_RESULT'
          assert item['productionDeployAuthorized'] is True
          PY
      - name: Commit closure, remove stale branches and self-remove
        run: |
          rm -f .github/workflows/thing-projection-g8-close.yml
          git config user.name "SLEDZARI"
          git config user.email "sharecraftwideo@gmail.com"
          git add .weekly-os/PROJECT.json .weekly-os/ARTIFACT_INDEX.json .github/workflows/thing-projection-g8-close.yml
          git commit -m "kernel: close ThingProjection Runtime v1 G8"
          git push origin HEAD:dementor-club
          git push origin --delete result/thing-projection-runtime-v1 || true
          git push origin --delete release/thing-projection-runtime-v1 || true
