name: Dementor Lab Character 02 Asset Staging

on:
  push:
    branches:
      - agent/dementor-lab-character02-asset-staging
    paths:
      - dementor-lab/reference/character02-upload-v2/**
      - .github/workflows/dementor-lab-character02-asset-staging.yml

permissions:
  contents: write

jobs:
  assemble-exact-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-character02-asset-staging

      - name: Assemble and verify exact normalized SVG
        shell: bash
        run: |
          set -euo pipefail
          parts='dementor-lab/reference/character02-upload-v2'
          target='dementor-lab/assets/characters/character-02/character-02-layered.svg'
          cat "$parts"/part-*.b64 > /tmp/character-02.svg.xz.b64
          base64 --decode /tmp/character-02.svg.xz.b64 | xz --decompress > "$target"
          actual="$(sha256sum "$target" | awk '{print $1}')"
          expected='afaecaa38e2c3eb9901899b1e48036bfc1e1194f8e03a377a7850857d5e76eab'
          test "$actual" = "$expected"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          path='dementor-lab/assets/characters/character-02/character-02-layered.svg'
          root=ET.parse(path).getroot()
          assert root.attrib.get('viewBox') == '0 0 703 1024'
          ids=[el.attrib['id'] for el in root.iter() if 'id' in el.attrib]
          assert len(ids) == 58, f'unexpected id count: {len(ids)}'
          dup=[key for key,count in Counter(ids).items() if count > 1]
          assert not dup, f'duplicate ids: {dup}'
          required={
            'character-root','body','body-arm-left','body-arm-right','body-leg-left','body-leg-right','body-torso','head-rig','head-base',
            'eyes-neutral','eyes-tense','eyes-sleepy','eyes-overheat','brows-neutral','brows-tense','brows-angry','mouth-neutral','mouth-soft','mouth-tense','mouth-open',
            'hat-01','hat-02','hat-03','hat-04','hat-05','hat-06','hat-07',
            'glasses-01','glasses-02','glasses-03','glasses-04',
            'accessory-01','accessory-02','accessory-03','shoes-01','shoes-primary',
            'pivot-head','pivot-shoulder-left','pivot-shoulder-right','pivot-hip-left','pivot-hip-right'
          }
          missing=sorted(required-set(ids))
          assert not missing, f'missing ids: {missing}'
          assert not any(i.startswith('facial-hair-') for i in ids), 'female source unexpectedly contains facial-hair variants'
          assert not any(i.startswith('outfit-') for i in ids), 'female source unexpectedly contains outfit variants'
          print('exact character-02 SVG staging verification: PASS')
          PY

      - name: Commit assembled asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/assets/characters/character-02/character-02-layered.svg
          git diff --cached --quiet && exit 0
          git commit -m 'feat(lab): assemble exact character-02 SVG asset'
          git push origin HEAD:agent/dementor-lab-character02-asset-staging
