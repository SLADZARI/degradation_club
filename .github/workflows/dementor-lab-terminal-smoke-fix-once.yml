name: Dementor Lab Terminal Smoke Fix Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-terminal-smoke-fix-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply smoke fix
        run: python3 dementor-lab/scripts/patch-browser-smoke-terminal-controls.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-browser-smoke-terminal-controls.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/tests/browser-smoke.mjs dementor-lab/scripts/patch-browser-smoke-terminal-controls.py
          git commit -m 'test(lab): align smoke with terminal controls'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
