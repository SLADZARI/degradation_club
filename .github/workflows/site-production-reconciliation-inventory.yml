name: Build Site Production Reconciliation Inventory

on:
  push:
    branches: [result/site-production-reconciliation-v1]
    paths:
      - '.github/workflows/site-production-reconciliation-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: result/site-production-reconciliation-v1
          fetch-depth: 0
      - name: Fetch authority branches
        run: |
          git fetch origin dementor-club-production:dementor-club-production
          git fetch origin dementor-club-site:dementor-club-site
          git fetch origin dementor-club:dementor-club
      - name: Build inventory
        shell: python
        run: |
          import subprocess, pathlib, collections

          PROD='dementor-club-production'
          SITE='dementor-club-site'
          SEM='dementor-club'
          out=pathlib.Path('operations/SITE_PRODUCTION_RECONCILIATION_INVENTORY_2026-09-17.md')

          def sh(*args, check=True):
              p=subprocess.run(args, text=True, capture_output=True)
              if check and p.returncode:
                  raise RuntimeError(p.stderr)
              return p.stdout.strip()

          prod_sha=sh('git','rev-parse',PROD)
          site_sha=sh('git','rev-parse',SITE)
          merge_base=sh('git','merge-base',PROD,SITE)
          raw=sh('git','diff','--name-status',PROD,SITE)
          rows=[]
          for line in raw.splitlines():
              if not line: continue
              parts=line.split('\t')
              status=parts[0]
              path=parts[-1]
              in_prod=subprocess.run(['git','cat-file','-e',f'{PROD}:{path}'],capture_output=True).returncode==0
              in_site=subprocess.run(['git','cat-file','-e',f'{SITE}:{path}'],capture_output=True).returncode==0
              prod_last=sh('git','log','-1','--format=%cI',PROD,'--',path,check=False) if in_prod else ''
              site_last=sh('git','log','-1','--format=%cI',SITE,'--',path,check=False) if in_site else ''
              grep=subprocess.run(['git','grep','-F',path,SEM,'--','.weekly-os','operations','concept','projects'],text=True,capture_output=True)
              sem_ref=bool(grep.stdout.strip())
              if in_site and not in_prod:
                  preliminary='PRESERVE_REVIEW' if sem_ref else 'OBSOLETE_REVIEW'
              elif in_prod and not in_site:
                  preliminary='PRODUCTION_BASELINE_ONLY'
              else:
                  if prod_last and site_last and prod_last >= site_last:
                      preliminary='SUPERSEDED_REVIEW'
                  else:
                      preliminary='DECISION_REQUIRED'
              prefix=path.split('/')[0] if '/' in path else '(root)'
              rows.append((status,path,in_prod,in_site,prod_last,site_last,sem_ref,preliminary,prefix))

          counts=collections.Counter(r[7] for r in rows)
          prefixes=collections.Counter(r[8] for r in rows)
          text=[]
          text += ['# Site / Production Reconciliation — Exact Inventory','',f'Date: 2026-09-17',f'Production: `{prod_sha}`',f'Staging: `{site_sha}`',f'Merge base: `{merge_base}`','',f'Net differing paths: **{len(rows)}**','']
          text += ['## Preliminary classes','']
          for k,v in sorted(counts.items()): text.append(f'- `{k}`: {v}')
          text += ['','These are **inventory classes, not semantic decisions**. `*_REVIEW` items require evidence before retention/removal.','','## Difference by top-level area','']
          for k,v in prefixes.most_common(): text.append(f'- `{k}`: {v}')
          text += ['','## Detailed inventory','', '| Path | Tree | Prod last | Site last | Semantic ref | Preliminary |','|---|---|---|---|---|---|']
          for status,path,in_prod,in_site,pl,sl,sr,pre,prefix in rows:
              tree=('both' if in_prod and in_site else 'site-only' if in_site else 'prod-only')
              text.append(f'| `{path}` | {tree} | {pl or "—"} | {sl or "—"} | {"yes" if sr else "no"} | `{pre}` |')
          text += ['','## Guardrails','', '- Production is the runtime baseline; this inventory does not authorize overwriting production.', '- A semantic reference is evidence to inspect, not automatic permission to preserve an old implementation.', '- `SUPERSEDED_REVIEW` must still be checked for staging-only developer purpose before discard.', '- No branch realignment is authorized by this inventory alone.','']
          out.write_text('\n'.join(text))
      - name: Commit inventory and self-remove
        run: |
          git config user.name SLEDZARI
          git config user.email sharecraftwideo@gmail.com
          git add operations/SITE_PRODUCTION_RECONCILIATION_INVENTORY_2026-09-17.md
          git commit -m "reconciliation: add exact site-production inventory"
          git rm .github/workflows/site-production-reconciliation-inventory.yml
          git commit -m "chore: remove reconciliation inventory workflow"
          git push origin result/site-production-reconciliation-v1
