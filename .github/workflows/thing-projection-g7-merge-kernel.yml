name: ThingProjection #213 G7 merge kernel

on:
  push:
    branches: [dementor-club]
    paths:
      - .github/workflows/thing-projection-g7-merge-kernel.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dementor-club
          fetch-depth: 0
      - name: Record production merge in kernel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p_path = Path('.weekly-os/PROJECT.json')
          a_path = Path('.weekly-os/ARTIFACT_INDEX.json')
          p = json.loads(p_path.read_text())
          a = json.loads(a_path.read_text())

          assert p['_artifact']['version'] == '1.94'
          assert a['_artifact']['version'] == '1.91'
          cr = p['authority']['currentResult']
          assert cr['artifactId'] == 'dementor-club.result.thing-projection-runtime-v1'
          assert cr['version'] == '0.2'
          assert cr['releaseCandidateCommit'] == '40b5d55cdf8c1fd137dacc7fd2fcee9f62438f01'
          assert cr['productionDeployAuthorized'] is False

          p['_artifact']['version'] = '1.95'
          p['_artifact']['supersedes'] = '1.94'
          p['_artifact']['updated'] = '2026-09-17'
          rf = p['readFirst']
          rf = ['.weekly-os/results/thing-projection-runtime-v1.v0.3.md' if x == '.weekly-os/results/thing-projection-runtime-v1.v0.2.md' else x for x in rf]
          merge_ev = 'operations/THING_PROJECTION_RUNTIME_G7_MERGE_2026-09-17.md'
          rc_ev = 'operations/THING_PROJECTION_RUNTIME_G7_RELEASE_CANDIDATE_2026-09-17.md'
          if merge_ev not in rf:
              rf.insert(rf.index(rc_ev)+1, merge_ev)
          p['readFirst'] = rf
          cr.update({
              'version':'0.3',
              'status':'PRODUCTION_MERGED_DEPLOY_LOCKED',
              'path':'.weekly-os/results/thing-projection-runtime-v1.v0.3.md',
              'productionMergeAuthorized':True,
              'productionDeployAuthorized':False,
              'productionCommit':'23d4266a4009d34042b29ec1fb73fb0cbad6b62e',
              'mergeEvidence':merge_ev,
              'note':'PR #220 merged exact validated RC into production as 23d4266a... after explicit owner authorization. Production deploy remains unauthorized and not run. #202 remains ownership guardrail; #214 remains excluded.'
          })

          a['_artifact']['version'] = '1.92'
          a['_artifact']['supersedes'] = '1.91'
          a['_artifact']['updated'] = '2026-09-17'
          for item in a['currentArtifacts']:
              if item['artifactId'] == 'dementor-club.kernel.project':
                  item['currentVersion'] = '1.95'
                  item['updated'] = '2026-09-17'
              elif item['artifactId'] == 'dementor-club.kernel.artifact-index':
                  item['currentVersion'] = '1.92'
                  item['updated'] = '2026-09-17'
              elif item['artifactId'] == 'dementor-club.result.thing-projection-runtime-v1':
                  item.update({
                      'currentVersion':'0.3',
                      'status':'PRODUCTION_MERGED_DEPLOY_LOCKED',
                      'location':'.weekly-os/results/thing-projection-runtime-v1.v0.3.md',
                      'canonicalLocation':'.weekly-os/results/thing-projection-runtime-v1.v0.3.md',
                      'productionMergeAuthorized':True,
                      'productionDeployAuthorized':False,
                      'productionCommit':'23d4266a4009d34042b29ec1fb73fb0cbad6b62e',
                      'mergeEvidence':merge_ev,
                      'note':'Exact validated PR #220 merged to production; deploy remains unauthorized and not run.'
                  })

          merge_artifact_id = 'dementor-club.operations.thing-projection-runtime-g7-merge-2026-09-17'
          assert not any(x['artifactId'] == merge_artifact_id for x in a['currentArtifacts'])
          a['currentArtifacts'].insert(5, {
              'artifactId': merge_artifact_id,
              'documentType':'RELEASE_EVIDENCE',
              'currentVersion':'1.0',
              'status':'PASS_PRODUCTION_MERGED_DEPLOY_LOCKED',
              'location':merge_ev,
              'sourceSystem':'GIT',
              'authorityType':'RELEASE_EVIDENCE',
              'updated':'2026-09-17',
              'canonicalProject':'dementor-club',
              'canonicalLocation':merge_ev,
              'relation':'G7_MERGE_EVIDENCE',
              'result':'dementor-club.result.thing-projection-runtime-v1',
              'releaseCandidateCommit':'40b5d55cdf8c1fd137dacc7fd2fcee9f62438f01',
              'pullRequest':220,
              'productionCommit':'23d4266a4009d34042b29ec1fb73fb0cbad6b62e',
              'productionDeployAuthorized':False,
              'referencedBy':[]
          })

          p_path.write_text(json.dumps(p, ensure_ascii=False, separators=(',', ':')) + '\n')
          a_path.write_text(json.dumps(a, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
      - name: Verify merge kernel invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.weekly-os/PROJECT.json'))
          a=json.load(open('.weekly-os/ARTIFACT_INDEX.json'))
          cr=p['authority']['currentResult']
          assert p['_artifact']['version']=='1.95'
          assert a['_artifact']['version']=='1.92'
          assert cr['version']=='0.3'
          assert cr['status']=='PRODUCTION_MERGED_DEPLOY_LOCKED'
          assert cr['productionCommit']=='23d4266a4009d34042b29ec1fb73fb0cbad6b62e'
          assert cr['productionMergeAuthorized'] is True
          assert cr['productionDeployAuthorized'] is False
          assert p['activeReleaseBranch']=='release/thing-projection-runtime-v1'
          assert any(x['artifactId']=='dementor-club.operations.thing-projection-runtime-g7-merge-2026-09-17' for x in a['currentArtifacts'])
          PY
      - name: Commit kernel finalization and self-remove
        run: |
          rm -f .github/workflows/thing-projection-g7-merge-kernel.yml
          git config user.name "SLEDZARI"
          git config user.email "sharecraftwideo@gmail.com"
          git add .weekly-os/PROJECT.json .weekly-os/ARTIFACT_INDEX.json .github/workflows/thing-projection-g7-merge-kernel.yml
          git commit -m "kernel: record ThingProjection v1 production merge"
          git push origin HEAD:dementor-club

# retrigger after workflow registration
