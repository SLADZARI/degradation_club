name: Design Batch 5B Route Owner Sweep

on:
  push:
    branches:
      - design-audit-batch-2026-08-27

permissions:
  contents: write

jobs:
  route-owner-sweep:
    if: ${{ !contains(github.event.head_commit.message, '[route-owner-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply route owner sweep
        run: node scripts/batch5b-route-owner-sweep.mjs
      - name: Refresh style graph
        run: node scripts/audit-style-graph.mjs
      - name: Run full design audits
        run: |
          node scripts/audit-dementor-hero.mjs
          node scripts/audit-event-hero.mjs
          node scripts/audit-feature-relation.mjs
          node scripts/audit-ink-surfaces.mjs
          node scripts/audit-inline-styles.mjs
          node scripts/audit-cascade-pressure.mjs
          node scripts/audit-presentation-pressure.mjs
          node scripts/audit-compatibility-layers.mjs
          node scripts/audit-mobile-guardrails.mjs
          node scripts/audit-ui-pressure.mjs
          node scripts/audit-component-owner-hardening.mjs
          node scripts/audit-route-owner-sweep.mjs
      - name: Commit route owner sweep
        run: |
          git config user.name "Dementor Design Audit"
          git config user.email "design-audit@users.noreply.github.com"
          git add -A '*.css' artifacts/design-style-graph.json artifacts/design-batch5b-route-owner-report.json
          if git diff --cached --quiet; then
            echo "No Batch 5B route owner changes"
            exit 0
          fi
          git commit -m "Batch 5B: sweep route and course owners [route-owner-auto]"
          git pull --rebase origin design-audit-batch-2026-08-27
          git push origin HEAD:design-audit-batch-2026-08-27
