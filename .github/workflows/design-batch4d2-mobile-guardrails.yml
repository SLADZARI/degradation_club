name: Design Batch 4D.2 Mobile Guardrails

on:
  push:
    branches:
      - design-audit-batch-2026-08-27

permissions:
  contents: write

jobs:
  mobile-guardrails:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-guardrails-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply mobile guardrail consolidation
        run: node scripts/batch4d2-mobile-guardrails.mjs
      - name: Run full design audits
        run: |
          node scripts/audit-style-graph.mjs
          node scripts/audit-dementor-hero.mjs
          node scripts/audit-event-hero.mjs
          node scripts/audit-feature-relation.mjs
          node scripts/audit-ink-surfaces.mjs
          node scripts/audit-inline-styles.mjs
          node scripts/audit-cascade-pressure.mjs
          node scripts/audit-presentation-pressure.mjs
          node scripts/audit-compatibility-layers.mjs
          node scripts/audit-mobile-guardrails.mjs
      - name: Commit mobile guardrail consolidation
        run: |
          git config user.name "Dementor Design Audit"
          git config user.email "design-audit@users.noreply.github.com"
          git add -A styles.css ui-v2.css mobile-guardrails.css mobile-qa.css mobile-overflow-fix.css artifacts/design-style-graph.json
          if git diff --cached --quiet; then
            echo "No mobile guardrail changes"
            exit 0
          fi
          git commit -m "Batch 4D.2: consolidate mobile guardrails [mobile-guardrails-auto]"
          git pull --rebase origin design-audit-batch-2026-08-27
          git push origin HEAD:design-audit-batch-2026-08-27
