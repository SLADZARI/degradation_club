name: Dementor Lab Trigger Count Patch Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-trigger-count-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply trigger count patch
        run: python3 dementor-lab/scripts/patch-trigger-configured-count.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-trigger-configured-count.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/ui/app.mjs dementor-lab/scripts/patch-trigger-configured-count.py
          git commit -m 'feat(lab): show configured brain inputs'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
