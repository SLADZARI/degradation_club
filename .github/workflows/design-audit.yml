name: Design Audit

on:
  push:
    branches:
      - design-audit-batch-2026-08-27
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run style graph audit
        run: node scripts/audit-style-graph.mjs
      - name: Run Dementor HERO contract audit
        run: node scripts/audit-dementor-hero.mjs
      - name: Run Event HERO contract audit
        run: node scripts/audit-event-hero.mjs
      - name: Run FEATURE and RELATION contract audit
        run: node scripts/audit-feature-relation.mjs
      - name: Run Ink surface contract audit
        run: node scripts/audit-ink-surfaces.mjs
      - name: Run inline style ownership audit
        run: node scripts/audit-inline-styles.mjs
      - name: Run cascade pressure audit
        run: node scripts/audit-cascade-pressure.mjs
      - name: Run presentation pressure audit
        run: node scripts/audit-presentation-pressure.mjs
      - name: Run compatibility layer audit
        run: node scripts/audit-compatibility-layers.mjs
      - name: Print generated graph
        run: cat artifacts/design-style-graph.json
      - uses: actions/upload-artifact@v4
        with:
          name: design-style-graph
          path: artifacts/design-style-graph.json
