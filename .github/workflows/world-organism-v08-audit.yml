name: WORLD ORGANISM v0.8 — published snapshot audit

on:
  push:
    branches:
      - qa/world-organism-v0-8-contract-2026-10-19
      - qa/world-organism-v0-8-sustainability-2026-10-19
      - qa/world-organism-v0-8-sponsored-services-2026-10-19
      - qa/world-organism-v0-8-federation-2026-10-19
      - qa/world-organism-v0-8-food-access-2026-10-19
      - qa/world-organism-v0-8-food-access-basic-2026-10-19
      - qa/world-organism-v0-8-fairness-budget-2026-10-19
    paths:
      - ".github/workflows/world-organism-v08-audit.yml"
      - "projects/dementor-live/first-home-loop/balance-lab/v0_8/**"
  pull_request:
    branches:
      - docs/dementor-live-global-audit-05
    paths:
      - ".github/workflows/world-organism-v08-audit.yml"
      - "projects/dementor-live/first-home-loop/balance-lab/v0_8/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-organism-v08-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run independent D30 accounting and negative-control checks
        working-directory: projects/dementor-live/first-home-loop/balance-lab/v0_8
        run: node --test tests/snapshot-contract.test.mjs
      - name: Forward simulator reproducibility (288 combinations; stepwise invariants)
        working-directory: projects/dementor-live/first-home-loop/balance-lab/v0_8/experimental
        run: node --test shadow-model.test.mjs quality-gates.test.mjs long-run.test.mjs sponsored-services.test.mjs project-registry.test.mjs
      - name: Export deterministic projections / D60-D90-D120 and +180/+360 day horizons
        working-directory: projects/dementor-live/first-home-loop/balance-lab/v0_8/experimental
        run: node run-projection.mjs reports
      - name: Federation model 10-20 agents, 2-4 cities, 324 scenarios / 2 ownership policies
        working-directory: projects/dementor-live/first-home-loop/balance-lab/v0_8/experimental
        run: node --test federation-model.test.mjs food-access.test.mjs basic-access.test.mjs fairness-budget.test.mjs
      - name: Archive federation balance and logistics data
        working-directory: projects/dementor-live/first-home-loop/balance-lab/v0_8/experimental
        run: node run-federation.mjs reports
      - name: Attach complete per-scenario data and short report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-organism-v083-federation-324-plus-b5-economy-report
          path: projects/dementor-live/first-home-loop/balance-lab/v0_8/experimental/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Boundary of these tests
        if: always()
        run: |
          echo "## What this validates" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-checks consistency of the published WORLD ORGANISM v0.8 aggregate D30 JSON and its docs, including tamper controls." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## What this does NOT validate" >> "$GITHUB_STEP_SUMMARY"
          echo "No ORIGINAL runnable v0.8 simulator or original agent code is present. v0.8.2 + federation v0.8.3 are explicitly experimental shadow models, not game code." >> "$GITHUB_STEP_SUMMARY"
          echo "Original 52/52, original 36 stress runs, original 41 invariants, and original browser UI remain unverified. New shadow model and tests are NOT a replay of original v0.8." >> "$GITHUB_STEP_SUMMARY"
          echo "Live Dementor game runtime and persistent world are not touched." >> "$GITHUB_STEP_SUMMARY"
