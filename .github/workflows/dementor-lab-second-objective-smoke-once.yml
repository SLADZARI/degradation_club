name: Dementor Lab Second Objective Smoke Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-second-objective-smoke-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Patch browser smoke
        run: python3 dementor-lab/scripts/patch-browser-second-objective.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-browser-second-objective.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/tests/browser-smoke.mjs dementor-lab/scripts/patch-browser-second-objective.py
          git commit -m 'test(lab): cover second objective on iPhone flow'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
