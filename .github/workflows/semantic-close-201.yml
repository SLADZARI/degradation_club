name: One-shot semantic closure #201

on:
  push:
    branches:
      - dementor-club
    paths:
      - .github/workflows/semantic-close-201.yml

permissions:
  contents: write

jobs:
  close-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dementor-club
          fetch-depth: 0

      - name: Apply targeted kernel closure
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          project_path = Path('.weekly-os/PROJECT.json')
          index_path = Path('.weekly-os/ARTIFACT_INDEX.json')

          project = json.loads(project_path.read_text())
          index = json.loads(index_path.read_text())

          # PROJECT targeted closure
          a = project['_artifact']
          a['version'] = '1.89'
          a['supersedes'] = '1.88'
          a['updated'] = '2026-09-17'
          a['projectStage'] = 'RELEASE'
          a['gate'] = 'G8_CLEANUP'
          project['projectStage'] = 'RELEASE'
          project['gate'] = 'G8_CLEANUP'

          preferred = [
              '.weekly-os/results/evidence-hygiene-v1.v1.0.md',
              'operations/EVIDENCE_HYGIENE_G8_2026-09-17.md',
              'operations/EVIDENCE_HYGIENE_LIVE_RETEST_2026-09-17.md',
              'operations/EVIDENCE_HYGIENE_PAGES_RELEASE_2026-09-17.md',
          ]
          old_current = '.weekly-os/results/evidence-hygiene-v1.v0.8.md'
          rest = [p for p in project.get('readFirst', []) if p not in preferred and p != old_current]
          base = rest[:3]
          tail = rest[3:]
          project['readFirst'] = base + preferred + tail

          completed = project.setdefault('completedResults', [])
          completed = [r for r in completed if r.get('artifactId') != 'dementor-club.result.evidence-hygiene-v1']
          completed.insert(0, {
              'artifactId': 'dementor-club.result.evidence-hygiene-v1',
              'version': '1.0',
              'status': 'APPROVED',
              'path': '.weekly-os/results/evidence-hygiene-v1.v1.0.md',
              'gate': 'G8_CLEANUP',
              'issue': 201,
              'candidateCommit': '0a9687266aa27ea2bd40fa12099052e1308b6ae2',
              'integrationPullRequest': 216,
              'validationRun': 1199,
              'validationRunId': 35161854100,
              'validationConclusion': 'SUCCESS',
              'productionCommit': '374defbe583fac0839a43611b151d1104b47a42b',
              'backendDeployRunId': 35150249462,
              'backendDeployStatus': 'SUCCESS',
              'productionDeployRun': 119,
              'productionDeployRunId': 35211118478,
              'pagesArtifactId': 10492111474,
              'pagesArtifactDigest': 'sha256:e076fe6c94bb5b009d52d1f2395987b9ad05e2a478d63b875966903087e3ca8a',
              'productionDeployStatus': 'SUCCESS',
              'liveRetest': 'PASS_LAYERED_PRODUCTION_EVIDENCE',
              'liveEvidence': 'operations/EVIDENCE_HYGIENE_LIVE_RETEST_2026-09-17.md',
              'g8Evidence': 'operations/EVIDENCE_HYGIENE_G8_2026-09-17.md',
              'historicalCaveat': 'pre-cutover evidence may contain QA/internal activity'
          })
          project['completedResults'] = completed
          project['currentResult'] = None
          project['activeIntegrationBranch'] = None
          project['activeReleaseBranch'] = None

          guard = 'Evidence Hygiene G8 closure as automatic #213 activation'
          if guard not in project.get('doNotInfer', []):
              project.setdefault('doNotInfer', []).append(guard)

          # ARTIFACT_INDEX targeted closure
          ia = index['_artifact']
          ia['version'] = '1.86'
          ia['supersedes'] = '1.85'
          ia['updated'] = '2026-09-17'
          ia['projectStage'] = 'RELEASE'
          ia['gate'] = 'G8_CLEANUP'

          for item in index.get('currentArtifacts', []):
              if item.get('artifactId') == 'dementor-club.kernel.project':
                  item['currentVersion'] = '1.89'
              elif item.get('artifactId') == 'dementor-club.kernel.artifact-index':
                  item['currentVersion'] = '1.86'
              elif item.get('artifactId') == 'dementor-club.result.evidence-hygiene-v1':
                  item.update({
                      'currentVersion': '1.0',
                      'status': 'APPROVED',
                      'location': '.weekly-os/results/evidence-hygiene-v1.v1.0.md',
                      'canonicalLocation': '.weekly-os/results/evidence-hygiene-v1.v1.0.md',
                      'relation': 'COMPLETED_RESULT',
                      'gate': 'G8_CLEANUP',
                      'productionCommit': '374defbe583fac0839a43611b151d1104b47a42b',
                      'backendDeployRunId': 35150249462,
                      'backendDeployStatus': 'SUCCESS',
                      'pagesDeployRun': 119,
                      'pagesDeployRunId': 35211118478,
                      'pagesDeployAttempt': 2,
                      'pagesDeployStatus': 'SUCCESS',
                      'pagesArtifactId': 10492111474,
                      'pagesArtifactDigest': 'sha256:e076fe6c94bb5b009d52d1f2395987b9ad05e2a478d63b875966903087e3ca8a',
                      'liveRetest': 'PASS_LAYERED_PRODUCTION_EVIDENCE',
                      'liveEvidence': 'operations/EVIDENCE_HYGIENE_LIVE_RETEST_2026-09-17.md',
                      'g8Evidence': 'operations/EVIDENCE_HYGIENE_G8_2026-09-17.md',
                      'note': 'Completed and G8-closed through layered production evidence. Canonical Pages run #119 / 35211118478 attempt 2 deployed exact production 374defbe...; backend run 35150249462 SUCCESS; #213 not activated. Historical caveat: pre-cutover evidence may contain QA/internal activity.'
                  })
                  item.pop('integrationBranch', None)

          refs = index.setdefault('referenceArtifacts', [])
          def upsert(ref):
              aid = ref['artifactId']
              for i, existing in enumerate(refs):
                  if existing.get('artifactId') == aid:
                      refs[i] = ref
                      return
              refs.insert(0, ref)

          upsert({
              'artifactId': 'dementor-club.evidence.evidence-hygiene-live-retest-2026-09-17',
              'documentType': 'QA_EVIDENCE',
              'status': 'PASS_LAYERED_PRODUCTION_EVIDENCE',
              'location': 'operations/EVIDENCE_HYGIENE_LIVE_RETEST_2026-09-17.md',
              'sourceSystem': 'GIT',
              'authorityType': 'EVIDENCE',
              'note': 'Layered production proof: backend production verification + exact deployed-code automated acceptance + canonical exact-SHA Pages deploy + read-only live serving smoke. No claim of repeated live analytics network interception.',
              'referencedBy': ['dementor-club.result.evidence-hygiene-v1']
          })
          upsert({
              'artifactId': 'dementor-club.evidence.evidence-hygiene-g8-2026-09-17',
              'documentType': 'QA_EVIDENCE',
              'status': 'APPROVED_EVIDENCE',
              'location': 'operations/EVIDENCE_HYGIENE_G8_2026-09-17.md',
              'sourceSystem': 'GIT',
              'authorityType': 'EVIDENCE',
              'note': 'G8 PASS for Evidence Hygiene v1; active ownership retired, legacy release-control duplication retained as separate follow-up, no #213 activation.',
              'referencedBy': ['dementor-club.result.evidence-hygiene-v1']
          })

          project_path.write_text(json.dumps(project, ensure_ascii=False, separators=(',', ':')) + '\n')
          index_path.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

      - name: Verify closure invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.weekly-os/PROJECT.json'))
          i=json.load(open('.weekly-os/ARTIFACT_INDEX.json'))
          a=json.load(open('.weekly-os/APPROVED_STATE.json'))
          assert p['_artifact']['version']=='1.89'
          assert p['currentResult'] is None
          assert p['activeIntegrationBranch'] is None
          assert p['activeReleaseBranch'] is None
          assert any(r.get('artifactId')=='dementor-club.result.evidence-hygiene-v1' and r.get('version')=='1.0' for r in p['completedResults'])
          assert i['_artifact']['version']=='1.86'
          eh=next(x for x in i['currentArtifacts'] if x.get('artifactId')=='dementor-club.result.evidence-hygiene-v1')
          assert eh['currentVersion']=='1.0' and eh['relation']=='COMPLETED_RESULT' and eh['status']=='APPROVED'
          assert a['_artifact']['version']=='1.0'
          print('kernel closure invariants PASS')
          PY

      - name: Commit closure and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/semantic-close-201.yml
          git config user.name "SLEDZARI"
          git config user.email "sharecraftwideo@gmail.com"
          git add .weekly-os/PROJECT.json .weekly-os/ARTIFACT_INDEX.json .github/workflows/semantic-close-201.yml
          git commit -m "docs: close #201 kernel and index"
          git push origin HEAD:dementor-club
