name: Dementor Lab Stabilization Round Two B Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-stabilization-round2b-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply follow-up patch
        run: python3 dementor-lab/scripts/patch-stabilization-round2b.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-stabilization-round2b.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab .github/workflows/dementor-lab-stabilization-round2b-once.yml
          git commit -m 'fix(lab): finish person and replay cleanup'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
