name: Dementor Lab Direct Answer Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-direct-answer-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply direct-answer runtime support
        run: python3 dementor-lab/scripts/patch-direct-answer-objective.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-direct-answer-objective.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/encounter/runtime.mjs dementor-lab/scripts/patch-direct-answer-objective.py
          git commit -m 'feat(lab): support direct-answer objective'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
