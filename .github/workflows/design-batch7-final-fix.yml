name: Design Batch 7 Final Fix

on:
  push:
    branches:
      - design-audit-batch-2026-08-27

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[batch7-final-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Batch 7 final blocker package
        run: node scripts/batch7-fix-final.mjs
      - name: Commit package
        run: |
          git config user.name "Dementor Design Audit"
          git config user.email "design-audit@users.noreply.github.com"
          git add home-v1.css about-v1.css visual-standard-v2.css design-system/ui-lab-v2.css dementor-relations-v1.js
          if git diff --cached --quiet; then
            echo "No Batch 7 final changes"
            exit 0
          fi
          git commit -m "Batch 7: fix all remaining responsive blockers [batch7-final-auto]"
          git pull --rebase origin design-audit-batch-2026-08-27
          git push origin HEAD:design-audit-batch-2026-08-27
