name: Dementor Lab Readable Conversation Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-readable-conversation-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply conversational brain projection
        run: python3 dementor-lab/scripts/patch-readable-conversation.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-readable-conversation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/ui/app.mjs dementor-lab/tests/browser-smoke.mjs dementor-lab/scripts/patch-readable-conversation.py
          git commit -m 'feat(lab): make readable brain conversational'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
