name: Dementor Lab Smoke Current Flow Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-smoke-current-flow-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply current smoke flow patch
        run: python3 dementor-lab/scripts/patch-smoke-current-flow.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-smoke-current-flow.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab .github/workflows/dementor-lab-smoke-current-flow-once.yml
          git commit -m 'test(lab): follow current mobile flow'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
