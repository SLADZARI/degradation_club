name: Dementor Lab Character Reactions Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-character-reactions-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply character reaction patch
        run: python3 dementor-lab/scripts/patch-character-reactions.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-character-reactions.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/render/character-renderer.mjs dementor-lab/src/ui/app.mjs dementor-lab/character.css dementor-lab/tests/character-renderer-selftest.mjs dementor-lab/tests/browser-smoke.mjs dementor-lab/scripts/patch-character-reactions.py
          git commit -m 'feat(lab): project turn consequences onto characters'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
