name: One-shot semantic post-merge 202

on:
  push:
    branches: [dementor-club]
    paths:
      - '.github/workflows/semantic-post-merge-202.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dementor-club
          fetch-depth: 0
      - name: Record #202 production merge state
        shell: python
        run: |
          import json
          from pathlib import Path

          project_path = Path('.weekly-os/PROJECT.json')
          index_path = Path('.weekly-os/ARTIFACT_INDEX.json')
          project = json.loads(project_path.read_text())
          index = json.loads(index_path.read_text())

          cur = project['authority']['currentResult']
          assert cur['artifactId'] == 'dementor-club.result.catalog-release-truth-v1'
          assert cur['version'] == '0.2'
          assert cur['gate'] == 'G7_RELEASE'
          assert cur['candidateCommit'] == 'e24c3811803b4bf6443f54a30bd9c15495cd54d1'
          assert cur['releasePullRequest'] == 223
          assert cur['productionMergeAuthorized'] is False
          assert cur['productionDeployAuthorized'] is False
          assert project['_artifact']['version'] == '2.01'
          assert index['_artifact']['version'] == '1.98'

          evidence_path = Path('operations/CATALOG_RELEASE_TRUTH_G7_MERGE_2026-09-17.md')
          assert not evidence_path.exists()
          evidence_path.write_text('''---
          artifactId: dementor-club.operations.catalog-release-truth-g7-merge-2026-09-17
          project: dementor-club
          documentType: RELEASE_EVIDENCE
          projectStage: RELEASE
          gate: G7_RELEASE
          status: PASS_PRODUCTION_MERGED_DEPLOY_LOCKED
          version: 1.0
          updated: 2026-09-17
          owner: Modern Pilgrims
          sourceSystem: GIT
          authorityType: RELEASE_EVIDENCE
          result: dementor-club.result.catalog-release-truth-v1
          ---

          # Catalog / Release Truth v1 — G7 production merge evidence

          ## Result
          `dementor-club.result.catalog-release-truth-v1`

          ## Authorized action
          Owner explicitly authorized production merge of PR #223 on 2026-09-17, only for unchanged RC head `e24c3811803b4bf6443f54a30bd9c15495cd54d1`. Production deploy remained explicitly unauthorized.

          ## Validated release candidate
          - production baseline before merge: `23d4266a4009d34042b29ec1fb73fb0cbad6b62e`
          - clean release candidate: `e24c3811803b4bf6443f54a30bd9c15495cd54d1`
          - PR: `#223`
          - production-target Site Integrity run: `35275186704` / #1204
          - conclusion: `SUCCESS`
          - approved diff: exactly four files

          ## Production merge
          - merge method: merge commit
          - production commit: `2dae3b6ece79652c81af780c049521fda7262726`
          - parent 1: `23d4266a4009d34042b29ec1fb73fb0cbad6b62e`
          - parent 2: `e24c3811803b4bf6443f54a30bd9c15495cd54d1`
          - production head after merge: `2dae3b6ece79652c81af780c049521fda7262726`
          - compare from prior production: `behind_by=0`; changed files exactly match approved #202 RC

          Approved production diff:
          - `.github/production-release.txt`
          - `.github/workflows/site-integrity.yml`
          - `catalog/index.html`
          - `scripts/validate-catalog-release-truth-v1.mjs`

          ## Deploy guard
          After merge, no new `Deploy Dementor Production` run was created for `2dae3b6ece79652c81af780c049521fda7262726`. Latest production deploy remains manual `workflow_dispatch` run `35259685738` on prior production commit `23d4266a4009d34042b29ec1fb73fb0cbad6b62e`.

          - production merge: COMPLETE
          - production deploy authorization: FALSE
          - production deploy: NOT RUN
          - live retest: NOT RUN
          - G8 cleanup: NOT STARTED
          - next runtime Result: NOT STARTED

          `MERGE ≠ DEPLOY AUTHORIZATION ≠ DEPLOY ≠ LIVE RETEST ≠ G8`
          '''.replace('          ', '', 1), encoding='utf-8')

          result_path = Path('.weekly-os/results/catalog-release-truth-v1.v0.3.md')
          assert not result_path.exists()
          result_path.write_text('''---
          artifactId: dementor-club.result.catalog-release-truth-v1
          project: dementor-club
          documentType: RESULT
          projectStage: RELEASE
          gate: G7_RELEASE
          status: DRAFT
          version: 0.3
          updated: 2026-09-17
          owner: Modern Pilgrims
          sourceSystem: GIT
          authorityType: IMPLEMENTATION_AUTHORITY
          issue: 202
          integrationBranch: result/catalog-release-truth-v1
          releaseBranch: release/catalog-release-truth-v1
          productionBaseCommit: 23d4266a4009d34042b29ec1fb73fb0cbad6b62e
          candidateCommit: e24c3811803b4bf6443f54a30bd9c15495cd54d1
          integrationPullRequest: 222
          stagingMergeCommit: 61d85d95bd95dfb536acdd363b45d2773a4b2ca5
          releasePullRequest: 223
          validationRunId: 35274121432
          releaseValidationRunId: 35275186704
          validationConclusion: SUCCESS
          productionCommit: 2dae3b6ece79652c81af780c049521fda7262726
          activationAuthorized: true
          implementationStartAuthorized: true
          productionMergeAuthorized: true
          productionDeployAuthorized: false
          liveDatabaseMutationAuthorized: false
          ---

          # Catalog / Release Truth v1

          **STATUS: G7 RELEASE / PRODUCTION MERGED / DEPLOY LOCKED**  
          **ISSUE:** #202  
          **INTEGRATION BRANCH:** `result/catalog-release-truth-v1`  
          **RELEASE BRANCH:** `release/catalog-release-truth-v1`  
          **PRODUCTION BASELINE BEFORE MERGE:** `23d4266a4009d34042b29ec1fb73fb0cbad6b62e`  
          **VALIDATED RC:** `e24c3811803b4bf6443f54a30bd9c15495cd54d1`  
          **PRODUCTION PR:** #223  
          **PRODUCTION COMMIT:** `2dae3b6ece79652c81af780c049521fda7262726`

          ## Goal

          Remove stale-truth behavior from the public Catalog and production release-status documentation without creating a universal registry, second Product authority, or new deployment-status owner.

          ## Implemented boundary

          - Catalog no longer exposes hard volatile global/category counts as current truth.
          - Catalog row state cells identify source/provenance rather than reasserting lifecycle/readiness.
          - Approved `DEMENTOR LAB` Project navigation is present independently of any `dc_entities` row.
          - `.github/production-release.txt` is explicitly a non-authoritative reference pointing to GitHub Actions deployment truth.
          - CI prevents these stale-truth semantics from being silently reintroduced.

          ## Validation and release evidence

          - G6: `operations/CATALOG_RELEASE_TRUTH_G6_2026-09-17.md`
          - Staging PR #222 merged after validation: `61d85d95bd95dfb536acdd363b45d2773a4b2ca5`.
          - G7 clean RC: `operations/CATALOG_RELEASE_TRUTH_G7_RELEASE_CANDIDATE_2026-09-17.md`
          - Production-target CI run `35275186704` / #1204: `SUCCESS`.
          - Production merge evidence: `operations/CATALOG_RELEASE_TRUTH_G7_MERGE_2026-09-17.md`
          - Production merge commit: `2dae3b6ece79652c81af780c049521fda7262726`.
          - Post-merge compare from `23d4266a...` shows only the four approved #202 files and `behind_by=0`.

          ## Incident note

          G6 run `35274121432` attempt 1 had one non-reproducing synthetic WebKit PKCE timeout. Attempt 2 on the exact same candidate commit, without code changes, passed the complete workflow including WebKit auth and final release guards.

          ## Explicit non-goals / exclusions

          - no universal Thing/entity registry;
          - no `dc_entities` expansion for Projects;
          - no #199 merch source-truth decision;
          - no #204 Fuengirola eligibility decision;
          - no #214 activation/contribution decision;
          - no Board IA / Relations work;
          - no membership/auth changes;
          - no database migration.

          ## Current authorization boundary

          `productionMergeAuthorized = true`  
          `productionDeployAuthorized = false`

          Production code is merged but not deployed. No live retest or G8 cleanup is claimed. No next runtime Result may start before the separate deploy gate, deploy, live retest and G8 closure of #202.
          '''.replace('          ', '', 1), encoding='utf-8')

          # PROJECT kernel
          project['_artifact']['version'] = '2.02'
          project['_artifact']['supersedes'] = '2.01'
          project['_artifact']['projectStage'] = 'RELEASE'
          project['_artifact']['gate'] = 'G7_RELEASE'
          project['projectStage'] = 'RELEASE'
          project['gate'] = 'G7_RELEASE'
          rf = project['readFirst']
          old_result = '.weekly-os/results/catalog-release-truth-v1.v0.2.md'
          new_result = '.weekly-os/results/catalog-release-truth-v1.v0.3.md'
          assert old_result in rf
          rf[rf.index(old_result)] = new_result
          merge_ev = 'operations/CATALOG_RELEASE_TRUTH_G7_MERGE_2026-09-17.md'
          if merge_ev not in rf:
              rf.insert(rf.index(new_result) + 1, merge_ev)
          cur.update({
              'version': '0.3',
              'path': new_result,
              'productionCommit': '2dae3b6ece79652c81af780c049521fda7262726',
              'productionMergeAuthorized': True,
              'productionDeployAuthorized': False,
              'mergeEvidence': merge_ev,
              'note': 'Production merged exact validated #202 RC as 2dae3b6e...; deploy remains explicitly locked. No live retest/G8 closure and no next runtime Result until separate deploy authorization.'
          })

          # ARTIFACT_INDEX kernel
          index['_artifact']['version'] = '1.99'
          index['_artifact']['supersedes'] = '1.98'
          index['_artifact']['projectStage'] = 'RELEASE'
          index['_artifact']['gate'] = 'G7_RELEASE'
          entries = index['currentArtifacts']
          by_id = {e['artifactId']: e for e in entries}
          assert by_id['dementor-club.kernel.project']['currentVersion'] == '2.01'
          assert by_id['dementor-club.kernel.artifact-index']['currentVersion'] == '1.98'
          by_id['dementor-club.kernel.project']['currentVersion'] = '2.02'
          by_id['dementor-club.kernel.artifact-index']['currentVersion'] = '1.99'
          r = by_id['dementor-club.result.catalog-release-truth-v1']
          assert r['currentVersion'] == '0.2'
          r.update({
              'currentVersion': '0.3',
              'location': new_result,
              'canonicalLocation': new_result,
              'gate': 'G7_RELEASE',
              'candidateCommit': 'e24c3811803b4bf6443f54a30bd9c15495cd54d1',
              'releasePullRequest': 223,
              'productionCommit': '2dae3b6ece79652c81af780c049521fda7262726',
              'productionMergeAuthorized': True,
              'productionDeployAuthorized': False,
              'mergeEvidence': merge_ev,
              'note': 'Production merged exact validated RC; deploy locked pending separate authorization.'
          })
          evidence_id = 'dementor-club.operations.catalog-release-truth-g7-merge-2026-09-17'
          assert evidence_id not in by_id
          entries.append({
              'artifactId': evidence_id,
              'documentType': 'RELEASE_EVIDENCE',
              'currentVersion': '1.0',
              'status': 'PASS_PRODUCTION_MERGED_DEPLOY_LOCKED',
              'location': merge_ev,
              'sourceSystem': 'GIT',
              'authorityType': 'RELEASE_EVIDENCE',
              'updated': '2026-09-17',
              'canonicalProject': 'dementor-club',
              'canonicalLocation': merge_ev,
              'relation': 'G7_MERGE_EVIDENCE',
              'result': 'dementor-club.result.catalog-release-truth-v1',
              'releaseCandidateCommit': 'e24c3811803b4bf6443f54a30bd9c15495cd54d1',
              'pullRequest': 223,
              'productionCommit': '2dae3b6ece79652c81af780c049521fda7262726',
              'productionDeployAuthorized': False,
              'referencedBy': []
          })

          project_path.write_text(json.dumps(project, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          index_path.write_text(json.dumps(index, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          Path('.github/workflows/semantic-post-merge-202.yml').unlink()
      - name: Verify checkpoint invariants
        shell: python
        run: |
          import json
          from pathlib import Path
          p=json.loads(Path('.weekly-os/PROJECT.json').read_text())
          i=json.loads(Path('.weekly-os/ARTIFACT_INDEX.json').read_text())
          c=p['authority']['currentResult']
          assert p['_artifact']['version']=='2.02' and p['gate']=='G7_RELEASE'
          assert i['_artifact']['version']=='1.99'
          assert c['version']=='0.3'
          assert c['productionCommit']=='2dae3b6ece79652c81af780c049521fda7262726'
          assert c['productionMergeAuthorized'] is True
          assert c['productionDeployAuthorized'] is False
          assert Path('operations/CATALOG_RELEASE_TRUTH_G7_MERGE_2026-09-17.md').exists()
          assert Path('.weekly-os/results/catalog-release-truth-v1.v0.3.md').exists()
          assert not Path('.github/workflows/semantic-post-merge-202.yml').exists()
      - name: Commit semantic checkpoint and self-remove
        run: |
          git config user.name 'SLEDZARI'
          git config user.email 'sharecraftwideo@gmail.com'
          git add .weekly-os/PROJECT.json .weekly-os/ARTIFACT_INDEX.json .weekly-os/results/catalog-release-truth-v1.v0.3.md operations/CATALOG_RELEASE_TRUTH_G7_MERGE_2026-09-17.md .github/workflows/semantic-post-merge-202.yml
          git commit -m 'kernel(#202): record production merge and hold deploy'
          git push origin HEAD:dementor-club
