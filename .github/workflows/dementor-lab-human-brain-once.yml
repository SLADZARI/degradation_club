name: Dementor Lab Human Brain Patch Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-human-brain-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply human brain patch
        run: python3 dementor-lab/scripts/patch-brain-human-sections.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-brain-human-sections.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/ui/app.mjs dementor-lab/scripts/patch-brain-human-sections.py
          git commit -m 'feat(lab): make brain behavior section human-readable'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
