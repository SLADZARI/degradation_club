name: Production Candidate Integrity

on:
  pull_request:
    branches:
      - dementor-club-production
  push:
    branches:
      - dementor-club-production
      - release/dementor-production-2026-08-29-rc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate registry, routes and feature state
        run: node scripts/validate-site.mjs

      - name: Validate page content readiness registry
        run: node scripts/validate-content-readiness.mjs

      - name: Validate visual contract
        run: node scripts/validate-visual-contract.mjs

      - name: Build production artifact without deploying
        run: node scripts/build-pages.mjs

      - name: Validate production analytics and consent
        run: node scripts/validate-production-analytics.mjs

      - name: Validate production artifact and release gate
        run: node scripts/validate-production-release.mjs
