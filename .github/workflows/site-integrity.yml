name: Site Integrity / Release Readiness

on:
  push:
    branches:
      - dementor-club-site
  pull_request:
    branches:
      - dementor-club-site
      - dementor-club-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate registry, routes and feature state
        run: node scripts/validate-site.mjs
      - name: Validate page content readiness
        run: node scripts/validate-content-readiness.mjs
      - name: Validate visual contract
        run: node scripts/validate-visual-contract.mjs
      - name: Build production candidate artifact
        run: node scripts/build-pages.mjs
      - name: Validate production analytics and consent
        run: node scripts/validate-production-analytics.mjs
      - name: Validate canonical shell integration
        run: node scripts/validate-shell-contract.mjs
      - name: Validate built JavaScript syntax
        run: node scripts/validate-built-js-syntax.mjs
      - name: Install browser smoke runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate browser shell and Workspace recovery
        run: node scripts/validate-browser-shell.mjs
      - name: Validate production route manifest
        run: node scripts/validate-route-manifest.mjs
      - name: Validate production artifact release gate
        run: node scripts/validate-production-release.mjs
