name: Design Batch 1 Cascade Cleanup

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify cascade cleanup remains applied
        run: |
          node scripts/audit-style-graph.mjs
          node - <<'NODE'
          const fs=require('fs');
          const graph=JSON.parse(fs.readFileSync('artifacts/design-style-graph.json','utf8'));
          if(graph.duplicateStylesheetRoutes.length) process.exit(1);
          if(graph.globalImports.includes('/home-visual-standard-v2.css')) process.exit(1);
          console.log('Batch 1 cascade gate passed');
          NODE
