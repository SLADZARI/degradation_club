name: Design Batch 1 Roster Split

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Community stylesheet ownership
        run: |
          node scripts/audit-style-graph.mjs
          node - <<'NODE'
          const fs=require('fs');
          const g=JSON.parse(fs.readFileSync('artifacts/design-style-graph.json','utf8'));
          const row=g.routeStyles.find(x=>x.file==='/community/index.html');
          if(!row) throw new Error('Community route missing from graph');
          if(row.activeStyles.includes('/dementor-profile.css')) throw new Error('Community still activates profile CSS');
          if(!row.activeStyles.includes('/dementor-roster.css')) throw new Error('Community does not activate roster CSS');
          console.log('Community roster/profile split gate passed');
          NODE
