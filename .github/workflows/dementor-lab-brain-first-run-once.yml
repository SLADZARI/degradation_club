name: Dementor Lab Brain First Run Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-brain-first-run-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply first-run guide
        run: python3 dementor-lab/scripts/patch-brain-first-run.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-brain-first-run.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab .github/workflows/dementor-lab-brain-first-run-once.yml
          git commit -m 'feat(lab): explain brain mental model once'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
