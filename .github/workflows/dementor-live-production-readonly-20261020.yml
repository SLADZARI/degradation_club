name: Dementor Live - Production READ ONLY Smoke 2026-10-20
on:
  push:
    branches:
      - qa/dementor-live-production-readonly-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/dementor-live/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser (no runtime deployment)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probe external live IP - READ ONLY GET/HEAD
        run: node test/production-readonly-smoke.cjs
      - name: Preserve sanitized probe results, no user state or screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dementor-production-readonly-${{ github.run_id }}
          path: projects/dementor-live/runtime/reports/live-readonly/summary.json
          if-no-files-found: warn
