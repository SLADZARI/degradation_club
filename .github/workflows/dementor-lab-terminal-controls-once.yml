name: Dementor Lab Terminal Controls Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-terminal-controls-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply terminal control patch
        run: python3 dementor-lab/scripts/patch-terminal-controls.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-terminal-controls.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/core/graph.mjs dementor-lab/src/core/model.mjs dementor-lab/tests/gameplay-regression-selftest.mjs dementor-lab/scripts/patch-terminal-controls.py
          git commit -m 'fix(lab): make stop and repeat terminal controls'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
