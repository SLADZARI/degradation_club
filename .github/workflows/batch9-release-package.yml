name: Batch 9 Release Package

on:
  push:
    branches:
      - release/dementor-club-site-2026-08-28-final

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrate current production-only changes
        run: |
          git fetch origin dementor-club-site
          git checkout origin/dementor-club-site -- .deploy-trigger cart/index.html dementor-account-sync-v1.js dementor-cart-v1.js docs/SUPABASE_BACKEND_v1.md global-header.js join-storage-guard.js merch-cart-bridge-v1.js profile/index.html site-config.js sitemap.xml
      - name: Apply the one release-only mobile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cart/index.html')
          s=p.read_text()
          old='@media(max-width:720px){.dc-cart__item{grid-template-columns:1fr}.dc-cart__summary{grid-template-columns:1fr}.dc-cart__actions{justify-content:flex-start}}'
          new='@media(max-width:720px){.dc-cart{padding-left:18px;padding-right:18px}.dc-cart h1{font-size:clamp(42px,12vw,48px);line-height:.86;letter-spacing:-.065em}.dc-cart h1 span{overflow-wrap:anywhere}.dc-cart__meta{min-width:0;flex-wrap:wrap}.dc-cart__item{grid-template-columns:1fr;min-width:0}.dc-cart__summary{grid-template-columns:1fr;min-width:0}.dc-cart__actions{justify-content:flex-start}.dc-cart__actions>*{max-width:100%}}'
          if old not in s:
              raise SystemExit('cart mobile rule not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Remove audit-only material from release package
        run: |
          rm -rf artifacts
          rm -f .github/workflows/design-*.yml
          rm -f scripts/audit-*.mjs scripts/batch*.mjs scripts/fix-batch*.mjs
          rm -f docs/BATCH7_RECHECK_2026-08-27.md
          rm -f docs/DESIGN_AUDIT_*.md docs/DESIGN_AUDIT_PACK_2026-08-27.md
      - name: Install Playwright for release verification
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start release static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dementor-release-http.log 2>&1 &
          sleep 2
      - name: Run focused release smoke
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          const routes=['/','/about/','/community/','/community/valentin/','/community/gabil/','/events/','/events/fuengirola/','/courses/dumai-s-opasnostyu/','/courses/ne-komanda/','/projects/','/projects/logic-awareness/','/merch/','/join/','/cart/','/profile/'];
          const widths=[390,1440];
          const base='http://127.0.0.1:4173';
          const browser=await chromium.launch({headless:true});
          const failures=[]; const diagnostics=[];
          for(const width of widths){
            const ctx=await browser.newContext({viewport:{width,height:width===390?844:1100},reducedMotion:'reduce'});
            for(const route of routes){
              const p=await ctx.newPage();
              const errs=[]; p.on('pageerror',e=>errs.push(String(e.message||e)));
              let res=null, navErr=null;
              try{res=await p.goto(base+route,{waitUntil:'networkidle',timeout:20000});}catch(e){navErr=String(e.message||e)}
              const m=navErr?null:await p.evaluate((width)=>{
                const visible=el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0};
                const selector=el=>el.id?`${el.tagName.toLowerCase()}#${el.id}`:el.classList?.length?`${el.tagName.toLowerCase()}.${[...el.classList].slice(0,3).join('.')}`:el.tagName.toLowerCase();
                const bad=[];
                for(const el of document.querySelectorAll('body *')){
                  if(!visible(el)) continue;
                  const r=el.getBoundingClientRect(),cs=getComputedStyle(el);
                  const intentional=el.closest('.ticker,.dc-notice__track,.dc-course-strip,[class*="ticker"],[class*="strip"]') || cs.position==='fixed';
                  if(intentional) continue;
                  const leaf=el.childElementCount===0 && (el.textContent||'').trim().length>2;
                  const textOverflow=leaf && el.scrollWidth>el.clientWidth+3;
                  const protrudes=(r.left < -4 || r.right > width+4) && r.width < width*2.2;
                  if(textOverflow || protrudes) bad.push({selector:selector(el),left:Math.round(r.left),right:Math.round(r.right),client:el.clientWidth,scroll:el.scrollWidth,text:(el.textContent||'').trim().slice(0,70)});
                }
                return {sw:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),bad:bad.slice(0,20),broken:[...document.images].filter(i=>(i.getAttribute('src')||'').trim()&&i.complete&&i.naturalWidth===0).map(i=>i.getAttribute('src')),main:!!document.querySelector('main'),h1:!!document.querySelector('h1')};
              },width);
              const realOverflow=!!(m && m.sw>width+6 && m.bad.length);
              if(m?.sw>width+6) diagnostics.push({route,width,scrollWidth:m.sw,candidates:m.bad});
              if(navErr || !res || (res.status()>=400) || errs.length || m?.broken.length || realOverflow || !m?.main || !m?.h1){failures.push({route,width,status:res?.status()||null,navErr,errs,metrics:m});}
              await p.close();
            }
            await ctx.close();
          }
          await browser.close();
          console.log(JSON.stringify({cases:routes.length*widths.length,failures,diagnostics},null,2));
          if(failures.length) process.exit(2);
          NODE
      - name: Remove packaging workflow from release branch
        run: |
          rm -f .github/workflows/batch9-release-package.yml
          rm -f package.json package-lock.json
      - name: Commit clean release candidate
        run: |
          git config user.name "Dementor Release"
          git config user.email "release@users.noreply.github.com"
          git add -A
          git commit -m "Batch 9: clean release candidate [release-package]"
          git push origin HEAD:release/dementor-club-site-2026-08-28-final
