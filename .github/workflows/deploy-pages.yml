name: Deploy GitHub Pages Production

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: 'Type APPROVED to deploy dementor.club'
        required: true
        type: string
  push:
    branches:
      - dementor-club-production
    paths:
      - '.github/production-release.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dementor-club-production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/dementor-club-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Validate explicit release approval
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.release_confirmation }}" = "APPROVED"
          else
            grep -qx 'STATUS=APPROVED' .github/production-release.txt
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate registry, routes and feature state
        run: node scripts/validate-site.mjs

      - name: Validate page content readiness
        run: node scripts/validate-content-readiness.mjs

      - name: Validate visual contract
        run: node scripts/validate-visual-contract.mjs

      - name: Validate production release guard
        run: node scripts/validate-production-release.mjs

      - name: Build Pages artifact
        run: node scripts/build-pages.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/dementor-club-production'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
