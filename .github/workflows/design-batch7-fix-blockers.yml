name: Design Batch 7 Fix Blockers

on:
  push:
    branches:
      - design-audit-batch-2026-08-27

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[batch7-fix-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Batch 7 blocker fixes
        run: node scripts/batch7-fix-visual-blockers.mjs
      - name: Commit fixes
        run: |
          git config user.name "Dementor Design Audit"
          git config user.email "design-audit@users.noreply.github.com"
          git add home-v1.css visual-standard-v2.css scripts/batch7-responsive-visual.mjs
          if git diff --cached --quiet; then
            echo "No Batch 7 blocker changes"
            exit 0
          fi
          git commit -m "Batch 7: fix responsive visual blockers [batch7-fix-auto]"
          git pull --rebase origin design-audit-batch-2026-08-27
          git push origin HEAD:design-audit-batch-2026-08-27
