name: Dementor Live v0.5 RC3 — Save-Preserving Release Gates
on:
  push:
    branches:
      - 'release/dementor-live-civic-p3-safe-upgrade-*'
      - 'hotfix/dementor-live-rc4-saved-resident-recovery-2026-10-20'
  pull_request:
    paths:
      - 'projects/dementor-live/runtime/**'
      - 'projects/dementor-live/qa/**'
      - '.github/workflows/dementor-live-safe-upgrade.yml'
permissions:
  contents: read
jobs:
  model-and-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/dementor-live/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release gate syntax and RC3 publication contract
        run: |
          bash -n deploy/publish-preserve-world.sh
          npm run check:release
      - run: npm run doctor
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-cairosvg python3-pil
      - run: python3 tools/build-terrain.py
      - run: python3 icons-v2/install-v2.py . icons-v2
      - run: python3 tools/install-new-icons-v3.py .
      - run: npm run check:icons-new
      - run: npm run check:icons
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:persistence
      - run: node --test test/combat-p0.test.mjs test/combat-touch.test.mjs
  browser-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: projects/dementor-live/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chrome
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-cairosvg python3-pil
      - run: python3 tools/build-terrain.py
      - run: python3 icons-v2/install-v2.py . icons-v2
      - run: python3 tools/install-new-icons-v3.py .
      - run: npm run check:icons-new
      - run: npm run check:icons
      - run: node test/interface-world-polish.cjs
      - run: node test/estate-mayor-ui.cjs
      - run: node test/playtest-actions.cjs
      - run: node test/telecom-browser.cjs
      - run: npm run test:mobile
      - run: npm run test:quests
      - run: node test/compact-panels.cjs
  candidate-docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build release candidate without any production save
        run: docker build -t dementor-live:0.5.0-rc.3 -f projects/dementor-live/runtime/deploy/Dockerfile projects/dementor-live/runtime
