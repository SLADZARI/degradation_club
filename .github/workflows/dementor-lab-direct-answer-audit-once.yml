name: Dementor Lab Direct Answer Audit Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-direct-answer-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run stricter direct-answer matrix
        working-directory: dementor-lab
        run: node scripts/direct-answer-matrix.mjs
