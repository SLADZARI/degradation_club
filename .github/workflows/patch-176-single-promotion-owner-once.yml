name: Patch 176 Single Promotion Owner Once

on:
  push:
    branches:
      - agent/176-telegram-off-held-corrective

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-176-single-owner]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/176-telegram-off-held-corrective
          fetch-depth: 1
          persist-credentials: true
      - name: Retire legacy per-card Telegram promotion UI
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='community/board/board.js';
          let text=fs.readFileSync(path,'utf8');
          const predicates=[
            line=>line.includes('async function adminPromote(id){'),
            line=>line.includes('data-admin-promote=')&&line.includes('ОПУБЛИКОВАТЬ В TELEGRAM'),
            line=>line.includes("querySelectorAll('[data-admin-promote]')")
          ];
          for(const predicate of predicates){
            const matches=text.split('\n').filter(predicate);
            if(matches.length!==1){
              console.error('Expected exactly one legacy promotion line, found',matches.length,matches);
              process.exit(1);
            }
            text=text.split('\n').filter(line=>!predicate(line)).join('\n');
          }
          if(text.includes('dc_admin_promote_artifact_telegram_v1')){
            console.error('board.js still owns Telegram promotion RPC after patch');
            process.exit(1);
          }
          if(text.includes('data-admin-promote')){
            console.error('board.js still renders/binds legacy Telegram promote control after patch');
            process.exit(1);
          }
          fs.writeFileSync(path,text);
          NODE
      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-176-single-promotion-owner-once.yml
          git add community/board/board.js .github/workflows/patch-176-single-promotion-owner-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "#176: retire legacy per-card Telegram promotion path"
          git push origin HEAD:agent/176-telegram-off-held-corrective
