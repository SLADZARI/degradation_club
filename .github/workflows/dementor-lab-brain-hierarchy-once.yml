name: Dementor Lab Brain Hierarchy Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-brain-hierarchy-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply final brain hierarchy
        run: python3 dementor-lab/scripts/patch-brain-hierarchy-final.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-brain-hierarchy-final.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/ui/app.mjs dementor-lab/tests/browser-smoke.mjs dementor-lab/scripts/patch-brain-hierarchy-final.py
          git commit -m 'feat(lab): separate readable brain from editor'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
