name: Dementor Lab Delta Feedback Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-delta-feedback-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply metric feedback patch
        run: python3 dementor-lab/scripts/patch-delta-feedback.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-delta-feedback.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/index.html dementor-lab/delta-feedback.css dementor-lab/src/ui/app.mjs dementor-lab/tests/browser-smoke.mjs dementor-lab/scripts/patch-delta-feedback.py
          git commit -m 'feat(lab): turn metric deltas into player feedback'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
