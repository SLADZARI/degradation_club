name: Projects v2 Lab V19 import

on:
  push:
    branches:
      - agent/169-projects-hub-v2
    paths:
      - .github/workflows/projects-v2-lab-v19-import.yml

permissions:
  contents: write

jobs:
  import-approved-v19:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/169-projects-hub-v2
          fetch-depth: 1

      - name: Download pinned transfer bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/dementor-lab-v19-import.zip 'https://at.adobe.com/V8qrl6ZPSvsNth9e'
          echo '8c625e95717ec0c2d5c1e7d44d7dcef29079cd7ba4f462389a52109d68cc610b  /tmp/dementor-lab-v19-import.zip' | sha256sum -c -
          rm -rf /tmp/dementor-lab-v19-import
          mkdir -p /tmp/dementor-lab-v19-import
          unzip -q /tmp/dementor-lab-v19-import.zip -d /tmp/dementor-lab-v19-import

      - name: Project exact V19 source and approved visual derivatives
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/dementor-lab-v19-import/projects/dementor-lab/index.html
          test "$(find /tmp/dementor-lab-v19-import/assets/projects/dementor-lab/v19 -maxdepth 1 -type f -name '*.avif' | wc -l)" -eq 13
          rm -rf assets/projects/dementor-lab/v19
          mkdir -p assets/projects/dementor-lab/v19
          cp /tmp/dementor-lab-v19-import/projects/dementor-lab/index.html projects/dementor-lab/index.html
          cp /tmp/dementor-lab-v19-import/assets/projects/dementor-lab/v19/*.avif assets/projects/dementor-lab/v19/
          sed -i '/\.dc-lab-v19-brand-legacy{font-size:12px}/d; /\.dc-lab-v19-nav-legacy \.play{padding:9px 10px;font-size:10px}/d' projects/dementor-lab/index.html
          sed -i 's/[[:space:]]\+$//' projects/dementor-lab/index.html

      - name: Remove one-shot transfer workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch .github/workflows/projects-v2-lab-v19-import.yml
          git add projects/dementor-lab/index.html assets/projects/dementor-lab/v19
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'feat(projects): integrate approved Dementor Lab V19'
          git push origin HEAD:agent/169-projects-hub-v2
