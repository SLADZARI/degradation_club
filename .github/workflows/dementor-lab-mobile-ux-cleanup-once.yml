name: Dementor Lab Mobile UX Cleanup Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-mobile-ux-cleanup-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply physical phone UX cleanup
        run: python3 dementor-lab/scripts/patch-mobile-ux-cleanup.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-mobile-ux-cleanup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/ui/app.mjs dementor-lab/scripts/patch-mobile-ux-cleanup.py
          git commit -m 'fix(lab): clean talk hierarchy and brain projection'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
