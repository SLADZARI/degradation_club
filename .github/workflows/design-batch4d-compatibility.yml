name: Design Batch 4D Compatibility Layers

on:
  push:
    branches:
      - design-audit-batch-2026-08-27

permissions:
  contents: write

jobs:
  compatibility-layers:
    if: ${{ !contains(github.event.head_commit.message, '[compat-layers-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scope course compatibility layer
        run: node scripts/batch4d-scope-course-bridge.mjs
      - name: Run full design audits
        run: |
          node scripts/audit-style-graph.mjs
          node scripts/audit-dementor-hero.mjs
          node scripts/audit-event-hero.mjs
          node scripts/audit-feature-relation.mjs
          node scripts/audit-ink-surfaces.mjs
          node scripts/audit-inline-styles.mjs
          node scripts/audit-cascade-pressure.mjs
          node scripts/audit-presentation-pressure.mjs
          node scripts/audit-compatibility-layers.mjs
      - name: Commit compatibility scoping
        run: |
          git config user.name "Dementor Design Audit"
          git config user.email "design-audit@users.noreply.github.com"
          git add presentation-standard-v1.css courses artifacts/design-style-graph.json
          if git diff --cached --quiet; then
            echo "No compatibility layer changes"
            exit 0
          fi
          git commit -m "Batch 4D: scope course bridge to course routes [compat-layers-auto]"
          git pull --rebase origin design-audit-batch-2026-08-27
          git push origin HEAD:design-audit-batch-2026-08-27
