name: Materialize Historical Supabase Migration Once

on:
  push:
    branches:
      - agent/175-supabase-release-infra

permissions:
  contents: write

concurrency:
  group: dementor-supabase-ledger-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[materialize-ledger]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/175-supabase-release-infra
          fetch-depth: 1
          persist-credentials: true

      - name: Guard exact source branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/agent/175-supabase-release-infra" || {
            echo "Historical ledger materialization may run only from #177 branch."
            exit 1
          }

      - name: Materialize exact production migration from verified base64 chunks
        shell: bash
        run: |
          set -euo pipefail
          target="supabase/migrations/20260829232745_community_member_artifact_v1.sql"
          test ! -e "${target}" || { echo "Target already exists; refusing overwrite."; exit 1; }
          for i in 1 2 3 4 5 6 7 8; do
            test -s ".github/recovery/20260829232745.part${i}.b64" || {
              echo "Missing recovery chunk ${i}."
              exit 1
            }
          done
          cat \
            .github/recovery/20260829232745.part1.b64 \
            .github/recovery/20260829232745.part2.b64 \
            .github/recovery/20260829232745.part3.b64 \
            .github/recovery/20260829232745.part4.b64 \
            .github/recovery/20260829232745.part5.b64 \
            .github/recovery/20260829232745.part6.b64 \
            .github/recovery/20260829232745.part7.b64 \
            .github/recovery/20260829232745.part8.b64 \
            | tr -d '\r\n' | base64 --decode > "${target}"
          actual="$(git hash-object "${target}")"
          expected="6caad18bb722e33679f35011366390c9762821dd"
          echo "Materialized ${target}: ${actual}"
          test "${actual}" = "${expected}" || {
            echo "Production-history blob mismatch: expected ${expected}, got ${actual}."
            rm -f "${target}"
            exit 1
          }

      - name: Verify all 22 historical migration blobs against production history
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            test -f "${path}" || { echo "Missing ${path}"; exit 1; }
            actual="$(git hash-object "${path}")"
            test "${actual}" = "${expected}" || {
              echo "Blob mismatch for ${path}: expected ${expected}, got ${actual}"
              exit 1
            }
            echo "verified ${path} ${actual}"
          done <<'EOF'
          ad1e8762167dc1a01f023b70247abdbff808bde7 supabase/migrations/20260827212520_archive_edu_and_create_dementor_core.sql
          c69bbdfdb8e5e00f6a3b569e925349e15a5076ce supabase/migrations/20260827212614_secure_legacy_edu_archive.sql
          141bfa4365172c43376a81022a69d30b5096fdba supabase/migrations/20260827213550_add_dementor_assessment_sync.sql
          61f0ccf184afa10809d96400f5b1910742bdd855 supabase/migrations/20260827214433_add_dementor_commerce_state.sql
          93d2d89305ba6be46a327c2333005e51e8212e21 supabase/migrations/20260828002841_grant_authenticated_profiles_read_update.sql
          6d313eda5d8fa23713e2186dac0f39317d4f28d1 supabase/migrations/20260828170411_dc_workspace_readonly_v01.sql
          6ecb83c8bb06965dc6fa0c8eed43fee9196a4cf2 supabase/migrations/20260828203152_dc_merch_certificates_progress_v01.sql
          84fa58fb2ef5deb6b703491aee3d084d1a689982 supabase/migrations/20260828204145_course_enrollment_account_progress_v01.sql
          034c651412cf56f44ca3e60b67ab3e86a6b24449 supabase/migrations/20260828205228_mp_weekly_runtime_v1.sql
          0eab060bc4b1ad423e1eb100ae52f8c3e2c72361 supabase/migrations/20260828205746_mp_weekly_runtime_rls_v1_1.sql
          acfe00723e2caaed049c2833d20634cc6fa8e749 supabase/migrations/20260828205825_mp_weekly_runtime_grants_v1_2.sql
          d082f134715821622086c42ab846d8422872701f supabase/migrations/20260828211140_mp_project_access_profiles_v1.sql
          c54c499b30b4cff960e8055f645513b2338faa57 supabase/migrations/20260828212349_mp_client_team_artifact_access_v1.sql
          433cb51369cf3191124a33255c2038d22388aa23 supabase/migrations/20260828213850_mp_spore_person_credits_v1.sql
          22a7835d3fd24e8547bc734bb3e9a6eb0168a7dd supabase/migrations/20260828221529_join_application_authenticated_only_v1.sql
          d8d55ccaf7306460572d8fe1c32d4045c03a1ae3 supabase/migrations/20260828222141_mp_project_access_profile_unassigned_v1.sql
          2c1cdcb677286392243bf7bcd63f9e408542db1b supabase/migrations/20260828223528_dc_owner_admin_system_checks_v1.sql
          e6ace0097b8c0c1e9b2b9662553f79e21649e7e4 supabase/migrations/20260829061020_mp_publishing_runtime_v1.sql
          b46b17cf97ee8ec5557c8ae9a73a6bb2fce92335 supabase/migrations/20260829074301_mp_spore_tool_leverage_v1.sql
          b2652abc9fe3bd118fc7b41ce07a4d910694925a supabase/migrations/20260829080909_mp_weekly_snapshot_v1.sql
          6caad18bb722e33679f35011366390c9762821dd supabase/migrations/20260829232745_community_member_artifact_v1.sql
          54a39c5b71ec00dd3bbab422790040db8e6c3511 supabase/migrations/20260829232924_community_member_artifact_v1_hardening.sql
          EOF

      - name: Commit exact historical ledger and remove one-off recovery material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/recovery
          rm .github/workflows/recover-supabase-history-once.yml
          git add supabase/migrations .github/recovery .github/workflows/recover-supabase-history-once.yml
          echo "Recovery commit contents:"
          git diff --cached --name-status
          test "$(git diff --cached --name-status | awk '$1=="A" && $2=="supabase/migrations/20260829232745_community_member_artifact_v1.sql" {n++} END {print n+0}')" = "1" || {
            echo "Expected one materialized historical migration addition."
            exit 1
          }
          test "$(git diff --cached --name-status | awk '$1=="D" && $2 ~ /^\.github\/recovery\/20260829232745\.part[1-8]\.b64$/ {n++} END {print n+0}')" = "8" || {
            echo "Expected all eight temporary recovery chunks to be removed."
            exit 1
          }
          test "$(git diff --cached --name-status | awk '$1=="D" && $2==".github/workflows/recover-supabase-history-once.yml" {n++} END {print n+0}')" = "1" || {
            echo "One-off materialization workflow was not removed."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release infra: recover exact historical Supabase migration ledger"
          git push origin HEAD:agent/175-supabase-release-infra
