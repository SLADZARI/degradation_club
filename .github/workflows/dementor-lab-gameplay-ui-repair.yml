name: Dementor Lab Gameplay UI Repair
on:
  push:
    branches:
      - agent/dementor-lab-vertical-slice-v0.3
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore(lab): stage gameplay UI repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Repair BRAIN graph/replay invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dementor-lab/src/ui/app.mjs')
          s=p.read_text()
          replacements={
          "let baselineEncounter=null,replayMode=false,firstRunConfig=null,replayTargetType=null,previewRenderer=null;":"let baselineEncounter=null,replayMode=false,firstRunConfig=null,replayTargetNodeId=null,previewRenderer=null;",
          "function brainNodeLocked(n){return Boolean(replayMode&&replayTargetType&&n.type!==replayTargetType)}":"function brainNodeLocked(n){return Boolean(replayMode&&replayTargetNodeId&&n.id!==replayTargetNodeId)}",
          "function currentValidation(){return brainValidation(currentBrainGraph)}":"function currentValidation(){return brainValidation(currentBrainGraph,CRITICISM_IDEA_SCENARIO.openingTrigger)}",
          "function finishBrainConnection(id){if(replayMode||!brainConnectFromId)return;const made=connectBrainNodes(currentBrainGraph,brainConnectFromId,id);if(made){made.uiKind='extra';brainConnectFromId=null;activeBrainNodeId=null;activeBrainPresetId='custom'}renderBrainCanvas();renderBrainStatus()}":"function finishBrainConnection(id){if(replayMode||!brainConnectFromId)return;const made=connectBrainNodes(currentBrainGraph,brainConnectFromId,id);if(made){made.uiKind='extra';made.uiManual=true;brainConnectFromId=null;activeBrainNodeId=null;activeBrainPresetId='custom'}renderBrainCanvas();renderBrainStatus()}",
          "function showResult(result){show('result');$('#result-title').textContent=result.punchline;$('#result-cause').textContent=result.stageB.cause;$('#result-node').textContent=result.stageC.nodeType?title(result.stageC.nodeType):'—';if(!baselineEncounter){baselineEncounter=structuredClone(controller.encounter);replayTargetType=result.stageC.nodeType||'repeat';$('#comparison').hidden=true;$('#rerun').textContent='ИЗМЕНИТЬ ОДНУ ВЕЩЬ →'}else if(replayMode){const c=compareRuns(baselineEncounter,controller.encounter);$('#comparison').innerHTML=comparisonHtml(c);$('#comparison').hidden=false;$('#rerun').textContent='ЕЩЁ ОДИН ЭКСПЕРИМЕНТ →'}}":"function showResult(result){show('result');$('#result-title').textContent=result.punchline;$('#result-cause').textContent=result.stageB.cause;$('#result-node').textContent=result.stageC.nodeType?title(result.stageC.nodeType):'—';if(!baselineEncounter){baselineEncounter=structuredClone(controller.encounter);replayTargetNodeId=result.stageC.nodeId||null;$('#comparison').hidden=true;$('#rerun').textContent='ИЗМЕНИТЬ ОДНУ ВЕЩЬ →'}else if(replayMode){const c=compareRuns(baselineEncounter,controller.encounter);$('#comparison').innerHTML=comparisonHtml(c);$('#comparison').hidden=false;$('#rerun').textContent='ЕЩЁ ОДИН ЭКСПЕРИМЕНТ →'}}",
          "function prepareReplay(){replayMode=true;currentCharacterId=firstRunConfig?.characterId||currentCharacterId;sharedAppearance={...(firstRunConfig?.sharedAppearance||sharedAppearance)};ownedAppearance=structuredClone(firstRunConfig?.ownedAppearance||ownedAppearance);appearanceColors=structuredClone(firstRunConfig?.appearanceColors||appearanceColors);opponentSeed=firstRunConfig.opponentSeed;opponentProfile=structuredClone(firstRunConfig.opponentProfile);restoreBrainSnapshot(firstRunConfig.brainGraph);controller=null;$('#replay-note').textContent=`КОНТРФАКТ: МЕНЯЕМ ТОЛЬКО «${title(replayTargetType)}». СОПЕРНИК ТОТ ЖЕ.`;show('brain')}":"function prepareReplay(){replayMode=true;currentCharacterId=firstRunConfig?.characterId||currentCharacterId;sharedAppearance={...(firstRunConfig?.sharedAppearance||sharedAppearance)};ownedAppearance=structuredClone(firstRunConfig?.ownedAppearance||ownedAppearance);appearanceColors=structuredClone(firstRunConfig?.appearanceColors||appearanceColors);opponentSeed=firstRunConfig.opponentSeed;opponentProfile=structuredClone(firstRunConfig.opponentProfile);restoreBrainSnapshot(firstRunConfig.brainGraph);controller=null;const targetNode=currentBrainGraph.nodes.find(n=>n.id===replayTargetNodeId);$('#replay-note').textContent=`КОНТРФАКТ: МЕНЯЕМ ТОЛЬКО «${title(targetNode?.type||'repeat')}». СОПЕРНИК ТОТ ЖЕ.`;show('brain')}",
          "replayTargetType=null;replayMode=false;":"replayTargetNodeId=null;replayMode=false;"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('missing patch target: '+old[:90])
              s=s.replace(old,new,1)
          old="function rebuildBrainSequence(){markBrainEdgeKinds(currentBrainGraph);const extras=currentBrainGraph.edges.filter(e=>e.uiKind==='extra');const extraKeys=new Set(extras.map(e=>`${e.from}->${e.to}`));const working={...currentBrainGraph,edges:[...extras]};const primary=[];for(let i=0;i<currentBrainGraph.nodes.length-1;i++){const from=currentBrainGraph.nodes[i],to=currentBrainGraph.nodes[i+1],key=`${from.id}->${to.id}`;if(extraKeys.has(key)){extraKeys.delete(key);continue}if(canConnectNodes(working,from,to)){const edge={id:primaryEdgeId(from.id,to.id),from:from.id,to:to.id,uiKind:'primary'};primary.push(edge);working.edges.push(edge)}}currentBrainGraph.edges=[...primary,...extras.filter(e=>extraKeys.has(`${e.from}->${e.to}`))];currentBrainGraph.nodes.forEach((node,i)=>{node.ui={...(node.ui||{}),x:0,y:i*82}})}"
          new="function rebuildBrainSequence(){markBrainEdgeKinds(currentBrainGraph);const manual=currentBrainGraph.edges.filter(e=>e.uiManual||e.uiKind==='extra').map(e=>({...e,uiManual:true})),manualByKey=new Map(manual.map(e=>[`${e.from}->${e.to}`,e])),usedManual=new Set(),primary=[];for(let i=0;i<currentBrainGraph.nodes.length-1;i++){const from=currentBrainGraph.nodes[i],to=currentBrainGraph.nodes[i+1],key=`${from.id}->${to.id}`,saved=manualByKey.get(key);if(saved){primary.push({...saved,uiKind:'primary'});usedManual.add(saved.id);continue}const working={...currentBrainGraph,edges:[...primary,...manual.filter(e=>!usedManual.has(e.id))]};if(canConnectNodes(working,from,to)){primary.push({id:primaryEdgeId(from.id,to.id),from:from.id,to:to.id,uiKind:'primary'})}}const extras=manual.filter(e=>!usedManual.has(e.id)).map(e=>({...e,uiKind:'extra'}));currentBrainGraph.edges=[...primary,...extras];currentBrainGraph.nodes.forEach((node,i)=>{node.ui={...(node.ui||{}),x:0,y:i*82}})}"
          if old not in s: raise SystemExit('missing rebuildBrainSequence target')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/dementor-lab-gameplay-ui-repair.yml
      - name: Commit repair
        run: |
          git config user.name "SLEDZARI"
          git config user.email "sharecraftwideo@gmail.com"
          git add dementor-lab/src/ui/app.mjs .github/workflows/dementor-lab-gameplay-ui-repair.yml
          git commit -m "fix(lab): restore brain graph and replay invariants"
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
