name: Dementor Live CIVIC / UI polish candidate QA
on:
  push:
    branches:
      - 'feature/dementor-live-interface-world-polish-*'
  pull_request:
    branches:
      - 'integration/dementor-live-civic-universe-v0-2026-10-20'
    paths:
      - 'projects/dementor-live/runtime/**'
      - '.github/workflows/dementor-live-interface-world-polish.yml'
permissions:
  contents: read
jobs:
  model-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/dementor-live/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:persistence
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/dementor-live/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chrome
      - run: node test/interface-world-polish.cjs
      - run: npm run test:mobile
      - run: npm run test:quests
      - run: npm run test:compact-panels
