name: Design Batch 2 Event Hero

on:
  push:
    branches:
      - design-audit-batch-2026-08-27

permissions:
  contents: write

jobs:
  event-hero:
    if: ${{ !contains(github.event.head_commit.message, '[event-hero-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved Event hero structure
        run: node scripts/batch2-event-hero.mjs
      - name: Re-run audits
        run: |
          node scripts/audit-style-graph.mjs
          node scripts/audit-dementor-hero.mjs
      - name: Commit Event hero migration
        run: |
          git config user.name "Dementor Design Audit"
          git config user.email "design-audit@users.noreply.github.com"
          git add events/fuengirola/index.html visual-standard-v2.css event-system.css artifacts/design-style-graph.json
          if git diff --cached --quiet; then
            echo "No Event hero migration changes"
            exit 0
          fi
          git commit -m "Batch 2: align Fuengirola event hero with approved refs [event-hero-auto]"
          git pull --rebase origin design-audit-batch-2026-08-27
          git push origin HEAD:design-audit-batch-2026-08-27
