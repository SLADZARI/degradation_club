name: Design Batch 4 Inline Styles

on:
  push:
    branches:
      - design-audit-batch-2026-08-27

permissions:
  contents: write

jobs:
  inline-styles:
    if: ${{ !contains(github.event.head_commit.message, '[inline-styles-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline styles
        run: node scripts/batch4-extract-inline-styles.mjs
      - name: Run design audits
        run: |
          node scripts/audit-style-graph.mjs
          node scripts/audit-dementor-hero.mjs
          node scripts/audit-event-hero.mjs
          node scripts/audit-feature-relation.mjs
          node scripts/audit-ink-surfaces.mjs
          node scripts/audit-inline-styles.mjs
      - name: Commit inline style migration
        run: |
          git config user.name "Dementor Design Audit"
          git config user.email "design-audit@users.noreply.github.com"
          git add 404.html 404-inline.css contacts design-system/preorder design-system/support donate join projects/logic-awareness artifacts/design-style-graph.json
          if git diff --cached --quiet; then
            echo "No inline style migration changes"
            exit 0
          fi
          git commit -m "Batch 4: extract inline style owners [inline-styles-auto]"
          git pull --rebase origin design-audit-batch-2026-08-27
          git push origin HEAD:design-audit-batch-2026-08-27
