name: Design Batch 8 Release Candidate

on:
  push:
    branches:
      - design-audit-batch-2026-08-27
  workflow_dispatch:

jobs:
  rc-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dementor-http.log 2>&1 &
          echo $! > /tmp/dementor-http.pid
          sleep 2
      - name: Run permanent design gates
        run: |
          node scripts/audit-style-graph.mjs
          node scripts/audit-dementor-hero.mjs
          node scripts/audit-event-hero.mjs
          node scripts/audit-feature-relation.mjs
          node scripts/audit-ink-surfaces.mjs
          node scripts/audit-inline-styles.mjs
          node scripts/audit-cascade-pressure.mjs
          node scripts/audit-presentation-pressure.mjs
          node scripts/audit-compatibility-layers.mjs
          node scripts/audit-mobile-guardrails.mjs
          node scripts/audit-ui-pressure.mjs
          node scripts/audit-component-owner-hardening.mjs
          node scripts/audit-route-owner-sweep.mjs
          node scripts/audit-shared-systems.mjs
      - name: Run Batch 8 RC audit
        id: rc
        continue-on-error: true
        run: node scripts/batch8-release-candidate.mjs
      - name: Upload Batch 8 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch8-release-candidate
          path: artifacts/batch8
          retention-days: 30
      - name: Enforce RC stop rule
        if: steps.rc.outcome == 'failure'
        run: |
          echo "Batch 8 is NO-GO because P0/P1 blockers remain. Apply one consolidated release fix-pack only."
          exit 1
