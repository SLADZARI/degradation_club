name: Dementor Lab Brain Integrity Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-brain-integrity-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply brain integrity follow-up
        run: python3 dementor-lab/scripts/patch-brain-integrity-followup.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-brain-integrity-followup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab .github/workflows/dementor-lab-brain-integrity-once.yml
          git commit -m 'fix(lab): preserve custom brain causality across edits'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
