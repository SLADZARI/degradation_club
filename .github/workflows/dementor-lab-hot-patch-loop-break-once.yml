name: Dementor Lab Hot Patch Loop Break Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-hot-patch-loop-break-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply decisive repeat patch
        run: python3 dementor-lab/scripts/patch-hot-patch-loop-break.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-hot-patch-loop-break.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/encounter/runtime.mjs dementor-lab/src/ui/app.mjs dementor-lab/tests/encounter-runtime-selftest.mjs dementor-lab/scripts/patch-hot-patch-loop-break.py
          git commit -m 'feat(lab): make repeat hot patch break the loop'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
