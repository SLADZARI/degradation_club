name: Dementor Lab Vertical Slice QA

on:
  push:
    branches:
      - agent/dementor-lab-vertical-slice-v0.3
    paths:
      - 'dementor-lab/**'
      - '.github/workflows/dementor-lab-vertical-slice-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gameplay-ui-repair:
    if: github.event.head_commit.message == 'chore(lab): run gameplay UI repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply staged patch
        run: python3 dementor-lab/scripts/patch-gameplay-ui.py
      - name: Restore normal QA workflow and commit
        run: |
          git checkout HEAD^ -- .github/workflows/dementor-lab-vertical-slice-qa.yml
          rm dementor-lab/scripts/patch-gameplay-ui.py
          git config user.name SLEDZARI
          git config user.email sharecraftwideo@gmail.com
          git add -A
          git commit -m 'fix(lab): restore brain graph and replay invariants'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3

  deterministic-qa:
    if: github.event.head_commit.message != 'chore(lab): run gameplay UI repair'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dementor-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run zero-dependency QA suite
        run: npm test

  browser-smoke:
    if: github.event.head_commit.message != 'chore(lab): run gameplay UI repair'
    runs-on: ubuntu-latest
    needs: deterministic-qa
    defaults:
      run:
        working-directory: dementor-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for QA only
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dementor-lab-http.log 2>&1 &
      - name: Wait for static server
        run: |
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dementor-lab-http.log
          exit 1
      - name: Run iPhone-sized browser smoke
        run: DEMENTOR_LAB_URL=http://127.0.0.1:4173 node tests/browser-smoke.mjs
