name: Dementor Lab Vertical Slice QA

on:
  push:
    branches:
      - agent/dementor-lab-vertical-slice-v0.3
    paths:
      - 'dementor-lab/**'
      - '.github/workflows/dementor-lab-vertical-slice-qa.yml'

permissions:
  contents: write

jobs:
  collision-ui-repair:
    if: "github.event.head_commit.message == 'chore(lab): apply collision UI repair'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 dementor-lab/scripts/collision-ui-patch.py
      - run: |
          rm dementor-lab/scripts/collision-ui-patch.py
          git config user.name SLEDZARI
          git config user.email sharecraftwideo@gmail.com
          git add dementor-lab/src/ui/app.mjs dementor-lab/tests/browser-smoke.mjs dementor-lab/src/encounter/runtime.mjs dementor-lab/scripts/collision-ui-patch.py .github/workflows/dementor-lab-vertical-slice-qa.yml
          git commit -m 'fix(lab): expose collision triggers and scenario-owned contact threshold'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
# retry-pattern-v2
