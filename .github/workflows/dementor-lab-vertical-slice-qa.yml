name: Dementor Lab Vertical Slice QA

on:
  push:
    branches:
      - agent/dementor-lab-vertical-slice-v0.3
    paths:
      - 'dementor-lab/**'
      - '.github/workflows/dementor-lab-vertical-slice-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semantic-wiring-repair:
    if: "github.event.head_commit.message == 'chore(lab): apply semantic wiring patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 dementor-lab/scripts/semantic-wiring-patch.py
      - run: |
          rm dementor-lab/scripts/semantic-wiring-patch.py
          git config user.name SLEDZARI
          git config user.email sharecraftwideo@gmail.com
          git add dementor-lab/index.html dementor-lab/src/ui/app.mjs dementor-lab/tests/browser-smoke.mjs dementor-lab/scripts/semantic-wiring-patch.py
          git commit -m 'fix(lab): wire semantic interface fields'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3

  deterministic-qa:
    if: "github.event.head_commit.message != 'chore(lab): apply semantic wiring patch'"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dementor-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  browser-smoke:
    if: "github.event.head_commit.message != 'chore(lab): apply semantic wiring patch'"
    runs-on: ubuntu-latest
    needs: deterministic-qa
    defaults:
      run:
        working-directory: dementor-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dementor-lab-http.log 2>&1 &
      - run: |
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/dementor-lab-http.log
          exit 1
      - run: DEMENTOR_LAB_URL=http://127.0.0.1:4173 node tests/browser-smoke.mjs
