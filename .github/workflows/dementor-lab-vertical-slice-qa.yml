name: Dementor Lab Apply Unified Connect Contract

on:
  push:
    branches:
      - agent/dementor-lab-vertical-slice-v0.3
    paths:
      - 'dementor-lab/scripts/apply-connect-ui-contract.py'
      - '.github/workflows/dementor-lab-vertical-slice-qa.yml'

permissions:
  contents: write

jobs:
  apply-connect-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply interaction contract
        run: python3 dementor-lab/scripts/apply-connect-ui-contract.py
      - name: Commit implementation and remove transport script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm dementor-lab/scripts/apply-connect-ui-contract.py
          git add dementor-lab/src/ui/app.mjs dementor-lab/brain-stack.css dementor-lab/add-node-picker.css dementor-lab/tests/browser-smoke.mjs
          git commit -m "feat(lab): unify brain connect interaction and node library"
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
