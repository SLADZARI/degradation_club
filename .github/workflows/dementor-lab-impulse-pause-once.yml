name: Dementor Lab Impulse Pause Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-impulse-pause-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply impulse and pause strategy patch
        run: python3 dementor-lab/scripts/patch-impulse-pause-strategy.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-impulse-pause-strategy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab/src/encounter/runtime.mjs dementor-lab/src/core/model.mjs dementor-lab/tests/gameplay-regression-selftest.mjs dementor-lab/scripts/patch-impulse-pause-strategy.py
          git commit -m 'feat(lab): differentiate impulses and price pause'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
