name: Release Sync Base

on:
  push:
    branches:
      - release/dementor-club-site-2026-08-28-final

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[base-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current production ancestry
        run: |
          git config user.name "Dementor Release"
          git config user.email "release@users.noreply.github.com"
          git fetch origin dementor-club-site
          git merge --no-edit -X ours origin/dementor-club-site
          rm -f .github/workflows/release-sync-base.yml
          git add -A
          git commit -m "Batch 9: sync production ancestry and remove sync workflow [base-synced]"
          git push origin HEAD:release/dementor-club-site-2026-08-28-final
