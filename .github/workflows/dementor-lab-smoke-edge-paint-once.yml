name: Dementor Lab Smoke Edge Paint Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-smoke-edge-paint-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply edge paint smoke wait
        run: python3 dementor-lab/scripts/patch-smoke-edge-paint.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-smoke-edge-paint.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab .github/workflows/dementor-lab-smoke-edge-paint-once.yml
          git commit -m 'test(lab): distinguish causal edge from svg paint'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
