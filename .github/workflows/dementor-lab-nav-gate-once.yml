name: Dementor Lab Navigation Gate Once
on:
  push:
    paths:
      - '.github/workflows/dementor-lab-nav-gate-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dementor-lab-vertical-slice-v0.3
      - name: Apply navigation gate
        run: python3 dementor-lab/scripts/patch-nav-gate.py
      - name: Commit patch
        run: |
          rm dementor-lab/scripts/patch-nav-gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dementor-lab .github/workflows/dementor-lab-nav-gate-once.yml
          git commit -m 'fix(lab): keep required identity in player flow'
          git push origin HEAD:agent/dementor-lab-vertical-slice-v0.3
