name: Design Batch 7 Fix Pass 1
on:
  push:
    branches: [design-audit-batch-2026-08-27]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[batch7-fix-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply responsive fixes
        run: node scripts/batch7-fix-pass1.mjs
      - name: Run structural design audits
        run: |
          node scripts/audit-style-graph.mjs
          node scripts/audit-dementor-hero.mjs
          node scripts/audit-event-hero.mjs
          node scripts/audit-feature-relation.mjs
          node scripts/audit-ink-surfaces.mjs
          node scripts/audit-inline-styles.mjs
          node scripts/audit-cascade-pressure.mjs
          node scripts/audit-presentation-pressure.mjs
          node scripts/audit-compatibility-layers.mjs
          node scripts/audit-mobile-guardrails.mjs
          node scripts/audit-ui-pressure.mjs
          node scripts/audit-component-owner-hardening.mjs
          node scripts/audit-route-owner-sweep.mjs
          node scripts/audit-shared-systems.mjs
      - name: Commit fixes
        run: |
          git config user.name "Dementor Design Audit"
          git config user.email "design-audit@users.noreply.github.com"
          git add about-v1.css entity-v1.css catalog-v1.css courses/dengi-na-veter/course.css courses/dumai-s-opasnostyu/course-shell.css courses/slaboumie-i-otvaga/course.css design-system/ui-lab-v2.css donate/inline-v1.css event-system.css course-bridge-v1.css merch-drop-v2.css objects-v1.css events/fuengirola/index.html scripts/batch7-responsive-visual.mjs artifacts/design-style-graph.json
          git commit -m "Batch 7: responsive fix pass 1 [batch7-auto] [batch7-fix-auto]" || exit 0
          git pull --rebase origin design-audit-batch-2026-08-27
          git push origin HEAD:design-audit-batch-2026-08-27
