name: Patch 176 Artifact Detail Promote Once

on:
  push:
    branches:
      - agent/176-telegram-off-held-corrective

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-176-artifact-detail]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/176-telegram-off-held-corrective
          fetch-depth: 1
          persist-credentials: true
      - name: Retire Artifact Detail manual Telegram promotion owner
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='community/artifact/artifact.js';
          let text=fs.readFileSync(path,'utf8');
          const predicates=[
            line=>line.includes("id=\"detailAdminPromote\"")&&line.includes('ОПУБЛИКОВАТЬ В TELEGRAM'),
            line=>line.includes("getElementById('detailAdminPromote')")&&line.includes('adminPromote'),
            line=>line.includes('async function adminPromote(){')&&line.includes('dc_admin_promote_artifact_telegram_v1')
          ];
          for(const predicate of predicates){
            const lines=text.split('\n');
            const matches=lines.filter(predicate);
            if(matches.length!==1){
              console.error('Expected exactly one Artifact Detail promotion owner line, found',matches.length,matches);
              process.exit(1);
            }
            text=lines.filter(line=>!predicate(line)).join('\n');
          }
          if(text.includes('detailAdminPromote')){
            console.error('Artifact Detail still contains detailAdminPromote after patch');
            process.exit(1);
          }
          if(text.includes('dc_admin_promote_artifact_telegram_v1')){
            console.error('Artifact Detail still owns Telegram promotion RPC after patch');
            process.exit(1);
          }
          for(const required of ['dc_admin_suppress_artifact_telegram_v1','dc_support_artifact_promotion_v1','dc_admin_board_hide_artifact_v1','dc_admin_resolve_delivery_unknown_v1']){
            if(!text.includes(required)){
              console.error('Required Artifact Detail control lost:',required);
              process.exit(1);
            }
          }
          fs.writeFileSync(path,text);
          NODE
      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-176-artifact-detail-promote-once.yml
          git add community/artifact/artifact.js .github/workflows/patch-176-artifact-detail-promote-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "#176: retire Artifact Detail manual Telegram promotion path"
          git push origin HEAD:agent/176-telegram-off-held-corrective
