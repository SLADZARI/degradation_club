<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>DC-9 Mobile QA</title><style>:root{--p:#f2f0e8;--i:#111;--a:#d8ff3e;--l:rgba(17,17,17,.16);--m:#727272}*{box-sizing:border-box}html,body{margin:0;background:#c9c7bf;color:var(--i);font-family:Inter,Arial,sans-serif}button,a{font:inherit;color:inherit}.qa{position:sticky;top:0;z-index:30;background:#1c1c1c;color:#fff;padding:9px}.qa div{display:flex;gap:5px;flex-wrap:wrap}.qa b{font:900 9px ui-monospace,monospace;margin-right:4px}.qa button{border:1px solid #555;background:transparent;color:#ddd;padding:7px;font:800 8px ui-monospace,monospace;text-transform:uppercase}.qa button.on{background:var(--a);color:#111;border-color:var(--a)}.wrap{padding:14px 8px 40px}.phone{width:min(390px,100%);min-height:844px;margin:auto;background:var(--p);overflow:hidden;box-shadow:0 18px 60px #0003}.top{height:56px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 13px}.brand{font-weight:900;font-size:16px;letter-spacing:-.045em}.brand span{background:var(--a);padding:2px 4px}.acct{margin-left:auto;font:800 8px ui-monospace,monospace;color:var(--m);text-transform:uppercase}.entry{padding:28px 14px 22px}.k{font:900 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}h1{margin:13px 0 15px;font-size:46px;line-height:.86;letter-spacing:-.065em;overflow-wrap:anywhere}.hl{background:var(--a);padding:0 .035em;box-decoration-break:clone;-webkit-box-decoration-break:clone}.lead{font-size:21px;line-height:1.06;font-weight:780;letter-spacing:-.025em;margin:0 0 13px}.copy{font-size:14px;line-height:1.36;color:#404040;margin:0}.actions{display:grid;gap:8px;margin-top:20px}.btn{min-height:48px;border:1px solid var(--i);display:flex;align-items:center;justify-content:center;text-decoration:none;font:900 10px ui-monospace,monospace;text-transform:uppercase}.primary{background:var(--a);border-color:var(--a)}.dark{background:#111;color:var(--p)}.link{border:0;justify-content:flex-start;text-decoration:underline;min-height:34px}.teaser{margin-top:20px;border:1px solid var(--i);display:grid;grid-template-columns:72px 1fr;background:#e9e8e1}.tv{display:grid;place-items:center;border-right:1px solid}.rad{width:50px;height:50px;border:1px solid;border-radius:50%}.tc{padding:11px}.tc b{font-size:15px}.tc small{display:block;margin-top:5px;color:var(--m);font-size:11px}.tc a{display:inline-block;margin-top:8px;font:900 9px ui-monospace,monospace}.status{margin-top:18px;padding-top:10px;border-top:1px solid var(--l);font:800 8px/1.35 ui-monospace,monospace;color:var(--m);text-transform:uppercase}.q{min-height:788px;display:flex;flex-direction:column}.svc{padding:12px 14px 9px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.back{border:0;background:transparent;padding:0;font:900 8px ui-monospace,monospace}.meta{font:900 8px ui-monospace,monospace;color:var(--m);text-align:center}.meta.r{text-align:right}.prog{grid-column:1/-1;height:3px;background:#ddd}.prog i{display:block;height:100%;background:#111}.scene{padding:18px 14px 16px;font-size:23px;line-height:1.075;letter-spacing:-.03em;font-weight:710}.scene p{margin:0 0 .48em}.scene blockquote{margin:.15em 0 .48em;padding-left:11px;border-left:3px solid var(--a);font-weight:790}.fix{background:var(--a);font-weight:820;box-decoration-break:clone;-webkit-box-decoration-break:clone}.decision{margin-top:auto;border-top:1px solid;background:#ebe9e0}.dh{padding:10px 14px 7px;font-size:12px;font-weight:800}.answer{width:100%;border:0;border-top:1px solid var(--l);background:transparent;min-height:56px;padding:10px 14px;display:grid;grid-template-columns:24px 1fr;gap:9px;text-align:left}.answer.sel{background:#111;color:#fff}.letter{width:22px;height:22px;border:1px solid;display:grid;place-items:center;font:900 8px ui-monospace,monospace}.answer span:last-child{font-size:13px;line-height:1.24;font-weight:620}.next{padding:9px 14px calc(9px + env(safe-area-inset-bottom));border-top:1px solid;display:flex;align-items:center;gap:8px;background:#f2f0e8fa;position:sticky;bottom:0}.react{font-size:11px;font-weight:800;max-width:190px}.next .btn{min-height:40px;margin-left:auto;padding:0 11px}.card{margin-top:18px;border:1px solid;background:var(--a);padding:14px}.card h2{font-size:28px;line-height:.88;letter-spacing:-.045em;margin:9px 0}.card p{font-size:13px;line-height:1.3;margin:0}.note{margin:14px 0 0;background:#fff4c3;border:1px solid;padding:10px;font-size:11px;line-height:1.35}@media(max-width:340px){h1{font-size:39px}.lead{font-size:19px}.scene{font-size:21px}.answer span:last-child{font-size:12.5px}}</style></head><body><div class="qa"><div><b>MOBILE QA</b><button class="tab on" data-id="qs">Q / short</button><button class="tab" data-id="ql">Q / long</button><button class="tab" data-id="partial">Partial</button><button class="tab" data-id="complete">Map</button><button class="tab" data-id="member">Member</button></div></div><div class="wrap"><main class="phone" id="phone"></main></div><script>const p=document.getElementById('phone');function head(a=''){return `<header class="top"><div class="brand">DEMENTOR <span>CLUB</span></div>${a?`<div class="acct">${a}</div>`:''}</header>`}function question(long=false){let s=long?`<p>Вы попросили коллегу провести встречу без вас.</p><p>Он провёл. Решения записал. Люди разошлись вовремя.</p><p>Через десять минут приходит сообщение:</p><blockquote>«Всё закрыли. Тебя не трогали».</blockquote><p><span class="fix">Процесс выжил без наблюдателя.<br>Редкий, но допустимый случай.</span></p>`:`<p>Приходишь к компании. Все уже на месте.</p><p>Стол забронирован. После ужина тоже решили, куда идти.</p><p>Никто не спрашивает: <b>«Ну что дальше?»</b></p><p><span class="fix">Люди справились без вас.<br>Пока наблюдаем.</span></p>`;return head()+`<section class="q"><div class="svc"><button class="back">← СФЕРЫ</button><div class="meta">ЛИЧНОСТЬ</div><div class="meta r">${long?'04':'02'} / 06</div><div class="prog"><i style="width:${long?'66':'33'}%"></i></div></div><div class="scene">${s}</div><div class="decision"><div class="dh">Что вы делаете?</div><button class="answer"><span class="letter">A</span><span>Сажусь. Раз справились — не мешаю.</span></button><button class="answer"><span class="letter">B</span><span>Предлагаю пару улучшений. Я всё-таки уже здесь.</span></button><button class="answer"><span class="letter">C</span><span>Уточняю, точно ли от меня ничего не нужно.</span></button><button class="answer"><span class="letter">D</span><span>Оставляю план в покое до реальной причины вмешаться.</span></button><div class="next"><div class="react">Ответ ещё не выбран.</div><button class="btn dark" disabled>ДАЛЬШЕ →</button></div></div></section>`}function entry(k){if(k==='partial')return head()+`<section class="entry"><div class="k">DC-9 / ПРОДОЛЖЕНИЕ</div><h1>ВЫ УЖЕ<br><span class="hl">НАЧАЛИ.</span></h1><p class="lead">Три сферы из девяти уже готовы.</p><p class="copy">Можно продолжить с этого места. Пока вы не вошли, прогресс хранится только в этом браузере. Храбро, но не обязательно.</p><div class="actions"><a class="btn primary">ПРОДОЛЖИТЬ DC-9 →</a><a class="btn">ВОЙТИ И СОХРАНИТЬ</a></div><div class="status">GUEST · 3 / 9 · СОХРАНЕНО ЛОКАЛЬНО</div></section>`;if(k==='complete')return head('ACCOUNT ACTIVE')+`<section class="entry"><div class="k">ACCOUNT / DC-9</div><h1>КАРТА<br><span class="hl">НА МЕСТЕ.</span></h1><p class="lead">Повторно проходить DC-9 для доступа к карте не нужно.</p><p class="copy">Девять результатов сохранены. Дальше начинается отдельный клубный маршрут.</p><div class="actions"><a class="btn primary">ПРОДОЛЖИТЬ В КЛУБ →</a><a class="btn">МОЯ КАРТА DC-9</a></div><div class="teaser"><div class="tv"><div class="rad"></div></div><div class="tc"><b>МОЯ КАРТА DC-9</b><small>9 / 9 сфер · общего балла нет</small><a>ОТКРЫТЬ →</a></div></div><div class="note">QA: точный переход non-member → member пока не утверждён.</div><div class="status">AUTHENTICATED · DC-9 COMPLETE</div></section>`;return head('MEMBER ACTIVE')+`<section class="entry"><div class="k">DEMENTOR CLUB / MEMBER</div><h1>ЛЮДИ ЕСТЬ.<br><span class="hl">ВЫ ТОЖЕ.</span></h1><p class="lead">Клуб уже происходит. Вы в нём уже есть.</p><div class="actions"><a class="btn primary">ВОЙТИ В COMMUNITY →</a><a class="btn">МОЯ КАРТА DC-9</a><a class="btn link">МОЙ АККАУНТ</a></div><div class="card"><div class="k">СЕЙЧАС ПРОИСХОДИТ</div><h2>ЛЮДИ, ИДЕИ,<br>ПОБОЧНЫЕ ЭФФЕКТЫ.</h2><p>Основное действие уже внутри Community. Повторный тест здесь ничего не открывает.</p></div><div class="status">MEMBER ACTIVE · COMMUNITY ДОСТУПНА</div></section>`}function wire(){let a=[...p.querySelectorAll('.answer')],n=p.querySelector('.next .btn'),r=p.querySelector('.react');a.forEach(x=>x.onclick=()=>{a.forEach(y=>y.classList.remove('sel'));x.classList.add('sel');n.disabled=false;r.textContent='Ответ принят. Можно передумать до «Дальше».'})}function render(id){if(id==='qs'){p.innerHTML=question(false);wire()}else if(id==='ql'){p.innerHTML=question(true);wire()}else p.innerHTML=entry(id)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.id)});render('qs');</script></body></html>
