<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>DC-9 Entry State QA</title>
<style>
:root{--paper:#f2f0e8;--ink:#111;--acid:#d8ff3e;--line:rgba(17,17,17,.18);--muted:#777;--qa:#242424}
*{box-sizing:border-box}html,body{margin:0;background:#d7d5ce;color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
button,a{font:inherit;color:inherit}button{cursor:pointer}
.qa{position:sticky;top:0;z-index:100;background:var(--qa);color:white;border-bottom:1px solid #555;padding:10px 12px}
.qa-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:1500px;margin:auto}
.qa strong{font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;margin-right:8px}
.qa button{border:1px solid #666;background:transparent;color:#eee;padding:8px 10px;font:800 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em}
.qa button.on{background:var(--acid);border-color:var(--acid);color:#111}
.qa-note{margin-left:auto;font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aaa}
.viewport-row{border-top:1px solid #444;margin-top:8px;padding-top:8px}.viewport-row span{font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#aaa;margin-right:4px}
.stage-wrap{padding:22px;overflow:auto}.stage{margin:auto;background:var(--paper);min-height:820px;width:min(100%,1536px);box-shadow:0 20px 70px rgba(0,0,0,.15);transition:width .2s}.stage.mobile{width:390px;min-height:844px}.stage.laptop{width:1366px;min-height:768px}.stage.desktop{width:min(1440px,100%);min-height:900px}
.topbar{height:68px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(242,240,232,.97)}.brand{font-size:19px;font-weight:900;letter-spacing:-.05em;text-decoration:none}.brand span{background:var(--acid);padding:2px 5px;margin-left:3px}.nav{margin-left:auto;display:flex;gap:21px;font-size:10px;font-weight:800;text-transform:uppercase}.nav a{opacity:.5;text-decoration:none}.nav a.active{opacity:1;border-bottom:1px solid;padding-bottom:4px}
.shell{max-width:1080px;margin:auto;padding:64px 30px 80px}.kicker{font:900 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.hero{min-height:600px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(62px,7.8vw,118px);line-height:.8;letter-spacing:-.075em;margin:24px 0}.hero h1 span,.acid{background:var(--acid);padding:0 .04em}.lead{font-size:clamp(22px,2.4vw,32px);line-height:1.04;font-weight:850;letter-spacing:-.035em;max-width:790px}.copy{font-size:16px;line-height:1.35;max-width:650px;margin:18px 0 0;color:#3c3c3c}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 17px;border:1px solid var(--ink);background:transparent;text-decoration:none;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}.btn.primary{background:var(--acid);border-color:var(--acid)}.btn.dark{background:#111;color:var(--paper)}.soft{border:0;text-decoration:underline;text-underline-offset:4px;padding-left:4px;padding-right:4px}.statusline{margin-top:34px;padding-top:12px;border-top:1px solid var(--line);font:800 9px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.progressbox{margin-top:26px}.progress-meta{display:flex;justify-content:space-between;font:900 10px ui-monospace,SFMono-Regular,Menlo,monospace}.bar{height:5px;background:#ddd;margin-top:9px}.bar i{display:block;height:100%;background:#111}.map-card{display:grid;grid-template-columns:360px 1fr;border:1px solid #111;margin-top:26px}.radar{min-height:330px;display:grid;place-items:center;border-right:1px solid #111;background:#e9e8e1}.radar svg{width:280px;height:280px}.map-copy{padding:25px}.map-copy h2{font-size:40px;line-height:.9;letter-spacing:-.05em;margin:10px 0 16px}.map-copy p{font-size:16px;line-height:1.35;max-width:480px}.account-chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:7px 10px;font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}.account-chip i{width:8px;height:8px;background:var(--acid);border-radius:50%}.community-block{margin-top:28px;border:2px solid #111;background:var(--acid);padding:27px;position:relative;overflow:hidden}.community-block h2{font-size:clamp(42px,5vw,74px);line-height:.84;letter-spacing:-.055em;margin:15px 0}.community-block p{font-size:19px;font-weight:750;max-width:650px}
.question-shell{max-width:1040px;margin:auto;padding:24px 24px 50px}.service{display:grid;grid-template-columns:auto 1fr auto;gap:15px;align-items:center}.back{border:0;background:transparent;padding:0;font:900 10px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.07em}.service-meta{font:900 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-transform:uppercase}.service-meta.section{text-align:left}.service-meta.count{text-align:right}.qbar{grid-column:1/-1;height:4px;background:#ddd}.qbar i{display:block;width:33%;height:100%;background:#111}.scene{padding-top:22px;max-width:880px;font-size:36px;line-height:1.06;letter-spacing:-.035em;font-weight:720}.scene p{margin:0 0 .46em}.scene blockquote{margin:.25em 0 .46em;border-left:4px solid var(--acid);padding-left:15px;font-weight:790}.scene .fix span{background:var(--acid);font-weight:820}.answer-label{font-size:12px;font-weight:800;margin:18px 0 9px}.answers{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid var(--line);border-top:1px solid var(--line)}.answer{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:13px 14px;display:grid;grid-template-columns:27px 1fr;gap:10px;text-align:left;min-height:75px}.letter{width:24px;height:24px;border:1px solid;display:grid;place-items:center;font:900 9px ui-monospace,SFMono-Regular,Menlo,monospace}.answer span:last-child{font-size:14px;line-height:1.26;font-weight:620}.nextrow{display:flex;align-items:center;margin-top:10px;border:1px solid var(--line);padding:10px;min-height:55px}.accepted{font-size:13px;font-weight:800}.accepted b{background:var(--acid);display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px}.nextrow .btn{margin-left:auto;min-height:38px}.conflict{margin-top:22px;border:1px solid #111;padding:16px;background:#fff7d0}.conflict strong{font:900 10px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}.conflict p{margin:8px 0 0;font-size:13px;line-height:1.35}
@media(max-width:600px){.stage-wrap{padding:10px}.stage.mobile{width:100%;max-width:390px}.topbar{height:58px;padding:0 14px}.brand{font-size:17px}.nav{display:none}.shell{padding:38px 14px 55px}.hero{min-height:650px;justify-content:flex-start;padding-top:48px}.hero h1{font-size:18vw;margin:20px 0}.lead{font-size:25px}.copy{font-size:14px}.actions{flex-direction:column}.btn{width:100%}.map-card{grid-template-columns:1fr}.radar{min-height:240px;border-right:0;border-bottom:1px solid #111}.radar svg{width:210px;height:210px}.map-copy{padding:18px}.map-copy h2{font-size:34px}.community-block{padding:20px}.community-block h2{font-size:41px}.community-block p{font-size:17px}.question-shell{padding:15px 14px 30px}.scene{font-size:23px;line-height:1.08;padding-top:17px}.scene p{margin-bottom:.44em}.scene blockquote{border-left-width:3px;padding-left:11px}.answers{grid-template-columns:1fr}.answer{min-height:63px;padding:11px}.answer span:last-child{font-size:13.5px}.service{gap:8px}.back,.service-meta{font-size:8.5px}.nextrow{position:sticky;bottom:0;margin-left:-14px;margin-right:-14px;border-left:0;border-right:0;background:rgba(242,240,232,.96);backdrop-filter:blur(10px);padding-left:14px;padding-right:14px}.qa-note{display:none}}
</style>
</head>
<body>
<div class="qa"><div class="qa-row"><strong>DC-9 ENTRY QA</strong><button class="state on" data-state="guest-none">Guest / none</button><button class="state" data-state="guest-partial">Guest / partial</button><button class="state" data-state="guest-complete">Guest / complete</button><button class="state" data-state="auth-none">Auth / none</button><button class="state" data-state="auth-partial">Auth / partial</button><button class="state" data-state="auth-complete">Auth / complete</button><button class="state" data-state="member-first">Member / first artifact</button><button class="state" data-state="member-active">Member / active</button><button class="state" data-state="question">Question / LONG</button><span class="qa-note">SIMULATION ONLY · NO AUTH / DB WRITES</span></div><div class="qa-row viewport-row"><span>VIEW</span><button class="view on" data-view="desktop">1440</button><button class="view" data-view="laptop">1366×768</button><button class="view" data-view="mobile">390×844</button></div></div>
<div class="stage-wrap"><div class="stage desktop" id="stage"></div></div>
<script>
const states={
"guest-none":{kicker:"DC-9 / ВХОДНОЕ ОБСЛЕДОВАНИЕ",title:"ДЕВЯТЬ<br><span>СФЕР.</span>",lead:"Вашу личность пока оставим в покое.<br>Хочется понять, как вы дошли до этого места.",copy:"Девять сфер. По шесть сцен в каждой. Начать можно с любой. Общего балла не будет — придётся жить с девятью отдельными результатами.",primary:"НАЧАТЬ DC-9 →",secondary:"ВОЙТИ ЧЕРЕЗ GOOGLE",status:"GUEST · ПОКАЗАНИЯ ЕЩЁ НЕ СОБИРАЛИСЬ"},
"guest-partial":{kicker:"DC-9 / ПРОДОЛЖЕНИЕ",title:"ТРИ СФЕРЫ<br><span>УЖЕ ДАЛИ ПОКАЗАНИЯ.</span>",lead:"Делать вид, что вы просто зашли посмотреть, стало немного сложнее.",copy:"Продолжить можно с этого места. Пока вы не вошли, прогресс живёт только в этом браузере — довольно хрупкая форма бессмертия.",primary:"ПРОДОЛЖИТЬ DC-9 →",secondary:"ВОЙТИ И СОХРАНИТЬ",status:"GUEST · 3 / 9 · МАТЕРИАЛ СОХРАНЁН ЛОКАЛЬНО",progress:33},
"guest-complete":{kicker:"DC-9 / КАРТА ГОТОВА",title:"ДЕВЯТЬ<br><span>ИЗ ДЕВЯТИ.</span>",lead:"Материал собран. Аккаунт к делу пока не приложен.",copy:"Карту можно посмотреть сразу. Вход через Google нужен только если вы хотите сохранить её в аккаунте и потом найти на другом устройстве.",primary:"ПОСМОТРЕТЬ КАРТУ →",secondary:"СОХРАНИТЬ В АККАУНТ",status:"GUEST · DC-9 COMPLETE · ВЛАДЕЛЕЦ НЕ УСТАНОВЛЕН",map:true},
"auth-none":{kicker:"ACCOUNT / DC-9",title:"АККАУНТ ЕСТЬ.<br><span>ПОКАЗАНИЙ НЕТ.</span>",lead:"Редкий случай: система знает, кто вы, но пока не знает, что с этим делать.",copy:"Начать можно с любой сферы. Завершённые результаты сохранятся в аккаунте автоматически.",primary:"НАЧАТЬ DC-9 →",secondary:"МОЙ АККАУНТ",status:"AUTHENTICATED · 0 / 9 · ДЕЛО НЕ ЗАВЕДЕНО",account:true},
"auth-partial":{kicker:"ACCOUNT / DC-9",title:"ДЕЛО<br><span>НЕ ЗАКРЫТО.</span>",lead:"Три сферы уже дали показания. Остальные сохраняют процессуальное молчание.",copy:"Продолжим с сохранённого места. То, что уже завершено, останется в аккаунте и на другом устройстве.",primary:"ПРОДОЛЖИТЬ DC-9 →",secondary:"МОЙ АККАУНТ",status:"AUTHENTICATED · 3 / 9 · ПРОДОЛЖЕНИЕ ДОПУСКАЕТСЯ",progress:33,account:true},
"auth-complete":{kicker:"ACCOUNT / DC-9",title:"КАРТА<br><span>НА МЕСТЕ.</span>",lead:"Повторное обследование для подтверждения существования не требуется.",copy:"Девять результатов сохранены в аккаунте. Дальше — отдельный клубный маршрут. DC-9 сам по себе членство не выдаёт.",primary:"ПРОДОЛЖИТЬ В КЛУБ →",secondary:"МОЯ КАРТА DC-9",tertiary:"ПРОЙТИ ЕЩЁ РАЗ",status:"AUTHENTICATED · DC-9 COMPLETE · MEMBERSHIP НЕ ПОДТВЕРЖДЁН",map:true,account:true,conflict:true},
"member-first":{kicker:"COMMUNITY / ENTRY",title:"ВЫ УЖЕ<br><span>В КЛУБЕ.</span>",lead:"На этом месте обычно заканчивается онбординг и начинается что-нибудь менее предусмотренное.",copy:"Первый маршрут — Community Board. Карта DC-9 остаётся рядом, но больше не изображает входную дверь.",primary:"ОТКРЫТЬ COMMUNITY BOARD →",secondary:"МОЯ КАРТА DC-9",tertiary:"МОЙ АККАУНТ",status:"MEMBER ACTIVE · ПЕРВЫЙ АРТЕФАКТ ЕЩЁ НЕ ОСТАВЛЕН",account:true,community:true},
"member-active":{kicker:"DEMENTOR CLUB / MEMBER",title:"ЛЮДИ ЕСТЬ.<br><span>ВЫ ТОЖЕ.</span>",lead:"Клуб уже происходит. Для входа обратно ничего доказывать не нужно.",copy:"Community — основной маршрут. Карта DC-9 остаётся в аккаунте как отдельный артефакт, а не как турникет.",primary:"ВОЙТИ В COMMUNITY →",secondary:"МОЯ КАРТА DC-9",tertiary:"МОЙ АККАУНТ",status:"MEMBER ACTIVE · ВХОД ПОВТОРНО НЕ СОГЛАСОВЫВАЕТСЯ",account:true,community:true}
};
function header(){return `<header class="topbar"><a class="brand" href="#">DEMENTOR <span>CLUB</span></a><nav class="nav"><a>Club</a><a>Events</a><a>Projects</a><a class="active">Community</a><a>Merch</a><a>Blog</a><a>Join</a><a>Account</a></nav></header>`;}
function radar(){const pts="150,43 213,71 247,130 235,199 185,246 115,246 65,199 53,130 87,71";return `<svg viewBox="0 0 300 300" aria-hidden="true"><g fill="none" stroke="#111" opacity=".14">${[.25,.5,.75,1].map(k=>`<circle cx="150" cy="150" r="${100*k}"/>`).join("")}${Array.from({length:9},(_,i)=>{const a=-Math.PI/2+i*Math.PI*2/9,x=150+Math.cos(a)*100,y=150+Math.sin(a)*100;return `<line x1="150" y1="150" x2="${x}" y2="${y}"/>`}).join("")}</g><polygon points="${pts}" fill="#d8ff3e" fill-opacity=".65" stroke="#111" stroke-width="3"/>${pts.split(" ").map(p=>{const[x,y]=p.split(",");return `<circle cx="${x}" cy="${y}" r="4" fill="#111"/>`}).join("")}</svg>`;}
function mapBlock(){return `<div class="map-card"><div class="radar">${radar()}</div><div class="map-copy"><div class="kicker">МОЯ КАРТА DC-9</div><h2>ДЕВЯТЬ СФЕР.<br>КАЖДАЯ САМА ЗА СЕБЯ.</h2><p>Карта хранит девять отдельных результатов. Общий балл не предусмотрен. Повторное прохождение — отдельное решение, а не обязательное обслуживание карты.</p><div class="actions"><a class="btn" href="#">ОТКРЫТЬ КАРТУ →</a></div></div></div>`;}
function renderState(key){const s=states[key];if(key==="question"){renderQuestion();return}stage.innerHTML=header()+`<main class="shell"><section class="hero"><div>${s.account?'<span class="account-chip"><i></i> GOOGLE ACCOUNT / SESSION ACTIVE</span>':''}</div><div class="kicker" style="margin-top:${s.account?'20px':'0'}">${s.kicker}</div><h1>${s.title}</h1><div class="lead">${s.lead}</div><p class="copy">${s.copy}</p>${s.progress!==undefined?`<div class="progressbox"><div class="progress-meta"><span>DC-9</span><span>${Math.round(s.progress/100*9)} / 9</span></div><div class="bar"><i style="width:${s.progress}%"></i></div></div>`:''}${s.map?mapBlock():''}${s.community?`<div class="community-block"><div class="kicker">COMMUNITY</div><h2>${key==="member-active"?"СЕЙЧАС ПРОИСХОДИТ.":"ПЕРВЫЙ СЛЕД."}</h2><p>${key==="member-active"?"Люди, события, идеи и побочные эффекты уже здесь. Можно войти в существующую историю или случайно начать новую.":"Карта уже собрана. Теперь можно оставить после себя что-нибудь, кроме результата обследования."}</p></div>`:''}<div class="actions"><a class="btn primary" href="#">${s.primary}</a><a class="btn" href="#">${s.secondary}</a>${s.tertiary?`<a class="btn soft" href="#">${s.tertiary}</a>`:''}</div>${s.conflict?`<div class="conflict"><strong>QA / НЕ ПУБЛИЧНЫЙ ТЕКСТ</strong><p>Переход из авторизованного пользователя в члена клуба пока не утверждён как единая механика. Этот стенд не придумывает её вместо source-of-truth.</p></div>`:''}<div class="statusline">${s.status}</div></section></main>`;}
function renderQuestion(){stage.innerHTML=header()+`<main class="question-shell"><div class="service"><button class="back">← К СФЕРАМ</button><div class="service-meta section">01 / ЛИЧНОСТЬ</div><div class="service-meta count">02 / 06</div><div class="qbar"><i></i></div></div><section class="scene"><p>Приходишь к компании. Все уже на месте.</p><p>Стол забронирован. После ужина тоже решили, куда идти.</p><p>Никто не спрашивает:</p><blockquote>«Ну что дальше?»</blockquote><p class="fix"><span>Люди справились без вас.<br>Пока наблюдаем.</span></p></section><div class="answer-label">Что вы делаете?</div><div class="answers"><button class="answer"><span class="letter">A</span><span>Сажусь. Раз справились — не мешаю.</span></button><button class="answer"><span class="letter">B</span><span>Предлагаю пару улучшений. Я всё-таки уже здесь.</span></button><button class="answer"><span class="letter">C</span><span>Уточняю у организатора, точно ли от меня ничего не нужно.</span></button><button class="answer"><span class="letter">D</span><span>Сажусь. Если план развалится, выясним это без профилактики.</span></button></div><div class="nextrow"><span class="accepted"><b>✓</b> Ответ принят.</span><button class="btn dark">ДАЛЬШЕ →</button></div></main>`;}
const stage=document.getElementById("stage");document.querySelectorAll(".state").forEach(b=>b.onclick=()=>{document.querySelectorAll(".state").forEach(x=>x.classList.toggle("on",x===b));renderState(b.dataset.state)});document.querySelectorAll(".view").forEach(b=>b.onclick=()=>{document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x===b));stage.className="stage "+b.dataset.view});renderState("guest-none");
</script>
</body>
</html>
