<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#dfff00">
<title>DEMENTOR LAB — Mobile QA</title>
<style>
:root{--paper:#f3efe5;--ink:#111;--acid:#dfff00;--muted:#777;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}
button,input{font:inherit}.app{min-height:100vh;padding-bottom:74px}.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-top));background:var(--paper);border-bottom:3px solid #111}
.top button{min-height:44px;border:2px solid #111;background:#fff;font-weight:900}.title{text-align:center;min-width:0}.title b{display:block;font:900 12px monospace}.title small{font:700 8px monospace;color:#666}
.page{display:none;padding:10px;max-width:760px;margin:auto}.page.active{display:block}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:3px solid #111}
.bottom button{min-height:58px;border:0;border-right:1px solid #bbb;background:#fff;font:900 10px monospace}.bottom button.active{background:var(--acid)}
.panel{border:3px solid #111;background:#fff;padding:10px}.cap{font:900 8px monospace;color:#666}.hero{position:relative;min-height:320px;display:flex;align-items:flex-end;justify-content:center;background:#eee;border:2px solid #111;overflow:hidden}.hero img{max-width:100%;max-height:410px;object-fit:contain}.hero:before{content:"LIVE CHARACTER";position:absolute;left:8px;top:8px;background:var(--acid);border:2px solid #111;padding:5px 7px;font:900 7px monospace}
.switch,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.switch button,.chip,.action{min-height:48px;border:2px solid #111;background:#fff;font:900 9px monospace}.switch button.active,.primary{background:var(--acid)!important}.meta{margin-top:8px;border:2px solid #111;padding:8px;display:flex;justify-content:space-between;gap:8px;font:800 9px monospace}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid #111;background:#fff;padding:8px;margin-bottom:8px;font:900 8px monospace}.status strong{background:var(--acid);padding:5px 7px}
.tools{display:grid;grid-template-columns:1fr 50px 50px;gap:6px;margin-bottom:8px}.tools button{min-height:48px;border:2px solid #111;background:#fff;font:900 9px monospace}
.canvas{position:relative;height:520px;border:3px solid #111;background:#f7f7f4;overflow:hidden;touch-action:none}.canvas svg{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:7px;bottom:7px;right:7px;background:#fff;border:2px solid #111;padding:6px;font:800 7px/1.3 monospace;pointer-events:none}.connect{display:none;position:absolute;z-index:5;left:8px;right:8px;top:8px;background:var(--acid);border:2px solid #111;padding:7px;font:900 8px monospace}.connect.show{display:block}
.runbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.runbar button{min-height:48px;border:2px solid #111;background:#fff;font:900 9px monospace}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fighter{border:3px solid #111;background:#fff;padding:7px}.head{display:flex;gap:6px;align-items:center}.head img{width:58px;height:58px;object-fit:contain;border:2px solid #111;background:#eee}.head b{font:900 9px monospace}.meterrow{display:grid;grid-template-columns:44px 1fr 26px;gap:4px;align-items:center;margin-top:5px;font:800 6px monospace}.meter{height:7px;border:1px solid #111;background:#ddd}.meter i{display:block;height:100%;background:#111}
.objective{margin-top:8px;border:3px solid #111;background:var(--acid);padding:8px}.objhead{display:flex;justify-content:space-between;gap:8px;font:900 8px monospace}.goal{height:10px;border:2px solid #111;background:#fff;margin-top:6px}.goal i{display:block;height:100%;background:#111}
.dialog{margin-top:8px;border:3px solid #111;background:#fff;min-height:260px;max-height:360px;overflow:auto;padding:8px}.msg{border:2px solid #111;margin:0 0 7px;padding:7px;font:800 9px/1.35 monospace}.msg.a{background:var(--acid)}.msg.b{background:#eee}.msg.sys{border-style:dashed;color:#666;font-size:7px}
.talkactions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;margin-top:8px}.talkactions button{min-height:52px;border:2px solid #111;background:#fff;font:900 8px monospace}.talkactions .patch{background:var(--acid)}
.sheetback{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4)}.sheetback.show{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:var(--paper);border-top:4px solid #111;padding:10px calc(10px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}.handle{width:44px;height:5px;background:#111;margin:0 auto 10px}.sheet h3{font:900 15px monospace;margin:0 0 8px}.sheetgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.sheet button{min-height:50px;border:2px solid #111;background:#fff;padding:8px;text-align:left;font:900 8px/1.25 monospace}.selected{background:var(--acid)!important}
.toast{position:fixed;left:50%;bottom:84px;z-index:120;transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:calc(100% - 28px);background:#111;color:#fff;padding:9px 12px;font:900 8px monospace;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
.qa{position:fixed;right:8px;top:calc(62px + env(safe-area-inset-top));z-index:25;background:#111;color:#fff;padding:5px 7px;font:700 7px monospace;pointer-events:none}
@media(min-width:760px){body:before{content:"MOBILE QA — resize browser or open on phone";display:block;text-align:center;padding:8px;font:900 9px monospace;background:#111;color:#fff}.app{max-width:560px;margin:auto;border-left:2px solid #111;border-right:2px solid #111}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><button id="back">←</button><div class="title"><b id="title">ГЕНА / PERSON</b><small id="sub">Собери внешний образ</small></div><button id="menu">•••</button></header>
<section class="page active" data-page="person">
 <div class="panel"><div class="cap">PERSON</div><div class="hero"><div style="font:900 72px monospace;padding:90px 0">☺</div></div><div class="meta"><span>ГЕНА</span><b>READY</b></div><div class="switch"><button class="active">ГЕНА</button><button>МАРТА</button></div><div class="grid2"><button class="chip">ГОЛОВА<br><small>ушанка / очки</small></button><button class="chip">ОДЕЖДА<br><small>рубашка / шорты</small></button><button class="chip">АКСЕССУАРЫ<br><small>сигара / борода</small></button><button class="chip">ЭМОЦИЯ<br><small>нейтральная</small></button></div></div>
</section>
<section class="page" data-page="brain"><div class="status"><span id="presetName">ПОДКАБЛУЧНИК</span><strong>RUNNABLE</strong></div><div class="tools"><button class="primary" id="addBlock">＋ БЛОК</button><button id="center">◎</button><button id="layout">⟳</button></div><div class="canvas"><div class="connect" id="connectMode">ВЫБЕРИ СОВМЕСТИМЫЙ БЛОК</div><svg id="graph" viewBox="0 0 1100 800"></svg><div class="hint">пустое поле — pan · блок — drag · порт: tap → tap</div></div><div class="runbar"><button id="presets">ПРЕСЕТЫ</button><button class="primary" id="testTalk">▶ TEST TALK</button></div></section>
<section class="page" data-page="talk"><div class="people"><div class="fighter"><div class="head"><div style="font-size:40px">☺</div><b>ГЕНА</b></div><div id="statsA"></div></div><div class="fighter"><div class="head"><div style="font-size:40px">☹</div><b>МАРТА</b></div><div id="statsB"></div></div></div><div class="objective"><div class="objhead"><span id="goalName">ПЕРЕУБЕДИТЬ</span><span id="goalText">0% / 0%</span></div><div class="goal"><i id="goalBar" style="width:0"></i></div></div><div class="dialog" id="dialog"></div><div class="talkactions"><button id="next">NEXT</button><button id="auto">AUTO</button><button class="patch" id="patch">⚡ HOT PATCH</button></div></section>
<nav class="bottom"><button class="active" data-nav="person">PERSON</button><button data-nav="brain">BRAIN</button><button data-nav="talk">TALK</button></nav>
<div class="sheetback" id="sheetback"><div class="sheet"><div class="handle"></div><h3 id="sheettitle">MENU</h3><div id="sheetcontent"></div></div></div><div class="toast" id="toast"></div><div class="qa">QA MOBILE v1.2</div>
</div>
<script>
(()=>{const app=document.querySelector('#app'),$=q=>app.querySelector(q),$$=q=>[...app.querySelectorAll(q)];let page='person',toastT=null,autoT=null;let currentPreset='henpecked';let connectFrom=null;let A={energy:85,brain:15,tension:10,contact:60},B={energy:85,brain:15,tension:10,contact:60},phrases=0,loops=0,goalA=0,goalB=0,lastExec=[];
const specs={criticism:{f:'TRIGGER',t:'КРИТИКА',in:0,out:1},beliked:{f:'IMPULSE',t:'НРАВИТЬСЯ',in:1,out:1},beright:{f:'IMPULSE',t:'БЫТЬ ПРАВЫМ',in:1,out:1},understand:{f:'IMPULSE',t:'ПОНЯТЬ',in:1,out:1},agree:{f:'REACTION',t:'СОГЛАСИТЬСЯ',in:1,out:1},joke:{f:'REACTION',t:'ПОШУТИТЬ',in:1,out:1},explain:{f:'REACTION',t:'ОБЪЯСНИТЬ',in:1,out:1},pressure:{f:'REACTION',t:'ДАВИТЬ',in:1,out:1},repeat:{f:'CONTROL',t:'REPEAT',in:1,out:1},pause:{f:'ABILITY',t:'ПАУЗА',in:1,out:1},interrupt:{f:'ABILITY',t:'ПЕРЕХВАТ',in:1,out:1},stop:{f:'CONTROL',t:'STOP',in:1,out:0}};
const presetDefs={henpecked:{label:'ПОДКАБЛУЧНИК',nodes:[['criticism',100,170,{}],['beliked',310,170,{weight:5}],['agree',520,170,{}],['stop',730,170,{}]],edges:[[0,1],[1,2],[2,3]]},preacher:{label:'ПРОПОВЕДНИК',nodes:[['criticism',100,170,{}],['beright',310,170,{weight:5}],['explain',520,170,{}],['repeat',730,170,{count:4}],['stop',940,170,{}]],edges:[[0,1],[1,2],[2,3],[3,4]]},diplomat:{label:'ХОЛОДНЫЙ ДИПЛОМАТ',nodes:[['criticism',100,170,{}],['understand',310,170,{weight:4}],['pause',520,170,{}],['explain',730,170,{}],['stop',940,170,{}]],edges:[[0,1],[1,2],[2,3],[3,4]]},chaos:{label:'ХАОТИЧНЫЙ АВАНТЮРИСТ',nodes:[['criticism',100,170,{}],['beliked',310,170,{weight:2}],['joke',520,170,{}],['repeat',730,170,{count:2}],['stop',940,170,{}]],edges:[[0,1],[1,2],[2,3],[3,4]]},pro:{label:'DEMENTOR PRO',nodes:[['criticism',70,170,{}],['understand',270,170,{weight:5}],['pressure',470,170,{}],['repeat',670,170,{count:2}],['interrupt',870,170,{}],['stop',1030,170,{}]],edges:[[0,1],[1,2],[2,3],[3,4],[4,5]]}};
let nodes=[],edges=[];function loadPreset(k){currentPreset=k;let p=presetDefs[k];nodes=p.nodes.map((a,i)=>({id:'n'+i,type:a[0],x:a[1],y:a[2],p:{...a[3]}}));edges=p.edges.map(e=>({from:'n'+e[0],to:'n'+e[1]}));$('#presetName').textContent=p.label;resetTalk();renderGraph()}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1300)}function show(name){page=name;$$('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===name));$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===name));let m={person:['ГЕНА / PERSON','Собери внешний образ'],brain:['ГЕНА / BRAIN','Собери характер'],talk:['ГЕНА × МАРТА / TALK','Проверь модель в разговоре']}[name];$('#title').textContent=m[0];$('#sub').textContent=m[1];if(name==='brain')renderGraph();if(name==='talk')renderTalk()}$$('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav));$('#back').onclick=()=>show(page==='talk'?'brain':page==='brain'?'person':'person');function openSheet(t,c){$('#sheettitle').textContent=t;$('#sheetcontent').innerHTML=c;$('#sheetback').classList.add('show')}function closeSheet(){$('#sheetback').classList.remove('show')}$('#sheetback').onclick=e=>{if(e.target===$('#sheetback'))closeSheet()};
function renderGraph(){let svg=$('#graph');svg.innerHTML='';edges.forEach(e=>{let a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to);if(!a||!b)return;let p=document.createElementNS('http://www.w3.org/2000/svg','path');let x1=a.x+160,y1=a.y+32,x2=b.x,y2=b.y+32,m=(x1+x2)/2;p.setAttribute('d',`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke','#111');p.setAttribute('stroke-width','9');svg.appendChild(p)});nodes.forEach(n=>{let s=specs[n.type],g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform',`translate(${n.x} ${n.y})`);g.dataset.node=n.id;g.innerHTML=`<rect width="160" height="64" fill="#111"/><rect width="46" height="64" fill="#dfff00"/><text x="56" y="20" fill="#999" font-size="9" font-family="monospace">${s.f}</text><text x="56" y="42" fill="#fff" font-size="13" font-family="monospace" font-weight="900">${s.t}</text>${s.in?'<circle data-in="'+n.id+'" cx="0" cy="32" r="15" fill="#fff" stroke="#111" stroke-width="5"/>':''}${s.out?'<circle data-out="'+n.id+'" cx="160" cy="32" r="17" fill="#dfff00" stroke="#111" stroke-width="5"/>':''}`;svg.appendChild(g)});svg.querySelectorAll('[data-out]').forEach(x=>x.onclick=e=>{e.stopPropagation();connectFrom=x.dataset.out;$('#connectMode').classList.add('show')});svg.querySelectorAll('[data-in]').forEach(x=>x.onclick=e=>{e.stopPropagation();if(connectFrom&&connectFrom!==x.dataset.in&&!edges.some(a=>a.from===connectFrom&&a.to===x.dataset.in)){edges.push({from:connectFrom,to:x.dataset.in});toast('СВЯЗЬ ДОБАВЛЕНА')}connectFrom=null;$('#connectMode').classList.remove('show');renderGraph()})}
$('#center').onclick=renderGraph;$('#layout').onclick=()=>{nodes.forEach((n,i)=>{n.x=70+i*190;n.y=190});renderGraph()};$('#addBlock').onclick=()=>openSheet('ДОБАВИТЬ БЛОК',`<div class="sheetgrid">${Object.keys(specs).map(k=>`<button data-add="${k}">${specs[k].t}</button>`).join('')}</div>`);$('#presets').onclick=()=>openSheet('ПРЕСЕТЫ',`<div class="sheetgrid">${Object.entries(presetDefs).map(([k,p])=>`<button data-preset="${k}">${p.label}</button>`).join('')}</div>`);$('#sheetcontent').onclick=e=>{let a=e.target.closest('[data-add]'),p=e.target.closest('[data-preset]');if(a){nodes.push({id:'n'+Date.now(),type:a.dataset.add,x:400,y:400,p:{}});closeSheet();renderGraph()}if(p){loadPreset(p.dataset.preset);closeSheet()}};
function resetTalk(){A={energy:85,brain:15,tension:10,contact:60};B={energy:85,brain:15,tension:10,contact:60};phrases=loops=goalA=goalB=0;$('#dialog').innerHTML='';log('S','OBJECTIVE: ПЕРЕУБЕДИТЬ. Граф против графа.');renderTalk()}function log(w,t){let d=document.createElement('div');d.className='msg '+(w==='A'?'a':w==='B'?'b':'sys');d.textContent=(w==='A'?'ГЕНА: ':w==='B'?'МАРТА: ':'')+t;$('#dialog').appendChild(d);$('#dialog').scrollTop=$('#dialog').scrollHeight}function renderStats(el,o){el.innerHTML=[['ENERGY',o.energy],['BRAIN',o.brain],['TENSION',o.tension],['CONTACT',o.contact]].map(([k,v])=>`<div class="meterrow"><span>${k}</span><div class="meter"><i style="width:${v}%"></i></div><b>${Math.round(v)}</b></div>`).join('')}function renderTalk(){renderStats($('#statsA'),A);renderStats($('#statsB'),B);$('#goalText').textContent=Math.round(goalA)+'% / '+Math.round(goalB)+'%';$('#goalBar').style.width=Math.max(goalA,goalB)+'%'}function execA(){let path=nodes;lastExec=path;let types=path.map(n=>n.type);if(types.includes('pressure')){B.brain=Math.min(100,B.brain+22);B.tension=Math.min(100,B.tension+12);A.brain=Math.min(100,A.brain+9);goalA=Math.min(100,goalA+24);log('A','Ты держишь две несовместимые позиции. Какая из них настоящая?')}else if(types.includes('agree')){A.tension=Math.max(0,A.tension-10);A.contact=Math.min(100,A.contact+8);goalA=Math.min(100,goalA+4);log('A','Возможно, ты права. Давай не будем это продавливать.')}else if(types.includes('joke')){A.tension=Math.max(0,A.tension-7);A.contact=Math.min(100,A.contact+6);goalA=Math.min(100,goalA+8);log('A','Тогда считаем это контролируемой катастрофой.')}else{A.brain=Math.min(100,A.brain+12);B.brain=Math.min(100,B.brain+7);goalA=Math.min(100,goalA+13);log('A','Давай разберём, где именно эта идея ломается.')}let r=nodes.find(n=>n.type==='repeat');if(r&&r.p.count>1){A.brain=Math.min(100,A.brain+(r.p.count-1)*5);B.brain=Math.min(100,B.brain+(r.p.count-1)*4);loops+=r.p.count-1}if(types.includes('pause')){A.brain=Math.max(0,A.brain-18);A.tension=Math.max(0,A.tension-12);A.energy=Math.min(100,A.energy+4)}}function execB(){B.brain=Math.min(100,B.brain+11);A.brain=Math.min(100,A.brain+8);A.tension=Math.min(100,A.tension+5);A.contact=Math.max(0,A.contact-2);goalB=Math.min(100,goalB+12);log('B','Я слышу аргумент. Но пока не вижу, почему из него следует твой вывод.')}function turn(){if(A.brain>=100||B.brain>=100||A.tension>=100||B.tension>=100||A.energy<=0||B.energy<=0||A.contact<=0||B.contact<=0||goalA>=100||goalB>=100){clearInterval(autoT);autoT=null;toast(goalA>=100||B.brain>=100?'ПОБЕДИЛ ГЕНА':'МАТЧ ЗАВЕРШЁН');return}phrases++;if(phrases%2)execA();else execB();renderTalk()}$('#next').onclick=turn;$('#auto').onclick=()=>{if(autoT){clearInterval(autoT);autoT=null;toast('AUTO OFF')}else{autoT=setInterval(turn,650);toast('AUTO ON')}};$('#testTalk').onclick=()=>{resetTalk();show('talk');toast('ЭКСПЕРИМЕНТ ЗАПУЩЕН')};$('#patch').onclick=()=>{let r=nodes.find(n=>n.type==='repeat'),path=lastExec.length?lastExec:nodes.slice(0,5);openSheet('⚡ HOT PATCH',`<div class="cap">АКТИВНЫЙ ПУТЬ</div><p style="font:900 9px monospace">${path.map(n=>specs[n.type]?.t||n.type).join(' → ')}</p><div class="sheetgrid"><button id="reduce">REPEAT −1</button><button id="addPause">＋ PAUSE</button><button id="fullBrain">ОТКРЫТЬ BRAIN</button><button class="primary" id="apply">APPLY & CONTINUE</button></div>`);setTimeout(()=>{$('#reduce').onclick=()=>{if(r&&r.p.count>1){r.p.count--;renderGraph();toast('REPEAT УМЕНЬШЕН')}};$('#addPause').onclick=()=>{let target=r||nodes.find(n=>['explain','pressure'].includes(n.type));if(!target)return;let incoming=edges.find(e=>e.to===target.id);let p={id:'n'+Date.now(),type:'pause',x:target.x-180,y:target.y+110,p:{}};nodes.push(p);if(incoming){incoming.to=p.id;edges.push({from:p.id,to:target.id})}renderGraph();toast('PAUSE ВСТАВЛЕН')};$('#fullBrain').onclick=()=>{closeSheet();show('brain')};$('#apply').onclick=()=>{closeSheet();show('talk');toast('PATCH ПРИМЕНЁН')}},0)};$('#menu').onclick=()=>{openSheet('МЕНЮ','<div class="sheetgrid"><button id="reset">RESET TALK</button><button id="brainJump">BRAIN</button><button id="personJump">PERSON</button></div>');setTimeout(()=>{$('#reset').onclick=()=>{resetTalk();closeSheet()};$('#brainJump').onclick=()=>{closeSheet();show('brain')};$('#personJump').onclick=()=>{closeSheet();show('person')}},0)};loadPreset('henpecked');renderTalk()})();
</script>
</body></html>
