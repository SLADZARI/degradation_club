# Dedicated Nginx virtual host for Dementor Live.
# Installed at /etc/nginx/sites-available/dementor-live.conf.
server {
    listen 80;
    listen [::]:80;
    server_name 138.199.144.94;

    access_log /var/log/nginx/dementor-live.access.log;
    error_log /var/log/nginx/dementor-live.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:14173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
