# Dedicated ALPHA VM: same reverse-proxy pattern as the demo, with its own loopback port.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/dementor-live-alpha.access.log;
    error_log /var/log/nginx/dementor-live-alpha.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:14174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
