name: dementor-live

services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dementor-live:local
    restart: unless-stopped
    init: true
    environment:
      DEMENTOR_HOST: 0.0.0.0
      DEMENTOR_PORT: "4173"
      DEMENTOR_STATE: /app/data/world.json
      DEMENTOR_PUBLIC_URL: ${DEMENTOR_PUBLIC_URL:?Set DEMENTOR_PUBLIC_URL in deploy/.env}
    ports:
      - "${DEMENTOR_BIND_ADDRESS:-127.0.0.1}:${DEMENTOR_BIND_PORT:-14173}:4173"
    volumes:
      - dementor_live_world:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dementor_live_world:
    name: dementor-live-world
