<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Profile — Dementor Club</title><meta name="description" content="Личный профиль Dementor Club: карта 9 сфер, история прохождений и сохранённые действия."><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/global-header.css"><style>body{background:#111;color:#f2f0e8}.dc-profile{max-width:1160px;margin:0 auto;padding:58px 24px 110px}.dc-profile__top{display:flex;justify-content:space-between;gap:30px;align-items:end;border-bottom:1px solid rgba(255,255,255,.22);padding-bottom:28px}.dc-profile h1{font-size:clamp(58px,10vw,120px);line-height:.82;letter-spacing:-.075em;margin:0}.dc-profile__user{text-align:right;max-width:360px}.dc-profile__user strong{font-size:22px}.dc-profile__user p{opacity:.55}.dc-profile button,.dc-profile .button{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;padding:10px 13px;font:800 11px/1 Inter,Arial,sans-serif;letter-spacing:.06em;text-decoration:none;cursor:pointer}.dc-profile button:hover,.dc-profile .button:hover{background:#d8ff3e;color:#111;border-color:#d8ff3e}.dc-map{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.2);border-left:1px solid rgba(255,255,255,.2);margin-top:44px}.dc-map__item{padding:24px;border-right:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.2);min-height:180px;display:flex;flex-direction:column;justify-content:space-between}.dc-map__item span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}.dc-map__item strong{font-size:50px;letter-spacing:-.06em}.dc-section{margin-top:58px}.dc-section h2{font-size:clamp(36px,6vw,68px);letter-spacing:-.05em;margin:0 0 22px}.dc-history__row,.dc-order__row{display:grid;grid-template-columns:160px 1fr 120px 120px;gap:16px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.16);align-items:center}.dc-history__row small,.dc-order__row small{opacity:.55}.dc-empty{padding:28px 0;opacity:.55}.dc-profile__login{padding:60px 0;max-width:720px}.dc-profile__login p{font-size:22px;line-height:1.45;opacity:.72}.dc-profile__actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}@media(max-width:760px){.dc-profile__top{display:block}.dc-profile__user{text-align:left;margin-top:24px}.dc-map{grid-template-columns:1fr}.dc-history__row,.dc-order__row{grid-template-columns:1fr 1fr}.dc-history__row>*:nth-child(2),.dc-order__row>*:nth-child(2){grid-column:1/-1}}</style></head><body><header class="topbar"></header><main class="dc-profile"><section class="dc-profile__top"><h1>МОЯ<br><span style="background:#d8ff3e;color:#111">ДЕГРАДАЦИЯ.</span></h1><div class="dc-profile__user" data-user></div></section><div data-body></div></main><script src="/site-config.js"></script><script src="/global-header.js" defer></script><script>(async()=>{const cfg=window.DEMENTOR_SITE_CONFIG.supabase;const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm');const sb=mod.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});const userHost=document.querySelector('[data-user]'),body=document.querySelector('[data-body]');const spheres=[['personality','Личность'],['work','Работа'],['consumption','Потребление'],['relationships','Отношения'],['control','Контроль'],['information','Информация'],['self-development','Саморазвитие'],['meaning','Смысл'],['technology','Технологии']];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>{try{return new Intl.DateTimeFormat('ru-RU',{dateStyle:'medium'}).format(new Date(d))}catch(_){return d||'—'}};async function login(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${location.origin}/profile/`}})}async function render(){const {data}=await sb.auth.getSession();const s=data.session;if(!s){userHost.innerHTML='';body.innerHTML='<section class="dc-profile__login"><p>Ваш локальный профиль может существовать без аккаунта. Войдите через Google, чтобы увидеть синхронизированную карту, историю прохождений и заказы с любого устройства.</p><button type="button" data-login>ВОЙТИ ЧЕРЕЗ GOOGLE</button></section>';body.querySelector('[data-login]').onclick=login;return}const name=s.user.user_metadata?.full_name||s.user.user_metadata?.name||s.user.email||'Участник';userHost.innerHTML=`<strong>${esc(name)}</strong><p>${esc(s.user.email||'')}</p><div class="dc-profile__actions"><a class="button" href="/join/">ПРОЙТИ ДИАГНОСТИКУ</a><a class="button" href="/cart/">КОРЗИНА</a><button type="button" data-out>ВЫЙТИ</button></div>`;userHost.querySelector('[data-out]').onclick=async()=>{await sb.auth.signOut();render()};const [snap,runs,orders]=await Promise.all([sb.from('assessment_snapshots').select('state_json,updated_at').eq('profile_id',s.user.id).maybeSingle(),sb.from('assessment_runs').select('sphere_id,assessment_version,result_json,completed_at').eq('profile_id',s.user.id).order('completed_at',{ascending:false}).limit(100),sb.from('orders').select('reference,status,total_eur,created_at').eq('profile_id',s.user.id).order('created_at',{ascending:false}).limit(30)]);const state=snap.data?.state_json||{results:{}};body.innerHTML=`<section class="dc-map">${spheres.map(([id,label])=>{const r=state.results?.[id];return `<article class="dc-map__item"><span>${label}</span><strong>${r?`${r.level}/5`:'—'}</strong><small>${r?fmt(r.date):'не обследовано'}</small></article>`}).join('')}</section><section class="dc-section"><h2>ИСТОРИЯ</h2><div>${runs.data?.length?runs.data.map(r=>`<div class="dc-history__row"><strong>${esc(spheres.find(x=>x[0]===r.sphere_id)?.[1]||r.sphere_id)}</strong><span>${esc(r.assessment_version)}</span><span>${r.result_json?.level??'—'}/5</span><small>${fmt(r.completed_at)}</small></div>`).join(''):'<div class="dc-empty">ИСТОРИЯ ПОКА ПУСТА.</div>'}</div></section><section class="dc-section"><h2>ЗАКАЗЫ</h2><div>${orders.data?.length?orders.data.map(o=>`<div class="dc-order__row"><strong>${esc(o.reference)}</strong><span>${esc(o.status)}</span><span>€${Number(o.total_eur||0).toFixed(2)}</span><small>${fmt(o.created_at)}</small></div>`).join(''):'<div class="dc-empty">ЗАКАЗОВ ПОКА НЕТ.</div>'}</div></section>`}await render();sb.auth.onAuthStateChange(()=>render())})();</script></body></html>
