<body class="dc-system-page dcw-body dc-board-fullscreen-v21">
  <div class="dcw-app">
    <aside class="dcw-sidebar" data-workspace-sidebar></aside>
    <main class="dcw-main">
      <div class="dcw-view dcw-board-view dc-board-page">
        <section class="dc-board-wall" aria-label="Community Board">
          <div class="dc-board-shell">
            <nav class="dc-board-filters" id="boardFilters" aria-label="Фильтры доски"></nav>
            <div id="boardHost" class="dc-board-grid" aria-live="polite"><div class="dc-board-state">ЗАГРУЖАЕМ ДОСКУ…</div></div>
          </div>
        </section>
        <section class="dc-board-entry" id="entrySection"><div class="dc-board-shell"><div id="entryHost" aria-live="polite"><div class="dc-board-state">ПРОВЕРЯЕМ ДОСТУП К ПУБЛИКАЦИИ…</div></div></div></section>
        <div id="boardStatus" hidden>CHECKING ACCESS</div>
        <div id="memberBadge" hidden></div>
        <div id="artifactCount" hidden>—</div>
      </div>
    </main>
  </div>
