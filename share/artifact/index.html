  <style>
    :root{color-scheme:light;--paper:#f2f0e8;--ink:#111;--acid:#d8ff3e;--red:#a13b30;--line:#c9c3b8}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--ink);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.card{position:relative;width:min(720px,100%);min-height:410px;padding:44px 46px 38px;border:1px solid var(--ink);background:var(--paper);overflow:hidden}.card:before{content:"";position:absolute;left:72%;top:30px;bottom:30px;width:1px;background:var(--line)}.brand{position:relative;z-index:2;display:inline-flex;align-items:baseline;gap:4px;font:900 15px/1 Arial,Helvetica,sans-serif;letter-spacing:-.05em;text-transform:uppercase}.brand strong{display:inline-block;padding:2px 4px;background:var(--acid);font-weight:900}.meta{margin-top:22px;font:800 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#6f6b63;text-transform:uppercase}.title{max-width:8ch;margin:28px 0 18px;font-size:clamp(46px,8vw,76px);line-height:.82;letter-spacing:-.065em;text-transform:uppercase}.copy{max-width:30ch;margin:0;font-size:17px;line-height:1.4}.signal{display:inline-flex;align-items:center;min-height:52px;margin-top:30px;padding:0 18px;border:1px solid var(--ink);background:var(--acid);color:var(--ink);font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}.stamp{position:absolute;right:64px;top:62px;width:126px;aspect-ratio:1;border:4px double var(--red);border-radius:50%;display:grid;place-items:center;padding:16px;color:var(--red);font:900 11px/1.05 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase;transform:rotate(7deg)}.stamp:before{content:"DEMENTOR CLUB";position:absolute;inset:9px;border:1px dashed currentColor;border-radius:50%;display:grid;place-items:start center;padding-top:13px;font-size:7px}.status{margin-top:18px;font:800 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#6f6b63;text-transform:uppercase}.card[data-invalid="1"] .signal{display:inline-flex}.card:not([data-invalid="1"]) .signal{display:none}@media(max-width:600px){body{padding:12px}.card{min-height:430px;padding:34px 20px 28px}.card:before{left:70%}.stamp{width:92px;right:32px;top:72px;border-width:3px;font-size:9px}.title{max-width:7ch;font-size:clamp(42px,13vw,58px)}.copy{max-width:67%;font-size:15px}}
  </style>
</head>
<body>
  <main class="card" id="transportCard" aria-live="polite">
    <div class="stamp">ПЕРЕДАНО</div>
    <div class="brand" aria-label="Dementor Club"><span>DEMENTOR</span><strong>CLUB</strong></div>
    <div class="meta">INCOMING / ARTIFACT</div>
    <h1 class="title">ВАМ ПЕРЕДАЛИ АРТЕФАКТ</h1>
    <p class="copy" id="copy">Открываем внутри DEMENTOR CLUB.</p>
    <a class="signal" id="fallbackLink" href="/">DEMENTOR CLUB →</a>
    <div class="status" id="status">ПРОВЕРЯЕМ АДРЕС…</div>
  </main>
  <noscript><p style="position:fixed;left:12px;right:12px;bottom:12px;margin:0;padding:12px;background:#f2f0e8;color:#111;font:700 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center">Для доставки нужен JavaScript. <a href="/" style="color:#111">Открыть DEMENTOR CLUB →</a></p></noscript>
<script>
(()=>{
  const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  const id=new URL(location.href).searchParams.get('id')||'';
  const card=document.getElementById('transportCard');
  const copy=document.getElementById('copy');
  const status=document.getElementById('status');
  if(!UUID.test(id)){
    card.dataset.invalid='1';
    card.querySelector('.stamp').textContent='НЕ СОБРАЛОСЬ';
    copy.textContent='Похоже, адрес передачи повреждён.';
    status.textContent='ССЫЛКА НЕ СОБРАЛАСЬ.';
    return;
  }
  const target=new URL('/workspace/board/',location.origin);
  target.searchParams.set('focus',`artifact:${id.toLowerCase()}`);
  target.searchParams.set('from','share');
  status.textContent='АДРЕС СОБРАН · ПЕРЕДАЁМ В BOARD';
  location.replace(target.href);
})();
</script>
</body>
