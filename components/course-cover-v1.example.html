<!--
Dementor Club / COURSE COVER v1
Reusable markup. Route supplies:
- --dc-course-cover-bg (usually a Dementor identity token)
- media src / alt
- title lines
- lead / copy / CTA
- mentor portrait + link
-->
<section id="course-app" class="dc-course-cover" style="--dc-course-cover-bg:var(--dc-dementor-valentin-bg)">
  <figure class="dc-course-cover__media">
    <img src="/assets/people/dementors/valentin/dementor_valentin.webp" alt="Иллюстрация курса">
  </figure>

  <div class="dc-course-cover__panel-wrap">
    <div class="dc-course-cover__panel">
      <p class="dc-course-cover__eyebrow">ONLINE COURSE / APPROVED DRAFT</p>

      <h1 class="dc-course-cover__title">
        <span class="dc-course-cover__title-line">ДУМАЙ С</span>
        <span class="dc-course-cover__title-line">ОПАСНОСТЬЮ</span>
      </h1>

      <p class="dc-course-cover__lead">Курс последовательной деградации уверенности.</p>
      <p class="dc-course-cover__copy">Описание курса.</p>

      <div class="dc-course-cover__actions">
        <a class="dc-course-cover__button" href="#course-app">Открыть курс</a>
      </div>

      <a class="dc-course-cover__mentor" href="/community/valentin/">
        <span class="dc-course-cover__mentor-photo">
          <img src="/assets/people/dementors/valentin/dementor_valentin.webp" alt="Валентин Лосев">
        </span>
        <span class="dc-course-cover__mentor-copy">
          <strong>Валентин Лосев</strong>
          <span>дементор</span>
        </span>
      </a>
    </div>
  </div>
</section>
