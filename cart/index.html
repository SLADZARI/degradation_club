<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f0e8"><title>Cart — Dementor Club</title><meta name="description" content="Корзина Dementor Club: local-first, синхронизация после входа через Google."><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/global-header.css"><style>body{background:#f2f0e8;color:#111}.dc-cart{max-width:1080px;margin:0 auto;padding:64px 24px 110px}.dc-cart h1{font-size:clamp(54px,9vw,118px);line-height:.85;letter-spacing:-.075em;margin:0 0 36px}.dc-cart__meta{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #111;border-bottom:1px solid #111;padding:13px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.dc-cart__items{margin-top:34px}.dc-cart__item{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:22px 0;border-bottom:1px solid rgba(17,17,17,.25)}.dc-cart__item h2{font-size:24px;margin:0 0 6px}.dc-cart__item p{margin:0;opacity:.6;font-size:13px}.dc-cart__qty{width:70px;padding:10px;background:transparent;border:1px solid #111}.dc-cart button,.dc-cart .button{appearance:none;border:1px solid #111;background:transparent;color:#111;padding:11px 14px;font:800 11px/1 Inter,Arial,sans-serif;letter-spacing:.06em;text-decoration:none;cursor:pointer}.dc-cart button:hover,.dc-cart .button:hover{background:#d8ff3e}.dc-cart__summary{margin-top:40px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}.dc-cart__total{font-size:clamp(38px,7vw,72px);font-weight:900;letter-spacing:-.05em}.dc-cart__actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.dc-cart__empty{padding:60px 0;font-size:24px}.dc-cart__note{margin-top:22px;max-width:680px;opacity:.62;line-height:1.5}.dc-cart__status{margin-top:16px;font-size:12px;letter-spacing:.04em}.dc-cart__account{margin:24px 0;padding:16px;border:1px solid #111;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}@media(max-width:720px){.dc-cart__item{grid-template-columns:1fr}.dc-cart__summary{grid-template-columns:1fr}.dc-cart__actions{justify-content:flex-start}}</style></head><body><header class="topbar"></header><main class="dc-cart"><div class="dc-cart__meta"><span>DEMENTOR OBJECTS / CART</span><span>LOCAL-FIRST / ACCOUNT SYNC</span></div><h1>КОРЗИНА<br><span style="background:#d8ff3e">БЕЗ ОБЯЗАТЕЛЬСТВ.</span></h1><div class="dc-cart__account" data-account></div><div class="dc-cart__items" data-items></div><section class="dc-cart__summary"><div><div class="dc-cart__total" data-total>€0</div><p class="dc-cart__note">Корзина хранится на этом устройстве. После входа через Google она синхронизируется с профилем. Оплата по-прежнему не автоматизирована: текущий preorder подтверждается вручную через BLIK.</p><div class="dc-cart__status" data-status></div></div><div class="dc-cart__actions"><a class="button" href="/merch/">ПРОДОЛЖИТЬ ВЫБОР</a><button type="button" data-clear>ОЧИСТИТЬ</button><button type="button" data-order>ПОДГОТОВИТЬ PREORDER</button></div></section></main><script src="/site-config.js"></script><script src="/global-header.js" defer></script><script src="/dementor-cart-v1.js"></script><script>(async()=>{const items=document.querySelector('[data-items]'),total=document.querySelector('[data-total]'),status=document.querySelector('[data-status]'),account=document.querySelector('[data-account]');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const s=window.DEMENTOR_CART.get();if(!s.items.length)items.innerHTML='<div class="dc-cart__empty">ПОКА НИЧЕГО НЕ ВЫБРАНО.</div>';else items.innerHTML=s.items.map((x,i)=>`<article class="dc-cart__item"><div><h2>${esc(x.title)}</h2><p>${esc([x.sku,x.variantLabel,x.size].filter(Boolean).join(' / '))}</p><p>€${Number(x.unitPriceEur||0).toFixed(2)}</p></div><input class="dc-cart__qty" type="number" min="1" max="99" value="${x.quantity||1}" data-q="${i}"><button type="button" data-r="${i}">УБРАТЬ</button></article>`).join('');total.textContent=`€${window.DEMENTOR_CART.total().toFixed(2)}`;items.querySelectorAll('[data-q]').forEach(el=>el.onchange=()=>window.DEMENTOR_CART.setQuantity(Number(el.dataset.q),el.value));items.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>window.DEMENTOR_CART.remove(Number(el.dataset.r)))}document.addEventListener('dc:cart-change',render);document.querySelector('[data-clear]').onclick=()=>window.DEMENTOR_CART.clear();render();const cfg=window.DEMENTOR_SITE_CONFIG.supabase;const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm');const sb=mod.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});async function session(){return (await sb.auth.getSession()).data.session}async function drawAccount(){const s=await session();if(!s){account.innerHTML='<span>ВОЙДИТЕ, ЧТОБЫ СОХРАНИТЬ КОРЗИНУ И ПОДГОТОВИТЬ ЗАКАЗ.</span><button type="button" data-login>GOOGLE LOGIN</button>';account.querySelector('[data-login]').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${location.origin}/cart/`}})}else account.innerHTML=`<span>${esc(s.user.user_metadata?.full_name||s.user.email||'PROFILE')}</span><a class="button" href="/profile/">ПРОФИЛЬ</a>`}await drawAccount();document.querySelector('[data-order]').onclick=async()=>{const s=await session();if(!s){status.textContent='СНАЧАЛА ВОЙДИТЕ ЧЕРЕЗ GOOGLE.';return}const cart=window.DEMENTOR_CART.get();if(!cart.items.length){status.textContent='КОРЗИНА ПУСТА.';return}const ref=`DC-${Date.now().toString(36).toUpperCase()}`;const totalValue=window.DEMENTOR_CART.total();const o=await sb.from('orders').insert({profile_id:s.user.id,reference:ref,status:'draft',currency:'EUR',total_eur:totalValue,payment_method:'BLIK'}).select('id,reference').single();if(o.error){status.textContent='НЕ УДАЛОСЬ СОЗДАТЬ ЗАКАЗ.';return}const rows=cart.items.map(x=>({order_id:o.data.id,product_id:x.productId||x.sku,sku:x.sku,title:x.title,variant_id:x.variantId||null,variant_label:x.variantLabel||null,size:x.size||null,unit_price_eur:Number(x.unitPriceEur)||0,quantity:x.quantity||1,metadata:x.metadata||{}}));const ins=await sb.from('order_items').insert(rows);if(ins.error){status.textContent='ЗАКАЗ СОЗДАН ЧАСТИЧНО. НУЖНА ПРОВЕРКА.';return}status.textContent=`DRAFT ${o.data.reference} СОЗДАН. ОПЛАТА ПОКА ОСТАЁТСЯ РУЧНОЙ.`};})();</script></body></html>
