<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auth Test — Dementor Club</title>
<style>
:root{--acid:#d8ff3e;--ink:#111;--paper:#f2f0e8;--muted:#777;--bad:#ff6565;--warn:#ffd85c}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.wrap{max-width:980px;margin:0 auto;padding:32px 18px 80px}h1{font:900 clamp(44px,8vw,90px)/.88 Arial,sans-serif;letter-spacing:-.06em;margin:0 0 24px}.tag{display:inline-block;background:var(--acid);color:#111;padding:4px 8px;font-weight:900}.note{max-width:760px;opacity:.7}.state{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}.cell{border:1px solid #333;padding:12px;min-height:72px}.cell b{display:block;color:var(--acid);margin-bottom:7px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}button,a.btn{appearance:none;border:1px solid #666;background:#111;color:#fff;padding:10px 12px;font:800 12px ui-monospace,monospace;cursor:pointer;text-decoration:none}button:hover,a.btn:hover{border-color:var(--acid);color:var(--acid)}.log{border-top:1px solid #333;margin-top:20px}.row{display:grid;grid-template-columns:92px 180px 66px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed #2b2b2b}.ok{color:var(--acid)}.error{color:var(--bad)}.warn{color:var(--warn)}.detail{white-space:pre-wrap;word-break:break-word;color:#bbb}.banner{padding:12px;border:1px solid #333;margin:18px 0}.banner.good{border-color:var(--acid)}.banner.bad{border-color:var(--bad)}@media(max-width:720px){.state{grid-template-columns:1fr 1fr}.row{grid-template-columns:68px 118px 52px 1fr;font-size:10px}}
</style>
</head>
<body>
<main class="wrap">
  <span class="tag">ISOLATED AUTH TEST v1</span>
  <h1>GOOGLE → SUPABASE<br>БЕЗ /JOIN/.</h1>
  <p class="note">Эта страница не загружает runtime клуба, header, cart или onboarding. Она проверяет только OAuth и Supabase session. Значения access/refresh token никогда не выводятся в интерфейс или trace.</p>
  <div id="banner" class="banner">ИНИЦИАЛИЗАЦИЯ…</div>
  <section class="state" id="state"></section>
  <div class="actions">
    <button id="start">START GOOGLE TEST</button>
    <button id="session">GET SESSION</button>
    <button id="user">GET USER</button>
    <button id="profile">TEST PROFILE READ</button>
    <button id="copy">COPY TRACE</button>
    <button id="clear">CLEAR TRACE</button>
    <button id="logout">SIGN OUT</button>
    <a class="btn" href="../join/">BACK TO JOIN</a>
  </div>
  <section class="log" id="log"></section>
</main>
<script type="module">
const SUPABASE_URL='https://mmekfydwbvptbdatwitj.supabase.co';
const SUPABASE_KEY='sb_publishable_a7e_Ndwwii8lyt_xmezoVw_ijxfh_yg';
const TRACE_KEY='dcAuthStandaloneTraceV1';
const MAX=120;

const rawHash=location.hash||'';
const hp=new URLSearchParams(rawHash.replace(/^#/,''));
const captured={
  hashPresent:!!rawHash,
  hashKeys:[...hp.keys()],
  hasAccessToken:hp.has('access_token'),
  hasRefreshToken:hp.has('refresh_token'),
  hasError:hp.has('error')||hp.has('error_description'),
  error:hp.get('error_description')||hp.get('error')||null
};
const accessToken=hp.get('access_token');
const refreshToken=hp.get('refresh_token');
if(rawHash) history.replaceState({},'',location.pathname+location.search);

const stateEl=document.getElementById('state');
const logEl=document.getElementById('log');
const banner=document.getElementById('banner');
let sb=null,session=null;
const read=()=>{try{return JSON.parse(localStorage.getItem(TRACE_KEY)||'[]')}catch{return[]}};
const write=a=>{try{localStorage.setItem(TRACE_KEY,JSON.stringify(a.slice(-MAX)))}catch{}};
const sanitize=o=>{if(o==null)return o;if(typeof o==='string')return o.slice(0,300);if(typeof o!=='object')return o;const out={};for(const [k,v] of Object.entries(o)){if(/token|secret|authorization|code/i.test(k)){out[k]=v?'[present]':'[absent]';continue}if(k==='email'&&typeof v==='string'){const [a,b='']=v.split('@');out[k]=`${a.slice(0,2)}***@${b}`;continue}out[k]=typeof v==='object'?sanitize(v):v}return out};
function trace(stage,status='info',data=null){const item={t:new Date().toISOString(),stage,status,data:sanitize(data)};write([...read(),item]);console.log('[AUTH TEST]',stage,status,item.data||'');render();return item}
function render(){stateEl.innerHTML=`<div class="cell"><b>CALLBACK HASH</b>${captured.hashPresent?'YES':'NO'}<br><small>${captured.hashKeys.join(', ')||'—'}</small></div><div class="cell"><b>ACCESS + REFRESH</b>${captured.hasAccessToken&&captured.hasRefreshToken?'YES':'NO'}</div><div class="cell"><b>CLIENT</b>${sb?'YES':'NO'}</div><div class="cell"><b>SESSION</b>${session?'YES':'NO'}</div>`;logEl.innerHTML=read().slice().reverse().map(x=>`<div class="row"><span>${x.t.slice(11,19)}</span><span>${esc(x.stage)}</span><span class="${esc(x.status)}">${esc(x.status)}</span><span class="detail">${esc(x.data?JSON.stringify(x.data):'')}</span></div>`).join('');if(session){banner.className='banner good';banner.textContent='SESSION ESTABLISHED — AUTH CHAIN WORKS.'}else if(captured.hasError){banner.className='banner bad';banner.textContent='OAUTH CALLBACK ERROR: '+captured.error}else{banner.className='banner';banner.textContent='NO SESSION YET.'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

trace('page_load','info',{origin:location.origin,pathname:location.pathname,searchKeys:[...new URLSearchParams(location.search).keys()],...captured});
window.addEventListener('error',e=>trace('window_error','error',{message:e.message,source:e.filename?.split('/').pop()||null,line:e.lineno||null}));
window.addEventListener('unhandledrejection',e=>trace('unhandled_rejection','error',{message:e.reason?.message||String(e.reason||'unknown')}));

try{
  trace('module_import_start');
  const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm');
  trace('module_import','ok',{createClient:typeof mod.createClient==='function'});
  sb=mod.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:false,autoRefreshToken:true,flowType:'implicit'}});
  trace('client_created','ok',{flowType:'implicit',detectSessionInUrl:false});
  if(captured.hasError) throw new Error(captured.error);
  if(accessToken&&refreshToken){
    trace('set_session_start');
    const {data,error}=await sb.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
    if(error)throw error;
    session=data.session||null;
    trace('set_session_result',session?'ok':'error',{session:!!session,user:!!session?.user,expiresAt:session?.expires_at||null});
  }else{
    trace('callback_without_tokens','warn',{hashPresent:captured.hashPresent,hashKeys:captured.hashKeys});
    const {data,error}=await sb.auth.getSession();if(error)throw error;session=data.session||null;trace('initial_get_session','ok',{session:!!session,user:!!session?.user});
  }
  if(session){const {data,error}=await sb.auth.getUser();if(error)throw error;trace('get_user_after_boot','ok',{user:!!data.user,email:data.user?.email||null})}
}catch(e){trace('boot_error','error',{message:e.message,code:e.code||null})}
render();

async function start(){try{const redirectTo=new URL(location.pathname,location.origin).href;trace('oauth_start','info',{redirectTo});const {data,error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo,skipBrowserRedirect:false}});if(error)throw error;trace('oauth_result','ok',{provider:!!data?.provider,urlReturned:!!data?.url})}catch(e){trace('oauth_error','error',{message:e.message,code:e.code||null})}}
async function getSession(){try{const {data,error}=await sb.auth.getSession();if(error)throw error;session=data.session||null;trace('manual_get_session','ok',{session:!!session,user:!!session?.user,expiresAt:session?.expires_at||null});render()}catch(e){trace('manual_get_session','error',{message:e.message})}}
async function getUser(){try{const {data,error}=await sb.auth.getUser();if(error)throw error;trace('manual_get_user','ok',{user:!!data.user,email:data.user?.email||null})}catch(e){trace('manual_get_user','error',{message:e.message,code:e.code||null})}}
async function profileRead(){try{if(!session)await getSession();if(!session)throw new Error('authenticated session required');const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error)throw error;trace('profile_read','ok',{found:!!data,keys:data?Object.keys(data):[]})}catch(e){trace('profile_read','error',{message:e.message,code:e.code||null})}}
async function logout(){try{await sb.auth.signOut();session=null;trace('sign_out','ok');render()}catch(e){trace('sign_out','error',{message:e.message})}}

document.getElementById('start').onclick=start;
document.getElementById('session').onclick=getSession;
document.getElementById('user').onclick=getUser;
document.getElementById('profile').onclick=profileRead;
document.getElementById('logout').onclick=logout;
document.getElementById('clear').onclick=()=>{write([]);trace('trace_cleared','info')};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(read(),null,2));trace('trace_copied','ok',{count:read().length})}catch(e){trace('trace_copy','error',{message:e.message})}};
</script>
</body>
</html>
