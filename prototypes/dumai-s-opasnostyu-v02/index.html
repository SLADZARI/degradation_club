<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ДУМАЙ С ОПАСНОСТЬЮ — прототип v0.2</title>
<style>
:root{--paper:#f1eadc;--ink:#121212;--red:#b42a22;--grey:#d5ccbb;--muted:#716b60;--max:920px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.35}.wrap{width:min(calc(100% - 28px),var(--max));margin:auto}.top{position:sticky;top:0;z-index:30;background:rgba(241,234,220,.95);backdrop-filter:blur(8px);border-bottom:2px solid var(--ink)}.top .wrap{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}.meta{display:flex;align-items:center;gap:8px}.badge{font:700 11px/1 Arial;border:1px solid var(--ink);padding:7px 9px;text-transform:uppercase}.utility{border:0;background:none;font:700 11px/1 Arial;text-transform:uppercase;text-decoration:underline;cursor:pointer}.progress{height:5px;background:var(--grey)}.progress i{display:block;height:100%;background:var(--red);width:0}.screen{min-height:calc(100vh - 63px);padding:48px 0 88px}.eyebrow{font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.12em;color:var(--red);margin-bottom:10px}h1,h2,h3{margin:0;text-transform:uppercase;line-height:.92}h1{font-size:clamp(56px,11vw,118px);letter-spacing:-.07em}h2{font-size:clamp(42px,7vw,76px);letter-spacing:-.055em}h3{font-size:30px}.lead{font-size:clamp(20px,3vw,30px);max-width:760px;margin:28px 0}.copy{font-size:18px;max-width:720px}.small{font-size:13px;color:var(--muted)}.fine{font-size:12px;color:var(--muted)}.btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:900 14px/1 Arial;padding:16px 18px;text-transform:uppercase;cursor:pointer}.btn.alt{background:transparent;color:var(--ink)}.btn.red{background:var(--red);border-color:var(--red)}.btn.ghost{background:transparent;color:var(--ink);border-color:transparent;text-decoration:underline}.btn:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.card{border:2px solid var(--ink);padding:22px;margin:22px 0;background:rgba(255,255,255,.13)}.focus-card{border-top:7px solid var(--ink);padding:20px 0;margin:28px 0}.valentin-screen{background:var(--ink);color:var(--paper);min-height:calc(100vh - 63px);display:flex;align-items:center}.valentin-screen .eyebrow{color:#ff6d55}.valentin-screen h2{max-width:780px}.valentin-screen .quote{font-size:clamp(24px,4vw,40px);max-width:800px;margin:34px 0}.valentin{border-left:10px solid var(--red);padding:18px 20px;margin:28px 0;background:var(--ink);color:var(--paper);font-size:21px}.valentin b{display:block;color:#ff6d55;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.choice{border:2px solid var(--ink);padding:18px;min-height:120px;cursor:pointer;font-weight:900;text-transform:uppercase;background:transparent;text-align:left}.choice small{display:block;font-weight:400;text-transform:none;margin-top:10px;line-height:1.35}.choice.selected{background:var(--ink);color:var(--paper)}label{display:block;font-weight:800;margin:20px 0 8px;text-transform:uppercase;font-size:12px;letter-spacing:.06em}input[type=text],input[type=email],textarea{width:100%;border:2px solid var(--ink);background:rgba(255,255,255,.18);color:var(--ink);padding:14px;font:18px/1.4 Arial;border-radius:0}textarea{min-height:130px;resize:vertical}.range-wrap{margin:32px 0}.range-value{font-size:72px;font-weight:900;letter-spacing:-.06em}input[type=range]{width:100%;accent-color:var(--red)}.list{display:grid;gap:8px}.item-row{display:grid;grid-template-columns:1fr auto;gap:8px}.item{border:2px solid var(--ink);padding:12px;background:rgba(255,255,255,.12)}.item-row button{border:2px solid var(--ink);background:transparent;font-weight:900;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--ink);padding:8px 10px;font-size:12px;font-weight:800;text-transform:uppercase;cursor:pointer;background:transparent}.chip.on{background:var(--ink);color:var(--paper)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{border-top:5px solid var(--ink);padding:12px 0}.stat b{display:block;font-size:34px}.stamp{display:inline-block;border:4px solid var(--red);color:var(--red);font-weight:1000;padding:8px 12px;transform:rotate(-2deg);text-transform:uppercase;margin:18px 0}.note{padding:12px;border:1px dashed var(--ink);font-size:13px}.error{color:var(--red);font-weight:900;font-size:13px;margin-top:10px}.success{border-left:8px solid var(--ink);padding:14px 16px;margin:20px 0;background:rgba(255,255,255,.15)}.case{font-size:22px;border:3px solid var(--ink);padding:24px}.danger-map{border:4px solid var(--ink);padding:24px}.danger-map header{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:4px solid var(--ink);padding-bottom:18px}.danger-map section{border-top:2px solid var(--ink);padding-top:14px;margin-top:18px}.danger-map .section-title{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.cert{border:8px double var(--ink);padding:34px;text-align:center;margin:26px 0}.cert h2{font-size:46px}.email-preview{border:2px solid var(--ink);padding:18px;background:#fffdf4}.email-preview .subject{font-weight:900;border-bottom:1px solid var(--grey);padding-bottom:10px;margin-bottom:14px}.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:35px}.modal{position:fixed;inset:0;background:rgba(18,18,18,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-box{background:var(--paper);border:3px solid var(--ink);padding:24px;width:min(560px,100%)}.divider{border-top:2px solid var(--ink);margin:28px 0}.kpi{font-size:clamp(48px,9vw,88px);font-weight:900;letter-spacing:-.06em}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.hidden{display:none!important}
@media(max-width:680px){.screen{padding-top:30px}.grid,.stats{grid-template-columns:1fr}.top .badge{display:none}.lead{font-size:20px}.btn{width:100%}.actions,.footer-nav{display:grid}.item-row{grid-template-columns:1fr 44px}.cert{padding:18px}.cert h2{font-size:30px}.danger-map header{display:block}.meta{gap:2px}.utility{font-size:10px}.choice{min-height:0}}
@media print{.top,.actions,.footer-nav,.utility{display:none!important}.screen{min-height:auto;padding:0}.danger-map,.cert{break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand" id="brand">Dementor Club</div><div class="meta"><button class="utility" id="resetUtility">Сбросить прототип</button><span id="topStep" class="badge">Prototype v0.2</span></div></div><div class="progress"><i id="bar"></i></div></header>
<main id="app"></main>
<div class="modal" id="modal"><div class="modal-box"><div class="eyebrow">Служебное действие</div><h3>Удалить тестовое дело?</h3><p>Все ответы этой локальной prototype-сессии будут удалены.</p><div class="actions"><button class="btn red" id="confirmReset">Удалить</button><button class="btn alt" id="cancelReset">Отмена</button></div></div></div>
<script>
const KEY='dementor_dumai_proto_v02';
const genericWords=['бизнес','работа','семья','отношения','переезд','деньги','проект','жизнь'];
const vagueWords=['плохо','не знаю','что-то случится','что то случится','нормально','как-нибудь','как нибудь'];
const domains={home:'Бытовой',business:'Работа / бизнес',people:'Отношения с людьми'};
const domainDescriptions={home:'переезд, покупка, изменение образа жизни',business:'проект, найм, инвестиция, партнёрство, новый рынок',people:'договорённость, сотрудничество, отношения, совместное решение'};
const examples={home:['Переехать в другой город этой осенью','Купить квартиру вместо аренды'],business:['Открыть второй офис до января','Взять нового партнёра в проект'],people:['Согласиться на совместный переезд','Продолжить сотрудничество с человеком, которому перестал доверять']};
const screenOrder=['landing','email','rule','domain','decision','decisionConfirm','confidence','valentinOpen','caseCreated','d1intro','d1expect','d1assume','d1classify','d1control','d1conf','d1summary','d2intro','d2agreement','d2dissect','d2cost','d2reflect','d2conf','d2summary','d3intro','d3failures','d3uncomfortable','d3conf','d3summary','d4intro','d4signals','d4rationalize','d4trigger','d4conf','d4summary','d5intro','d5states','d5irreversible','d5sunk','d5redline','d5conf','d5summary','d6intro','d6pros','d6counter','d6falsify','d6conf','d6summary','d7intro','d7error','d7inaction','d7planb','d7conf','d7decision','verdict','examIntro','examQuestions','examResult','completed','dangerMap','certificate','emailFinish'];
function fresh(){return{version:'0.2',screen:'landing',status:'new',sessionId:'',courseId:'COURSE-001',email:'',domain:'',decision:'',decisionDraft:'',initialConfidence:70,currentConfidence:70,confidenceHistory:[],expectedOutcome:'',assumptions:[],assumptionTypes:{},control1:'',agreementWho:'',agreementSaid:'',agreementInference:'',agreementKnown:'',agreementCheck:'',trustCost:[],trustReflection:'',failureModes:[],uncomfortableFailure:'',uncomfortableWhy:'',signals:[],rationalizedSignal:'',rationalization:'',recheckTrigger:'',greenState:'',yellowState:'',redLine:'',irreversible:[],sunkChoice:'',proArguments:'',counterArguments:'',falsificationFact:'',errorCost:'',inactionCost:'',planB:'',finalConfidence:null,finalDecision:'',examQuestions:[],examCoverage:[],examPassed:false,events:[],startedAt:null,updatedAt:null,completedAt:null,currentDay:0}}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return Object.assign(fresh(),{screen:'recovery',status:'corrupt'})}}
let state=load();
const app=document.getElementById('app');
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function save(){state.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state))}
function track(name,meta={}){state.events.push({name,meta,at:new Date().toISOString()});save()}
function caseId(){if(!state.sessionId){const y=new Date().getFullYear();state.sessionId=`DC-${y}-${String(Math.floor(1000+Math.random()*9000))}`;save()}return state.sessionId}
function go(screen){state.screen=screen;save();render();scrollTo(0,0)}
function set(k,v){state[k]=v;save()}
function shell(inner,cls=''){app.innerHTML=`<section class="screen ${cls}"><div class="wrap">${inner}</div></section>`}
function valentinShell(inner){app.innerHTML=`<section class="valentin-screen"><div class="wrap">${inner}</div></section>`}
function btn(label,screen,kind=''){return `<button class="btn ${kind}" data-go="${screen}">${label}</button>`}
function back(screen){return `<button class="btn alt" data-go="${screen}">Назад</button>`}
function fieldError(id,msg=''){return `<div id="${id}" class="error" role="status" aria-live="polite">${msg}</div>`}
function listEditor(key,placeholder,min){const arr=state[key]||[];return `<div class="list">${arr.map((x,i)=>`<div class="item-row"><div class="item">${esc(x)}</div><button data-del="${i}" data-key="${key}" aria-label="Удалить">×</button></div>`).join('')}</div><label for="${key}Input">Добавить</label><div class="item-row"><input id="${key}Input" type="text" placeholder="${esc(placeholder)}"><button data-add="${key}" aria-label="Добавить">+</button></div><div class="small">Нужно минимум: ${min}. Сейчас: ${arr.length}</div>`}
function textQuality(v,min=8){const n=norm(v);if(!n)return{type:'invalid',msg:'ОТВЕТА ПОКА НЕТ.'};if(vagueWords.includes(n))return{type:'weak',msg:'ОТВЕТ СЛИШКОМ УДОБНЫЙ. НУЖНО КОНКРЕТНЕЕ.'};if(n.length<min)return{type:'weak',msg:'ПОКА ЭТО ПОХОЖЕ НА СПОСОБ НЕ ОТВЕЧАТЬ. ДОБАВЬТЕ КОНКРЕТИКУ.'};return{type:'valid',msg:''}}
function decisionQuality(v){const n=norm(v);if(!n)return{type:'invalid',msg:'РЕШЕНИЕ ПОКА НЕ ЗАПИСАНО.'};if(genericWords.includes(n)||n.split(' ').length<2||n.length<8)return{type:'weak',msg:'ПОКА ЭТО ТЕМА, А НЕ РЕШЕНИЕ. ЧТО ИМЕННО ВЫ СОБИРАЕТЕСЬ СДЕЛАТЬ?'};return{type:'valid',msg:''}}
function emailValid(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim())}
function confInterpret(before,after,context){const d=after-before;let line='Уверенность почти не изменилась.';if(d<=-10)line='Уверенность заметно снизилась.';else if(d<0)line='Уверенность стала немного ниже.';else if(d>=10)line='После проверки уверенность заметно выросла.';else if(d>0)line='После проверки уверенность немного выросла.';return `${line} ${context}`}
function setConfidence(stage,next){const el=document.getElementById('confidence');if(!el)return;const v=+el.value;const prev=state.currentConfidence;if(stage==='onboarding'){state.initialConfidence=v;state.currentConfidence=v;state.confidenceHistory=[{stage,value:v}]}else{state.currentConfidence=v;state.confidenceHistory.push({stage,value:v,from:prev})}save();go(next)}
function confidenceUI(stage,next,backScreen){return `<div class="range-wrap"><div class="range-value"><span id="cv">${state.currentConfidence}</span>%</div><input id="confidence" type="range" min="0" max="100" value="${state.currentConfidence}" aria-label="Уверенность"><div class="small">0 — идея уже умерла · 50 — посмотрим · 100 — невозможно представить проблемы</div></div><div class="footer-nav">${backScreen?back(backScreen):'<span></span>'}<button class="btn" id="confSave" data-stage="${stage}" data-next="${next}">Зафиксировать</button></div>`}
function renderHeader(){const idx=Math.max(0,screenOrder.indexOf(state.screen));document.getElementById('bar').style.width=(idx/(screenOrder.length-1))*100+'%';document.getElementById('topStep').textContent=state.status==='new'?'Prototype v0.2':state.currentDay?`ДЕЛО / ДЕНЬ ${state.currentDay}`:'ДЕЛО / ВХОД'}
function render(){renderHeader();const fn=screens[state.screen]||screens.landing;fn();bind();}
const screens={
landing(){const returning=state.status==='active'&&state.decision?`<div class="card"><div class="eyebrow">Незаконченное дело</div><h3>${esc(state.decision)}</h3><p class="small">${esc(domains[state.domain])} · ${esc(state.sessionId)}</p><div class="actions"><button class="btn" id="resume">Продолжить</button><button class="btn alt" id="newCase">Начать новое</button></div></div>`:'';shell(`<div class="eyebrow">ONLINE COURSE / DEMENTOR CLUB</div><h1>ДУМАЙ<br><span style="color:var(--red)">С ОПАСНОСТЬЮ</span></h1><p class="lead">Курс последовательной деградации уверенности.</p><p class="copy"><b>Дементор: Валентин Лосев.</b></p><div class="card"><b>После курса вы сможете посмотреть на абсолютно нормальную ситуацию и обнаружить в ней минимум семь причин пока ничего не делать.</b></div><p class="copy">Вы будете работать с одним настоящим решением. Курс не обещает правильный ответ: финалом может быть делать, изменить условия или не делать.</p>${returning}<div class="actions"><button class="btn red" id="startBtn">Начать сомневаться</button><button class="btn alt" id="thinkBtn">Пока не поздно передумать</button></div><div id="already" class="small"></div>`);},
email(){shell(`<div class="eyebrow">ДЕЛО / ВХОД</div><h2>Куда присылать следующие сомнения?</h2><p class="lead">В production здесь будет ваш минимальный идентификатор и способ продолжить курс.</p><label for="email">E-mail</label><input id="email" type="email" value="${esc(state.email)}" placeholder="you@example.com"><p class="note"><b>Prototype v0.2:</b> адрес сохраняется только локально в этом браузере и никуда не отправляется.</p>${fieldError('emailErr')}<div class="footer-nav">${back('landing')}<button class="btn" id="emailNext">Продолжить</button></div>`);},
rule(){shell(`<div class="eyebrow">ДЕЛО / ПРАВИЛО</div><h2>Нужно настоящее решение</h2><p class="lead">Такое, последствия которого вам действительно небезразличны.</p><p class="copy">Не нужно придумывать проблему ради курса. Если настоящего решения нет, лучше просто посмотреть страницу и вернуться позже.</p><div class="actions"><button class="btn" id="ruleYes">У меня есть такое</button><button class="btn alt" id="ruleNo">Нет. Я просто посмотреть</button></div>`);},
domain(){shell(`<div class="eyebrow">ДЕЛО / КОНТЕКСТ</div><h2>Где происходит ваша проблема?</h2><div class="grid">${Object.entries(domains).map(([k,v])=>`<button class="choice ${state.domain===k?'selected':''}" data-domain="${k}">${v}<small>${domainDescriptions[k]}</small></button>`).join('')}</div>${fieldError('domainErr')}<div class="footer-nav">${back('rule')}<button class="btn" id="domainNext" ${state.domain?'':'disabled'}>Продолжить</button></div>`);},
decision(){const ph=state.domain?examples[state.domain][0]:'Сначала выберите контекст';shell(`<div class="eyebrow">ДЕЛО / РЕШЕНИЕ</div><h2>Что вы собираетесь сделать?</h2><p class="lead">Нужна формулировка действия, а не название темы.</p><label for="decision">Я собираюсь...</label><input id="decision" type="text" value="${esc(state.decisionDraft||state.decision)}" placeholder="${esc(ph)}">${fieldError('decisionErr')}<div class="footer-nav">${back('domain')}<button class="btn" id="decisionNext">Продолжить</button></div>`);},
decisionFollowup(){shell(`<div class="eyebrow">ДЕЛО / УТОЧНЕНИЕ</div><h2>Что именно и когда?</h2><p class="lead">Чем конкретнее решение сейчас, тем неприятнее будет дальше.</p><div class="card"><b>Черновик:</b><br>${esc(state.decisionDraft)}</div><label for="decisionRefined">Сформулируйте решение целиком</label><input id="decisionRefined" type="text" value="${esc(state.decision)}" placeholder="${esc(examples[state.domain]?.[0]||'Конкретное действие')}">${fieldError('decisionRefinedErr')}<div class="footer-nav">${back('decision')}<button class="btn" id="decisionRefinedNext">Зафиксировать</button></div>`);},
decisionConfirm(){shell(`<div class="eyebrow">ДЕЛО / ПРОВЕРКА ФОРМУЛИРОВКИ</div><h2>Итак</h2><div class="focus-card"><div class="kpi" style="font-size:clamp(32px,6vw,64px)">${esc(state.decision)}</div></div><p class="lead">Именно это решение будем портить следующие семь блоков.</p><div class="actions"><button class="btn" id="decisionConfirmBtn">Да. Это оно.</button><button class="btn alt" data-go="decision">Исправить формулировку</button></div>`);},
confidence(){shell(`<div class="eyebrow">ПЕРВИЧНОЕ ПОКАЗАНИЕ</div><h2>Насколько это хорошая идея?</h2><div class="card"><b>${esc(state.decision)}</b><br><span class="small">${esc(domains[state.domain])}</span></div>${confidenceUI('onboarding','valentinOpen','decisionConfirm')}<p class="fine">Это не score. Курс не считает снижение уверенности успехом.</p>`);},
valentinOpen(){valentinShell(`<div class="eyebrow">ВАЛЕНТИН / ПЕРВОЕ ВМЕШАТЕЛЬСТВО</div><h2>Решение у нас есть. Уверенность тоже.</h2><div class="quote">Теперь посмотрим, переживут ли они знакомство друг с другом.</div><div class="actions"><button class="btn red" id="openCase">Открыть дело</button></div>`);},
caseCreated(){state.currentDay=1;state.status='active';caseId();save();shell(`<div class="eyebrow">ДЕЛО ОТКРЫТО</div><h2>${esc(state.sessionId)}</h2><div class="stats"><div class="stat"><span>Решение</span><b style="font-size:20px">${esc(state.decision)}</b></div><div class="stat"><span>Направление</span><b style="font-size:20px">${esc(domains[state.domain])}</b></div><div class="stat"><span>Уверенность</span><b>${state.initialConfidence}%</b></div></div><div class="actions">${btn('Перейти к первому подозрению','d1intro','red')}</div>`);},
d1intro(){state.currentDay=1;save();shell(`<div class="eyebrow">ДЕНЬ 1 / О — ОЖИДАНИЕ / П — ПРЕДПОСЫЛКИ</div><h2>Да нормально будет</h2><p class="lead">Большинство проблем сначала выглядят именно так.</p><div class="stamp">Предположение</div><div class="actions">${btn('Начать разбор','d1expect')}</div>`);},
d1expect(){shell(`<div class="eyebrow">ДЕНЬ 1 / О — ОЖИДАНИЕ</div><h2>Как выглядит успех?</h2><label for="expected">Что должно произойти, чтобы вы сказали: «это было хорошее решение»?</label><textarea id="expected">${esc(state.expectedOutcome)}</textarea>${fieldError('expectedErr')}<div class="footer-nav">${back('d1intro')}<button class="btn" id="expectedNext">Продолжить</button></div>`);},
d1assume(){shell(`<div class="eyebrow">ДЕНЬ 1 / П — ПРЕДПОСЫЛКИ</div><h2>Что должно оказаться правдой?</h2><p class="lead">Добавьте минимум 7 условий, на которых держится ваше решение.</p>${listEditor('assumptions','Например: будет достаточно клиентов',7)}${state.assumptions.length>=5?`<div class="valentin"><b>Валентин</b>Пять обычно находится быстро. Интересное начинается после пятой.</div>`:''}${fieldError('assumeErr')}<div class="footer-nav">${back('d1expect')}<button class="btn" id="assumeNext">Продолжить</button></div>`);},
d1classify(){const types=['ЗНАЮ','ПРЕДПОЛАГАЮ','МНЕ СКАЗАЛИ'];shell(`<div class="eyebrow">ДЕНЬ 1 / КЛАССИФИКАЦИЯ</div><h2>Что из этого вы действительно знаете?</h2><div class="list">${state.assumptions.map((a,i)=>`<div class="card"><b>${i+1}. ${esc(a)}</b><div class="chips" style="margin-top:12px">${types.map(t=>`<button class="chip ${state.assumptionTypes[i]===t?'on':''}" data-type-index="${i}" data-type="${t}">${t}</button>`).join('')}</div></div>`).join('')}</div>${fieldError('classErr')}<div class="footer-nav">${back('d1assume')}<button class="btn" id="classNext">Продолжить</button></div>`);},
d1control(){shell(`<div class="eyebrow">ДЕНЬ 1 / КОНТРОЛЬНЫЙ ВОПРОС</div><h2>На основании чего вы решили, что всё будет нормально?</h2><textarea id="control1">${esc(state.control1)}</textarea>${fieldError('control1Err')}<div class="footer-nav">${back('d1classify')}<button class="btn" id="control1Next">Продолжить</button></div>`);},
d1conf(){shell(`<div class="eyebrow">ДЕНЬ 1 / ПОВТОРНОЕ ПОКАЗАНИЕ</div><h2>Насколько это хорошая идея теперь?</h2>${confidenceUI('day1','d1summary','d1control')}`);},
d1summary(){const known=Object.values(state.assumptionTypes).filter(x=>x==='ЗНАЮ').length,ass=Object.values(state.assumptionTypes).filter(x=>x==='ПРЕДПОЛАГАЮ').length,said=Object.values(state.assumptionTypes).filter(x=>x==='МНЕ СКАЗАЛИ').length;const prev=state.confidenceHistory.find(x=>x.stage==='onboarding')?.value??state.initialConfidence;const now=state.currentConfidence;const context=`Из ${state.assumptions.length} предпосылок подтверждёнными вы назвали ${known}; предположений — ${ass}; с чужих слов — ${said}.`;shell(`<div class="eyebrow">ДЕНЬ 1 / РЕЗУЛЬТАТ</div><h2>${prev}% → ${now}%</h2><p class="lead">${esc(confInterpret(prev,now,context))}</p><div class="stats"><div class="stat"><span>Знаю</span><b>${known}</b></div><div class="stat"><span>Предполагаю</span><b>${ass}</b></div><div class="stat"><span>Мне сказали</span><b>${said}</b></div></div><div class="valentin"><b>Валентин</b>Пока ничего страшного. Просто часть вашего решения оказалась прогнозами и чужими словами.</div><div class="note">Production: следующий блок приходит по e-mail. Prototype v0.2 открывает его сразу.</div><div class="actions">${btn('Открыть следующий блок','d2intro')}</div>`);},
d2intro(){state.currentDay=2;save();shell(`<div class="eyebrow">ДЕНЬ 2 / ПРОВЕРКА СВИДЕТЕЛЬСТВ</div><h2>Если тебе это сказали — это ещё не факт</h2><p class="lead">Обещание — прогноз человека относительно собственного будущего поведения.</p><div class="actions">${btn('Разобрать одну договорённость','d2agreement')}</div>`);},
d2agreement(){shell(`<div class="eyebrow">ДЕНЬ 2 / ДОГОВОРЁННОСТЬ</div><h2>На чьём обещании держится решение?</h2><label for="who">Кто?</label><input id="who" type="text" value="${esc(state.agreementWho)}"><label for="said">Что именно человек сказал?</label><textarea id="said">${esc(state.agreementSaid)}</textarea>${fieldError('agreementErr')}<div class="footer-nav">${back('d2intro')}<button class="btn" id="agreementNext">Продолжить</button></div>`);},
d2dissect(){shell(`<div class="eyebrow">ДЕНЬ 2 / РАЗБОР</div><h2>Разделите слова и выводы</h2><label>Что я из этого решил?</label><textarea id="infer">${esc(state.agreementInference)}</textarea><label>Что я действительно знаю?</label><textarea id="known">${esc(state.agreementKnown)}</textarea><label>Как это можно проверить?</label><textarea id="check">${esc(state.agreementCheck)}</textarea>${fieldError('dissectErr')}<div class="footer-nav">${back('d2agreement')}<button class="btn" id="dissectNext">Продолжить</button></div>`);},
d2cost(){const opts=['деньги','время','клиента','возможность','отношения','репутацию','почти ничего'];shell(`<div class="eyebrow">ДЕНЬ 2 / ЦЕНА ДОВЕРИЯ</div><h2>Что вы потеряете, если обещание не будет выполнено?</h2><div class="chips">${opts.map(x=>`<button class="chip ${state.trustCost.includes(x)?'on':''}" data-trust="${x}">${x}</button>`).join('')}</div>${fieldError('costErr')}<div class="footer-nav">${back('d2dissect')}<button class="btn" id="costNext">Продолжить</button></div>`);},
d2reflect(){shell(`<div class="eyebrow">ДЕНЬ 2 / КОНТРОЛЬНЫЙ ВОПРОС</div><h2>Что изменится, если человек не врёт, а просто не может?</h2><textarea id="trustReflection">${esc(state.trustReflection)}</textarea><div class="valentin"><b>Валентин</b>Самая неприятная версия: человек может быть совершенно искренним и всё равно не сделать то, что обещал.</div>${fieldError('reflectErr')}<div class="footer-nav">${back('d2cost')}<button class="btn" id="reflectNext">Продолжить</button></div>`);},
d2conf(){shell(`<div class="eyebrow">ДЕНЬ 2 / ПОВТОРНОЕ ПОКАЗАНИЕ</div><h2>Насколько это хорошая идея теперь?</h2>${confidenceUI('day2','d2summary','d2reflect')}`);},
d2summary(){const prev=state.confidenceHistory.filter(x=>x.stage!=='day2').at(-1)?.value??state.initialConfidence;const now=state.currentConfidence;const context=`Критическая договорённость теперь отделена на слова, ваши выводы, известное и проверку.`;shell(`<div class="eyebrow">ДЕНЬ 2 / РЕЗУЛЬТАТ</div><h2>${prev}% → ${now}%</h2><p class="lead">${esc(confInterpret(prev,now,context))}</p><div class="actions">${btn('Следующий блок','d3intro')}</div>`);},
d3intro(){state.currentDay=3;save();shell(`<div class="eyebrow">ДЕНЬ 3 / А — АЛЬТЕРНАТИВЫ</div><h2>Где тут может быть пиздец</h2><p class="lead">Представьте: прошёл год, решение оказалось плохим.</p><div class="actions">${btn('Искать причины','d3failures')}</div>`);},
d3failures(){shell(`<div class="eyebrow">ДЕНЬ 3 / PREMORTEM</div><h2>Почему всё закончилось плохо?</h2><p class="lead">Найдите минимум 15 независимых причин. Первые пять — разминка.</p>${listEditor('failureModes','Например: ключевой человек ушёл',15)}${state.failureModes.length>=5?`<div class="valentin"><b>Валентин</b>Пять причин провала обычно называет оптимист. Продолжайте.</div>`:''}${fieldError('failErr')}<div class="footer-nav">${back('d3intro')}<button class="btn" id="failNext">Продолжить</button></div>`);},
d3uncomfortable(){shell(`<div class="eyebrow">ДЕНЬ 3 / НЕПРИЯТНАЯ ВЕРСИЯ</div><h2>Какую причину вам хочется считать маловероятной?</h2><input id="uncomfortable" type="text" value="${esc(state.uncomfortableFailure)}"><label>Почему?</label><textarea id="uncomfortableWhy">${esc(state.uncomfortableWhy)}</textarea><div class="valentin"><b>Валентин</b>Обычно самая полезная причина — та, которую хочется немедленно объяснить как маловероятную.</div>${fieldError('uncomfortableErr')}<div class="footer-nav">${back('d3failures')}<button class="btn" id="uncomfortableNext">Продолжить</button></div>`);},
d3conf(){shell(`<div class="eyebrow">ДЕНЬ 3 / ПОВТОРНОЕ ПОКАЗАНИЕ</div><h2>Насколько это хорошая идея теперь?</h2>${confidenceUI('day3','d3summary','d3uncomfortable')}`);},
d3summary(){const prev=state.confidenceHistory.filter(x=>x.stage!=='day3').at(-1)?.value??state.initialConfidence;const now=state.currentConfidence;const context=`Вы нашли ${state.failureModes.length} способов провала и отдельно выбрали тот, который неприятнее всего признавать.`;shell(`<div class="eyebrow">ДЕНЬ 3 / РЕЗУЛЬТАТ</div><h2>${prev}% → ${now}%</h2><p class="lead">${esc(confInterpret(prev,now,context))}</p><div class="actions">${btn('Следующий блок','d4intro')}</div>`);},
d4intro(){state.currentDay=4;save();shell(`<div class="eyebrow">ДЕНЬ 4 / С — СИГНАЛЫ</div><h2>Слабые сигналы</h2><div class="case">Подрядчик обычно отвечает за 20 минут. Теперь — за четыре часа. Потом переносит звонок. Потом пишет: «всё в процессе».</div><p class="lead">Сигнал редко выглядит как доказательство. Если бы выглядел, он назывался бы уже проблемой.</p><div class="actions">${btn('Найти свои сигналы','d4signals')}</div>`);},
d4signals(){shell(`<div class="eyebrow">ДЕНЬ 4 / СИГНАЛЫ</div><h2>Какие 5 ранних признаков покажут, что ситуация идёт не туда?</h2>${listEditor('signals','Например: цифры начинают расходиться',5)}${fieldError('signalsErr')}<div class="footer-nav">${back('d4intro')}<button class="btn" id="signalsNext">Продолжить</button></div>`);},
d4rationalize(){shell(`<div class="eyebrow">ДЕНЬ 4 / РАЦИОНАЛИЗАЦИЯ</div><h2>Какой сигнал вы скорее всего попытаетесь объяснить?</h2><input id="rationalizedSignal" type="text" value="${esc(state.rationalizedSignal)}"><label>«Это просто потому что...»</label><textarea id="rationalization">${esc(state.rationalization)}</textarea>${fieldError('rationalErr')}<div class="footer-nav">${back('d4signals')}<button class="btn" id="rationalNext">Продолжить</button></div>`);},
d4trigger(){shell(`<div class="eyebrow">ДЕНЬ 4 / ТОЧКА ПЕРЕПРОВЕРКИ</div><h2>После какого события вы обязаны перепроверить гипотезу?</h2><textarea id="recheckTrigger">${esc(state.recheckTrigger)}</textarea>${fieldError('triggerErr')}<div class="footer-nav">${back('d4rationalize')}<button class="btn" id="triggerNext">Продолжить</button></div>`);},
d4conf(){shell(`<div class="eyebrow">ДЕНЬ 4 / ПОВТОРНОЕ ПОКАЗАНИЕ</div><h2>Насколько это хорошая идея теперь?</h2>${confidenceUI('day4','d4summary','d4trigger')}`);},
d4summary(){const prev=state.confidenceHistory.filter(x=>x.stage!=='day4').at(-1)?.value??state.initialConfidence;const now=state.currentConfidence;const context=`Зафиксировано ${state.signals.length} ранних сигналов и конкретная точка обязательной перепроверки.`;shell(`<div class="eyebrow">ДЕНЬ 4 / РЕЗУЛЬТАТ</div><h2>${prev}% → ${now}%</h2><p class="lead">${esc(confInterpret(prev,now,context))}</p><div class="actions">${btn('Следующий блок','d5intro')}</div>`);},
d5intro(){state.currentDay=5;save();shell(`<div class="eyebrow">ДЕНЬ 5 / Н — НЕОБРАТИМОСТЬ</div><h2>Красные флаги для бедных. У нас — система</h2><p class="lead">Красная линия полезнее до того, как вы уже по другую сторону.</p><div class="actions">${btn('Поставить границы','d5states')}</div>`);},
d5states(){shell(`<div class="eyebrow">ДЕНЬ 5 / ТРИ СОСТОЯНИЯ</div><h2>Где зелёное, жёлтое и красное?</h2><label>Зелёное — всё в допустимом диапазоне</label><textarea id="green">${esc(state.greenState)}</textarea><label>Жёлтое — нужна перепроверка</label><textarea id="yellow">${esc(state.yellowState)}</textarea><label>Красное — решение меняется или прекращается</label><textarea id="red">${esc(state.redLine)}</textarea>${fieldError('statesErr')}<div class="footer-nav">${back('d5intro')}<button class="btn" id="statesNext">Продолжить</button></div>`);},
d5irreversible(){const opts=['деньги','время','договор','репутацию','отношения','обязательства','здоровье / безопасность'];shell(`<div class="eyebrow">ДЕНЬ 5 / НЕОБРАТИМОСТЬ</div><h2>Что будет трудно вернуть?</h2><div class="chips">${opts.map(x=>`<button class="chip ${state.irreversible.includes(x)?'on':''}" data-irrev="${x}">${x}</button>`).join('')}</div>${fieldError('irrevErr')}<div class="footer-nav">${back('d5states')}<button class="btn" id="irrevNext">Продолжить</button></div>`);},
d5sunk(){const scenario=state.domain==='people'?'Вы уже сильно вложились в отношения и договорённости. Появился сигнал, который заранее назвали красным.':state.domain==='home'?'Вы уже потратили много времени и денег на решение. Появился заранее записанный красный сигнал.':'Вы уже вложили значимую сумму и время. Появился сигнал, который до начала проекта вы назвали красным.';shell(`<div class="eyebrow">ДЕНЬ 5 / SUNK COST</div><h2>Красная линия уже сработала</h2><div class="case">${esc(scenario)}</div><div class="grid" style="grid-template-columns:1fr 1fr"><button class="choice ${state.sunkChoice==='continue'?'selected':''}" data-sunk="continue">Продолжить</button><button class="choice ${state.sunkChoice==='stop'?'selected':''}" data-sunk="stop">Остановиться</button></div>${state.sunkChoice==='continue'?`<div class="valentin"><b>Валентин</b>Именно поэтому красную линию полезно записывать до того, как появятся причины её передвинуть.</div>`:''}${fieldError('sunkErr')}<div class="footer-nav">${back('d5irreversible')}<button class="btn" id="sunkNext">Продолжить</button></div>`);},
d5redline(){shell(`<div class="eyebrow">ДЕНЬ 5 / КРАСНАЯ ЛИНИЯ</div><h2>При каком наблюдаемом условии вы прекращаете продолжать?</h2><textarea id="redLineFinal">${esc(state.redLine)}</textarea><p class="small">«Если станет плохо» не считается наблюдаемым условием.</p>${fieldError('redlineErr')}<div class="footer-nav">${back('d5sunk')}<button class="btn" id="redlineNext">Продолжить</button></div>`);},
d5conf(){shell(`<div class="eyebrow">ДЕНЬ 5 / ПОВТОРНОЕ ПОКАЗАНИЕ</div><h2>Насколько это хорошая идея теперь?</h2>${confidenceUI('day5','d5summary','d5redline')}`);},
d5summary(){const prev=state.confidenceHistory.filter(x=>x.stage!=='day5').at(-1)?.value??state.initialConfidence;const now=state.currentConfidence;const context=`Красная линия сформулирована заранее, а необратимые потери названы до кризиса.`;shell(`<div class="eyebrow">ДЕНЬ 5 / РЕЗУЛЬТАТ</div><h2>${prev}% → ${now}%</h2><p class="lead">${esc(confInterpret(prev,now,context))}</p><div class="actions">${btn('Следующий блок','d6intro')}</div>`);},
d6intro(){state.currentDay=6;save();shell(`<div class="eyebrow">ДЕНЬ 6 / ПРОВЕРКА ГИПОТЕЗЫ</div><h2>Не влюбляйся в собственную версию</h2><p class="lead">Сначала защита. Потом обвинение.</p><div class="actions">${btn('Начать','d6pros')}</div>`);},
d6pros(){shell(`<div class="eyebrow">ДЕНЬ 6 / ЗАЩИТА</div><h2>Почему ваша идея хорошая?</h2><textarea id="pros">${esc(state.proArguments)}</textarea>${fieldError('prosErr')}<div class="footer-nav">${back('d6intro')}<button class="btn" id="prosNext">Продолжить</button></div>`);},
d6counter(){shell(`<div class="eyebrow">ДЕНЬ 6 / ПРОКУРОР</div><h2>Почему человек, который знает больше вас, мог бы считать её плохой?</h2><textarea id="counter">${esc(state.counterArguments)}</textarea>${fieldError('counterErr')}<div class="footer-nav">${back('d6pros')}<button class="btn" id="counterNext">Продолжить</button></div>`);},
d6falsify(){shell(`<div class="eyebrow">ДЕНЬ 6 / ФАЛЬСИФИКАЦИЯ</div><h2>Какой факт доказал бы, что вы ошибаетесь?</h2><textarea id="falsify">${esc(state.falsificationFact)}</textarea>${fieldError('falsifyErr')}<div class="valentin"><b>Валентин</b>Если никакой факт не способен изменить ваше мнение, у вас не решение. У вас уже убеждение.</div><div class="footer-nav">${back('d6counter')}<button class="btn" id="falsifyNext">Продолжить</button></div>`);},
d6conf(){shell(`<div class="eyebrow">ДЕНЬ 6 / ПОВТОРНОЕ ПОКАЗАНИЕ</div><h2>Насколько это хорошая идея теперь?</h2>${confidenceUI('day6','d6summary','d6falsify')}`);},
d6summary(){const prev=state.confidenceHistory.filter(x=>x.stage!=='day6').at(-1)?.value??state.initialConfidence;const now=state.currentConfidence;const context=`У гипотезы теперь есть не только защита, но и конкретный факт, который должен заставить вас передумать.`;shell(`<div class="eyebrow">ДЕНЬ 6 / РЕЗУЛЬТАТ</div><h2>${prev}% → ${now}%</h2><p class="lead">${esc(confInterpret(prev,now,context))}</p><div class="actions">${btn('Финальный блок','d7intro','red')}</div>`);},
d7intro(){state.currentDay=7;save();shell(`<div class="eyebrow">ДЕНЬ 7 / О — ОТВЕТ</div><h2>Смелость без идиотизма</h2><p class="lead">Цель курса — не перестать действовать. Цель — перестать удивляться.</p><div class="actions">${btn('Собрать финальное решение','d7error')}</div>`);},
d7error(){shell(`<div class="eyebrow">ДЕНЬ 7 / ЦЕНА ОШИБКИ</div><h2>Что произойдёт, если вы сделаете и окажетесь неправы?</h2><textarea id="errorCost">${esc(state.errorCost)}</textarea>${fieldError('errorCostErr')}<div class="footer-nav">${back('d7intro')}<button class="btn" id="errorCostNext">Продолжить</button></div>`);},
d7inaction(){shell(`<div class="eyebrow">ДЕНЬ 7 / ЦЕНА БЕЗДЕЙСТВИЯ</div><h2>А что произойдёт, если вы не сделаете?</h2><textarea id="inactionCost">${esc(state.inactionCost)}</textarea>${fieldError('inactionErr')}<div class="footer-nav">${back('d7error')}<button class="btn" id="inactionNext">Продолжить</button></div>`);},
d7planb(){const duplicate=norm(state.planB)&&norm(state.planB)===norm(state.errorCost);shell(`<div class="eyebrow">ДЕНЬ 7 / PLAN B</div><h2>Если реализуется плохая версия — что вы будете делать?</h2><textarea id="planB">${esc(state.planB)}</textarea>${duplicate?`<div class="valentin"><b>Валентин</b>Вы дважды предложили одну и ту же вещь: сначала как ущерб, потом как план ответа. Формально поля заполнены. Планом B это пока считать затруднительно.</div>`:''}${fieldError('planBErr')}<div class="footer-nav">${back('d7inaction')}<button class="btn" id="planBNext">Продолжить</button></div>`);},
d7conf(){shell(`<div class="eyebrow">ДЕНЬ 7 / ФИНАЛЬНОЕ ПОКАЗАНИЕ</div><h2>Насколько это хорошая идея теперь?</h2>${confidenceUI('day7','d7decision','d7planb')}`);},
d7decision(){const opts=[['do','ДА. ДЕЛАТЬ.'],['change','ДА, НО ИЗМЕНИТЬ УСЛОВИЯ.'],['stop','НЕТ.']];shell(`<div class="eyebrow">ДЕНЬ 7 / ФИНАЛЬНОЕ РЕШЕНИЕ</div><h2>Если всё перечисленное действительно может произойти — вы всё ещё хотите это делать?</h2><div class="grid">${opts.map(([k,v])=>`<button class="choice ${state.finalDecision===k?'selected':''}" data-final="${k}">${v}</button>`).join('')}</div>${fieldError('finalErr')}<div class="footer-nav">${back('d7conf')}<button class="btn" id="finalNext">Зафиксировать решение</button></div>`);},
verdict(){const copy={do:'Неприятный результат. После всех проверок идея всё ещё выглядит разумно. Придётся делать.',change:'Хорошо. Вы не отказались от решения. Вы всего лишь перестали принимать его в первоначальной комплектации.',stop:'Отказ от плохой идеи тоже является решением. Хотя выглядит значительно менее героически.'}[state.finalDecision];valentinShell(`<div class="eyebrow">ВАЛЕНТИН / ВЕРДИКТ</div><h2>Система решение не принимала.</h2><div class="quote">Вы дошли до него самостоятельно. Это и была неприятная часть.</div><p class="quote" style="font-size:24px">${esc(copy)}</p><div class="actions"><button class="btn red" data-go="examIntro">Перейти к экзамену</button></div>`);},
examIntro(){shell(`<div class="eyebrow">ЭКЗАМЕН / НОВОЕ ДЕЛО</div><h2>Теперь без вашего контекста</h2><div class="case">Знакомый предлагает вложить €40 000 в новый проект. Похожий бизнес он уже запускал в другом городе. По его расчётам проект окупится за 18 месяцев. Уже есть ещё два инвестора. Помещение найдено. Решение необходимо принять до пятницы.</div><p class="lead">Вам не нужно выбирать «да» или «нет». Нужно понять, чего вы ещё не знаете.</p><div class="actions">${btn('Начать экзамен','examQuestions')}</div>`);},
examQuestions(){shell(`<div class="eyebrow">ЭКЗАМЕН / НЕИЗВЕСТНЫЕ</div><h2>Что вам нужно узнать перед тем, как ответить?</h2><p class="lead">Добавьте минимум 5 самостоятельных вопросов.</p>${listEditor('examQuestions','Например: на основании чего рассчитаны 18 месяцев?',5)}${fieldError('examErr')}<div class="footer-nav">${back('examIntro')}<button class="btn" id="examNext">Проверить вопросы</button></div>`);},
examResult(){const cats=state.examCoverage;shell(`<div class="eyebrow">ЭКЗАМЕН / РЕЗУЛЬТАТ</div><h2>${state.examPassed?'Решение не принято':'Неизвестных пока мало'}</h2><p class="lead">${state.examPassed?'Из-за недостатка данных. Вы отказались изображать уверенность там, где информации недостаточно.':'Вы задали вопросы, но покрыли слишком мало типов неизвестных. Вернитесь и расширьте проверку.'}</p><div class="chips">${cats.map(x=>`<span class="chip on">${esc(x)}</span>`).join('')}</div><div class="actions">${state.examPassed?btn('Завершить дело','completed','red'):btn('Вернуться к вопросам','examQuestions')}</div>`);},
completed(){state.status='completed';state.completedAt=state.completedAt||new Date().toISOString();save();shell(`<div class="eyebrow">ДЕЛО ЗАВЕРШЕНО</div><h2>Решение не принято автоматически.</h2><p class="lead">Система его не выбирала. Вы дошли до финала сами.</p><div class="stats"><div class="stat"><span>Было</span><b>${state.initialConfidence}%</b></div><div class="stat"><span>Стало</span><b>${state.currentConfidence}%</b></div><div class="stat"><span>Финал</span><b style="font-size:20px">${state.finalDecision==='do'?'ДЕЛАТЬ':state.finalDecision==='change'?'ИЗМЕНИТЬ УСЛОВИЯ':'НЕ ДЕЛАТЬ'}</b></div></div><div class="actions">${btn('Открыть Карту опасности','dangerMap')}</div>`);},
dangerMap(){const counts={known:Object.values(state.assumptionTypes).filter(x=>x==='ЗНАЮ').length,ass:Object.values(state.assumptionTypes).filter(x=>x==='ПРЕДПОЛАГАЮ').length,said:Object.values(state.assumptionTypes).filter(x=>x==='МНЕ СКАЗАЛИ').length};shell(`<div class="eyebrow">АРТЕФАКТ КУРСА</div><h2>Карта опасности</h2><div class="danger-map"><header><div><div class="section-title">Дело</div><h3>${esc(state.sessionId)}</h3></div><div class="stamp">Решение проверено</div></header><section><div class="section-title">Решение / контекст</div><p><b>${esc(state.decision)}</b><br>${esc(domains[state.domain])}</p></section><section><div class="section-title">Ожидаемый результат</div><p>${esc(state.expectedOutcome)}</p></section><section><div class="section-title">Предпосылки</div><p><b>ЗНАЮ ${counts.known}</b> · <b>ПРЕДПОЛАГАЮ ${counts.ass}</b> · <b>МНЕ СКАЗАЛИ ${counts.said}</b></p><p>${state.assumptions.map((x,i)=>`${i+1}. ${esc(x)} — <b>${esc(state.assumptionTypes[i]||'ТРЕБУЕТ ПРОВЕРКИ')}</b>`).join('<br>')}</p></section><section><div class="section-title">Способы провала</div><p>${state.failureModes.map(x=>esc(x)).join(' · ')}</p></section><section><div class="section-title">Ранние сигналы</div><p>${state.signals.map(x=>esc(x)).join(' · ')}</p></section><section><div class="section-title">Красная линия</div><p><span class="stamp" style="font-size:11px">КРАСНАЯ ЛИНИЯ</span><br>${esc(state.redLine)}</p></section><section><div class="section-title">Цена ошибки / цена бездействия / Plan B</div><p><b>Ошибка:</b> ${esc(state.errorCost)}</p><p><b>Бездействие:</b> ${esc(state.inactionCost)}</p><p><b>Plan B:</b> ${esc(state.planB)}</p></section><section><div class="section-title">Траектория уверенности</div><p class="mono">${state.confidenceHistory.map(x=>`${x.stage}: ${x.value}%`).join(' → ')}</p></section><section><div class="section-title">Финальное решение</div><h3>${state.finalDecision==='do'?'ДЕЛАТЬ':state.finalDecision==='change'?'ИЗМЕНИТЬ УСЛОВИЯ':'НЕ ДЕЛАТЬ'}</h3></section></div><div class="actions"><button class="btn alt" onclick="window.print()">Распечатать карту</button>${btn('Получить сертификат','certificate','red')}</div>`);},
certificate(){shell(`<div class="eyebrow">ФИНАЛЬНЫЙ АРТЕФАКТ</div><h2>Сертификат</h2><div class="cert"><div class="eyebrow">МИНИСТЕРСТВО ПРОФИЛАКТИКИ ЗДРАВОГО СМЫСЛА</div><h2>СЕРТИФИКАТ ПОВЫШЕННОЙ ПОДОЗРИТЕЛЬНОСТИ</h2><p>Настоящим подтверждается, что участник перестал считать отсутствие плохих новостей хорошей новостью.</p><h3>ОПАСНО ДУМАЮЩИЙ ГРАЖДАНИН I КЛАССА</h3><p>Валентин Лосев</p></div><div class="actions"><button class="btn alt" onclick="window.print()">Распечатать</button>${btn('Посмотреть прототип письма','emailFinish')}</div>`);},
emailFinish(){shell(`<div class="eyebrow">PROTOTYPE / E-MAIL RESULT</div><h2>Ваше дело завершено</h2><div class="email-preview"><div class="subject">Тема: ваше решение пережило проверку</div><p>Исходная уверенность: <b>${state.initialConfidence}%</b><br>Финальная: <b>${state.currentConfidence}%</b></p><p>Финальное решение: <b>${state.finalDecision==='do'?'ДЕЛАТЬ':state.finalDecision==='change'?'ИЗМЕНИТЬ УСЛОВИЯ':'НЕ ДЕЛАТЬ'}</b>.</p><p>В production здесь будет ссылка на сохранённую Карту опасности и следующий доступный шаг.</p><p>— Валентин</p></div><p class="note">Это локальная симуляция. Письмо не отправлено.</p><div class="actions"><button class="btn" id="newDecision">Испортить другое решение</button><button class="btn alt" data-go="dangerMap">Вернуться к карте</button></div>`);},
recovery(){shell(`<div class="eyebrow">ОШИБКА СОСТОЯНИЯ</div><h2>Дело повреждено сильнее, чем планировалось</h2><p class="lead">Локальное состояние прототипа не удалось прочитать.</p><div class="actions"><button class="btn red" id="recoverReset">Начать заново</button></div>`);}
};
function examCategories(questions){const text=norm(questions.join(' '));const defs=[['люди',/(человек|партнер|партнёр|команда|основатель|инвестор)/],['деньги',/(деньг|финанс|выруч|прибыл|долг|€|евро|бюджет)/],['право',/(договор|право|юрид|лиценз|доля|собствен)/],['рынок',/(рынок|клиент|спрос|конкурент|продаж)/],['сроки',/(срок|месяц|дата|пятниц|время)/],['предпосылки',/(почему|основан|расчет|расчёт|доказ|предполага)/],['зависимости',/(завис|если|поставщик|помещен|аренд)/],['необратимость',/(потер|вернуть|выход|прекрат|ущерб)/],['альтернативы',/(альтернатив|иначе|другой вариант|что если)/],['сигналы',/(сигнал|показател|критер|метрик)/]];return defs.filter(([,r])=>r.test(text)).map(([n])=>n)}
function bind(){
 document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));
 document.getElementById('brand').onclick=()=>go('landing');
 document.getElementById('resetUtility').onclick=()=>document.getElementById('modal').classList.add('open');
 document.getElementById('cancelReset').onclick=()=>document.getElementById('modal').classList.remove('open');
 document.getElementById('confirmReset').onclick=()=>{localStorage.removeItem(KEY);state=fresh();document.getElementById('modal').classList.remove('open');render()};
 const setErr=(id,msg)=>{const e=document.getElementById(id);if(e)e.textContent=msg};
 const resume=document.getElementById('resume');if(resume)resume.onclick=()=>go(state.screen==='landing'?'caseCreated':state.screen);
 const newCase=document.getElementById('newCase');if(newCase)newCase.onclick=()=>document.getElementById('modal').classList.add('open');
 const startBtn=document.getElementById('startBtn');if(startBtn)startBtn.onclick=()=>{track('course_start_clicked');go('email')};
 const thinkBtn=document.getElementById('thinkBtn');if(thinkBtn)thinkBtn.onclick=()=>document.getElementById('already').textContent='Уже начали.';
 const email=document.getElementById('email');if(email)email.oninput=e=>set('email',e.target.value);
 const emailNext=document.getElementById('emailNext');if(emailNext)emailNext.onclick=()=>{const v=String(state.email||'').trim().toLowerCase();if(!emailValid(v)){setErr('emailErr','АДРЕС НЕ УДАЛОСЬ ПРИОБЩИТЬ К ДЕЛУ. ПРОВЕРЬТЕ НАПИСАНИЕ.');return}state.email=v;track('course_email_validated');go('rule')};
 const ruleYes=document.getElementById('ruleYes');if(ruleYes)ruleYes.onclick=()=>{track('course_rule_confirmed');go('domain')};const ruleNo=document.getElementById('ruleNo');if(ruleNo)ruleNo.onclick=()=>go('landing');
 document.querySelectorAll('[data-domain]').forEach(x=>x.onclick=()=>{state.domain=x.dataset.domain;track('decision_domain_selected',{domain:state.domain});save();render()});
 const domainNext=document.getElementById('domainNext');if(domainNext)domainNext.onclick=()=>state.domain?go('decision'):setErr('domainErr','СНАЧАЛА ВЫБЕРИТЕ, ГДЕ ПРОИСХОДИТ РЕШЕНИЕ.');
 const decision=document.getElementById('decision');if(decision)decision.oninput=e=>{state.decisionDraft=e.target.value;save()};
 const decisionNext=document.getElementById('decisionNext');if(decisionNext)decisionNext.onclick=()=>{const q=decisionQuality(state.decisionDraft);if(q.type==='invalid'){setErr('decisionErr',q.msg);return}if(q.type==='weak'){track('decision_rejected_as_generic');setErr('decisionErr',q.msg);setTimeout(()=>go('decisionFollowup'),500);return}state.decision=state.decisionDraft.trim();go('decisionConfirm')};
 const refined=document.getElementById('decisionRefined');if(refined)refined.oninput=e=>set('decision',e.target.value);
 const refinedNext=document.getElementById('decisionRefinedNext');if(refinedNext)refinedNext.onclick=()=>{const q=decisionQuality(state.decision);if(q.type!=='valid'){setErr('decisionRefinedErr',q.msg);return}go('decisionConfirm')};
 const decisionConfirmBtn=document.getElementById('decisionConfirmBtn');if(decisionConfirmBtn)decisionConfirmBtn.onclick=()=>{track('decision_confirmed');go('confidence')};
 const range=document.getElementById('confidence');if(range)range.oninput=e=>{state.currentConfidence=+e.target.value;save();const cv=document.getElementById('cv');if(cv)cv.textContent=e.target.value};
 const confSave=document.getElementById('confSave');if(confSave)confSave.onclick=()=>{track(confSave.dataset.stage==='onboarding'?'initial_confidence_set':'confidence_changed',{stage:confSave.dataset.stage,value:+document.getElementById('confidence').value});setConfidence(confSave.dataset.stage,confSave.dataset.next)};
 const openCase=document.getElementById('openCase');if(openCase)openCase.onclick=()=>{caseId();state.startedAt=state.startedAt||new Date().toISOString();state.status='active';track('course_session_created');go('caseCreated')};
 const expected=document.getElementById('expected');if(expected)expected.oninput=e=>set('expectedOutcome',e.target.value);const expectedNext=document.getElementById('expectedNext');if(expectedNext)expectedNext.onclick=()=>{const q=textQuality(state.expectedOutcome,12);if(q.type!=='valid'){setErr('expectedErr',q.msg);return}go('d1assume')};
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const key=b.dataset.add,input=document.getElementById(key+'Input');const v=input?.value.trim();if(!v)return;if((state[key]||[]).some(x=>norm(x)===norm(v))){const err=document.getElementById(key==='assumptions'?'assumeErr':key==='failureModes'?'failErr':key==='signals'?'signalsErr':key==='examQuestions'?'examErr':'');if(err)err.textContent='ЭТО УЖЕ ЕСТЬ В ДЕЛЕ. НУЖЕН НОВЫЙ ПУНКТ.';return}(state[key]||(state[key]=[])).push(v);save();render()});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state[b.dataset.key].splice(+b.dataset.del,1);save();render()});
 const assumeNext=document.getElementById('assumeNext');if(assumeNext)assumeNext.onclick=()=>state.assumptions.length>=7?go('d1classify'):setErr('assumeErr',`ДЕЛО ПОКА НЕ ПРИНИМАЕТСЯ. НЕ ХВАТАЕТ ЕЩЁ ${7-state.assumptions.length} ПРЕДПОСЫЛОК.`);
 document.querySelectorAll('[data-type-index]').forEach(b=>b.onclick=()=>{state.assumptionTypes[b.dataset.typeIndex]=b.dataset.type;save();render()});
 const classNext=document.getElementById('classNext');if(classNext)classNext.onclick=()=>{const missing=state.assumptions.filter((_,i)=>!state.assumptionTypes[i]).length;if(missing){setErr('classErr',`${missing===1?'ОДНА ПРЕДПОСЫЛКА ОСТАЛАСЬ':missing+' ПРЕДПОСЫЛКИ ОСТАЛИСЬ'} БЕЗ СТАТУСА.`);return}go('d1control')};
 const bindText=(id,key,err,next,min=8)=>{const el=document.getElementById(id);if(el)el.oninput=e=>set(key,e.target.value);const b=document.getElementById(id+'Next');if(b)b.onclick=()=>{const q=textQuality(state[key],min);if(q.type!=='valid'){setErr(err,q.msg);return}go(next)}};
 bindText('control1','control1','control1Err','d1conf',12);
 const agreementFields=[['who','agreementWho'],['said','agreementSaid']];agreementFields.forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.oninput=e=>set(k,e.target.value)});const agreementNext=document.getElementById('agreementNext');if(agreementNext)agreementNext.onclick=()=>{if(textQuality(state.agreementWho,3).type!=='valid'||textQuality(state.agreementSaid,8).type!=='valid'){setErr('agreementErr','НЕ ХВАТАЕТ КОНКРЕТНОГО ЧЕЛОВЕКА ИЛИ ТОЧНОГО ОБЕЩАНИЯ.');return}go('d2dissect')};
 [['infer','agreementInference'],['known','agreementKnown'],['check','agreementCheck']].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.oninput=e=>set(k,e.target.value)});const dissectNext=document.getElementById('dissectNext');if(dissectNext)dissectNext.onclick=()=>{if([state.agreementInference,state.agreementKnown,state.agreementCheck].some(x=>textQuality(x,8).type!=='valid')){setErr('dissectErr','ОДИН ИЗ ТРЁХ СЛОЁВ ПОКА СЛИШКОМ ПУСТОЙ.');return}go('d2cost')};
 document.querySelectorAll('[data-trust]').forEach(b=>b.onclick=()=>{const x=b.dataset.trust;state.trustCost=state.trustCost.includes(x)?state.trustCost.filter(y=>y!==x):[...state.trustCost,x];save();render()});const costNext=document.getElementById('costNext');if(costNext)costNext.onclick=()=>state.trustCost.length?go('d2reflect'):setErr('costErr','ВЫБЕРИТЕ ХОТЯ БЫ ОДНУ ЦЕНУ ОШИБКИ ДОВЕРИЯ.');bindText('trustReflection','trustReflection','reflectErr','d2conf',12);
 const failNext=document.getElementById('failNext');if(failNext)failNext.onclick=()=>state.failureModes.length>=15?go('d3uncomfortable'):setErr('failErr',`ПЕРВЫЕ ПЯТЬ — РАЗМИНКА. НУЖНО ЕЩЁ ${15-state.failureModes.length}.`);
 [['uncomfortable','uncomfortableFailure'],['uncomfortableWhy','uncomfortableWhy']].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.oninput=e=>set(k,e.target.value)});const uncomfortableNext=document.getElementById('uncomfortableNext');if(uncomfortableNext)uncomfortableNext.onclick=()=>{if(textQuality(state.uncomfortableFailure,5).type!=='valid'||textQuality(state.uncomfortableWhy,10).type!=='valid'){setErr('uncomfortableErr','НУЖНА САМА НЕПРИЯТНАЯ ВЕРСИЯ И ПРИЧИНА, ПОЧЕМУ ВЫ ЕЁ ОТТАЛКИВАЕТЕ.');return}go('d3conf')};
 const signalsNext=document.getElementById('signalsNext');if(signalsNext)signalsNext.onclick=()=>state.signals.length>=5?go('d4rationalize'):setErr('signalsErr',`НЕ ХВАТАЕТ ЕЩЁ ${5-state.signals.length} СИГНАЛОВ.`);
 [['rationalizedSignal','rationalizedSignal'],['rationalization','rationalization']].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.oninput=e=>set(k,e.target.value)});const rationalNext=document.getElementById('rationalNext');if(rationalNext)rationalNext.onclick=()=>{if(textQuality(state.rationalizedSignal,5).type!=='valid'||textQuality(state.rationalization,8).type!=='valid'){setErr('rationalErr','НАЗОВИТЕ СИГНАЛ И СОБСТВЕННОЕ ОБЪЯСНЕНИЕ, КОТОРЫМ ВЫ ЕГО ОБЕЗВРЕДИТЕ.');return}go('d4trigger')};bindText('recheckTrigger','recheckTrigger','triggerErr','d4conf',12);
 [['green','greenState'],['yellow','yellowState'],['red','redLine']].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.oninput=e=>set(k,e.target.value)});const statesNext=document.getElementById('statesNext');if(statesNext)statesNext.onclick=()=>{if([state.greenState,state.yellowState,state.redLine].some(x=>textQuality(x,8).type!=='valid')){setErr('statesErr','ВСЕ ТРИ СОСТОЯНИЯ ДОЛЖНЫ БЫТЬ НАБЛЮДАЕМЫМИ, А НЕ ЭМОЦИОНАЛЬНЫМИ.');return}go('d5irreversible')};
 document.querySelectorAll('[data-irrev]').forEach(b=>b.onclick=()=>{const x=b.dataset.irrev;state.irreversible=state.irreversible.includes(x)?state.irreversible.filter(y=>y!==x):[...state.irreversible,x];save();render()});const irrevNext=document.getElementById('irrevNext');if(irrevNext)irrevNext.onclick=()=>state.irreversible.length?go('d5sunk'):setErr('irrevErr','НАЗОВИТЕ ХОТЯ БЫ ОДНУ ВЕЩЬ, КОТОРУЮ БУДЕТ ТРУДНО ВЕРНУТЬ.');
 document.querySelectorAll('[data-sunk]').forEach(b=>b.onclick=()=>{state.sunkChoice=b.dataset.sunk;save();render()});const sunkNext=document.getElementById('sunkNext');if(sunkNext)sunkNext.onclick=()=>state.sunkChoice?go('d5redline'):setErr('sunkErr','НУЖНО ВЫБРАТЬ, ЧТО ВЫ СДЕЛАЕТЕ ПОСЛЕ СРАБАТЫВАНИЯ КРАСНОЙ ЛИНИИ.');const redFinal=document.getElementById('redLineFinal');if(redFinal)redFinal.oninput=e=>set('redLine',e.target.value);const redlineNext=document.getElementById('redlineNext');if(redlineNext)redlineNext.onclick=()=>{const n=norm(state.redLine);if(textQuality(state.redLine,10).type!=='valid'||/если станет плохо|когда станет плохо|будет плохо/.test(n)){setErr('redlineErr','КРАСНАЯ ЛИНИЯ ДОЛЖНА БЫТЬ НАБЛЮДАЕМОЙ. «ЕСЛИ СТАНЕТ ПЛОХО» НЕ ПОДХОДИТ.');return}go('d5conf')};
 bindText('pros','proArguments','prosErr','d6counter',12);bindText('counter','counterArguments','counterErr','d6falsify',12);const falsify=document.getElementById('falsify');if(falsify)falsify.oninput=e=>set('falsificationFact',e.target.value);const falsifyNext=document.getElementById('falsifyNext');if(falsifyNext)falsifyNext.onclick=()=>{const n=norm(state.falsificationFact);if(!n||['никакой','никакой факт','я уверен','ничего'].includes(n)){setErr('falsifyErr','ЭТО ДЕЛАЕТ ГИПОТЕЗУ НЕПРОВЕРЯЕМОЙ. НУЖЕН ФАКТ, КОТОРЫЙ ЗАСТАВИТ ВАС ПЕРЕДУМАТЬ.');return}if(textQuality(state.falsificationFact,10).type!=='valid'){setErr('falsifyErr','НУЖЕН КОНКРЕТНЫЙ ФАКТ, А НЕ ОБЩЕЕ ОЩУЩЕНИЕ.');return}go('d6conf')};
 bindText('errorCost','errorCost','errorCostErr','d7inaction',10);bindText('inactionCost','inactionCost','inactionErr','d7planb',10);const planB=document.getElementById('planB');if(planB)planB.oninput=e=>set('planB',e.target.value);const planBNext=document.getElementById('planBNext');if(planBNext)planBNext.onclick=()=>{if(textQuality(state.planB,10).type!=='valid'){setErr('planBErr','PLAN B ПОКА НЕ ПОХОЖ НА ПЛАН. НУЖНО КОНКРЕТНОЕ ДЕЙСТВИЕ.');return}if(norm(state.planB)===norm(state.errorCost)){setErr('planBErr','ЭТО СОВПАДАЕТ С ЦЕНОЙ ОШИБКИ. ПЛАН ОТВЕТА ДОЛЖЕН БЫТЬ ДРУГИМ.');return}go('d7conf')};
 document.querySelectorAll('[data-final]').forEach(b=>b.onclick=()=>{state.finalDecision=b.dataset.final;save();render()});const finalNext=document.getElementById('finalNext');if(finalNext)finalNext.onclick=()=>{if(!state.finalDecision){setErr('finalErr','РЕШЕНИЕ ВСЁ-ТАКИ ПРИДЁТСЯ ПРИНЯТЬ ВАМ.');return}track('final_decision',{value:state.finalDecision});go('verdict')};
 const examNext=document.getElementById('examNext');if(examNext)examNext.onclick=()=>{if(state.examQuestions.length<5){setErr('examErr',`НУЖНО ЕЩЁ ${5-state.examQuestions.length} ВОПРОСОВ.`);return}state.examCoverage=examCategories(state.examQuestions);state.examPassed=state.examCoverage.length>=4;track('exam_completed',{coverage:state.examCoverage.length,passed:state.examPassed});save();go('examResult')};
 const newDecision=document.getElementById('newDecision');if(newDecision)newDecision.onclick=()=>{const email=state.email;state=fresh();state.email=email;save();go('rule')};
 const recoverReset=document.getElementById('recoverReset');if(recoverReset)recoverReset.onclick=()=>{localStorage.removeItem(KEY);state=fresh();render()};
}
render();
</script>
</body>
