<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ДУМАЙ С ОПАСНОСТЬЮ — прототип v0.1</title>
<style>
:root{--paper:#f1eadc;--ink:#121212;--red:#b42a22;--grey:#d5ccbb;--muted:#716b60;--max:920px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.35}.wrap{width:min(calc(100% - 28px),var(--max));margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(241,234,220,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--ink)}.top .wrap{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;text-transform:uppercase;letter-spacing:.04em}.badge{font:700 11px/1 Arial;border:1px solid var(--ink);padding:7px 9px;text-transform:uppercase}.screen{display:none;min-height:calc(100vh - 60px);padding:44px 0 90px}.screen.active{display:block}.eyebrow{font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.12em;color:var(--red)}h1,h2,h3{margin:0;text-transform:uppercase;line-height:.92}h1{font-size:clamp(54px,12vw,126px);letter-spacing:-.07em}h2{font-size:clamp(40px,8vw,82px);letter-spacing:-.055em}h3{font-size:28px}.red{color:var(--red)}.lead{font-size:clamp(20px,3vw,30px);max-width:760px;margin:28px 0}.small{font-size:13px;color:var(--muted)}.btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:900 14px/1 Arial;padding:16px 18px;text-transform:uppercase;cursor:pointer}.btn.alt{background:transparent;color:var(--ink)}.btn.red{background:var(--red);border-color:var(--red)}.btn:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.card{border:2px solid var(--ink);padding:22px;margin:22px 0;background:rgba(255,255,255,.13)}.valentin{border-left:10px solid var(--red);padding:18px 20px;margin:28px 0;background:var(--ink);color:var(--paper);font-size:21px}.valentin b{display:block;color:#ff6d55;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.choice{border:2px solid var(--ink);padding:18px;min-height:90px;cursor:pointer;font-weight:900;text-transform:uppercase;background:transparent}.choice.selected{background:var(--ink);color:var(--paper)}label{display:block;font-weight:800;margin:20px 0 8px;text-transform:uppercase;font-size:12px;letter-spacing:.06em}input[type=text],input[type=email],textarea{width:100%;border:2px solid var(--ink);background:rgba(255,255,255,.18);color:var(--ink);padding:14px;font:18px/1.4 Arial;border-radius:0}textarea{min-height:110px;resize:vertical}.range-wrap{margin:32px 0}.range-value{font-size:64px;font-weight:900;letter-spacing:-.06em}input[type=range]{width:100%;accent-color:var(--red)}.module-head{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:26px}.module-no{font-weight:900;color:var(--red)}.list{display:grid;gap:8px}.item-row{display:grid;grid-template-columns:1fr auto;gap:8px}.item-row button{border:2px solid var(--ink);background:transparent;font-weight:900;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--ink);padding:8px 10px;font-size:12px;font-weight:800;text-transform:uppercase;cursor:pointer}.chip.on{background:var(--ink);color:var(--paper)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stat{border-top:5px solid var(--ink);padding:12px 0}.stat b{display:block;font-size:32px}.stamp{display:inline-block;border:4px solid var(--red);color:var(--red);font-weight:1000;padding:8px 12px;transform:rotate(-2deg);text-transform:uppercase;margin:18px 0}.progress{height:8px;background:var(--grey);margin:8px 0 0}.progress i{display:block;height:100%;background:var(--red);width:0}.note{padding:12px;border:1px dashed var(--ink);font-size:13px}.hidden{display:none!important}.danger-map{display:grid;gap:14px}.danger-map section{border-top:2px solid var(--ink);padding-top:10px}.cert{border:8px double var(--ink);padding:28px;text-align:center;margin:26px 0}.cert h2{font-size:42px}.email-preview{border:2px solid var(--ink);padding:18px;background:#fffdf4}.email-preview .subject{font-weight:900;border-bottom:1px solid var(--grey);padding-bottom:10px;margin-bottom:14px}.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:35px}.error{color:var(--red);font-weight:800;font-size:13px;margin-top:8px}.case{font-size:22px;border:3px solid var(--ink);padding:24px}@media(max-width:680px){.screen{padding-top:30px}.grid,.stats{grid-template-columns:1fr}.top .badge{display:none}.module-head{display:block}.item-row{grid-template-columns:1fr 44px}.lead{font-size:20px}.btn{width:100%}.actions{display:grid}.cert{padding:18px}.cert h2{font-size:30px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">Dementor Club</div><div><span id="topStep" class="badge">Прототип v0.1</span></div></div><div class="progress"><i id="bar"></i></div></header>
<main id="app"></main>
<script>
const KEY='dementor_dumai_proto_v01';
const fresh=()=>({step:0,email:'',domain:'',decision:'',initialConfidence:70,currentConfidence:70,confidenceHistory:[],expectedOutcome:'',assumptions:[],assumptionTypes:{},agreementWho:'',agreementSaid:'',agreementInference:'',agreementKnown:'',agreementCheck:'',trustCost:[],trustReflection:'',failureModes:[],uncomfortableFailure:'',uncomfortableWhy:'',signals:[],rationalizedSignal:'',rationalization:'',recheckTrigger:'',greenState:'',yellowState:'',redLine:'',irreversible:[],sunkChoice:'',proArguments:'',counterArguments:'',falsificationFact:'',errorCost:'',inactionCost:'',planB:'',finalDecision:'',examQuestions:[],examCoverage:[],examPassed:false});
let state=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'));
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const domains={home:'Бытовой',business:'Работа / бизнес',people:'Отношения с людьми'};
const examples={home:['Переехать в другой город этой осенью','Купить квартиру вместо аренды'],business:['Открыть второй офис до января','Взять нового партнёра в проект'],people:['Согласиться на совместный переезд','Продолжить сотрудничество с человеком, которому перестал доверять']};
const app=document.getElementById('app');
const total=12;
function shell(inner){return `<section class="screen active"><div class="wrap">${inner}</div></section>`}
function next(n){state.step=n;save();render();scrollTo(0,0)}
function setVal(k,v){state[k]=v;save()}
function confidenceBlock(nextStep){return `<div class="range-wrap"><div class="range-value"><span id="cv">${state.currentConfidence}</span>%</div><input id="confidence" type="range" min="0" max="100" value="${state.currentConfidence}"><div class="small">0 — идея уже умерла · 100 — что вообще может пойти не так</div></div><div class="actions"><button class="btn" id="confidenceNext">Зафиксировать</button></div><script-placeholder data-next="${nextStep}"></script-placeholder>`}
function listInput(id,arr,placeholder,min){return `<div class="list" id="${id}List">${arr.map((x,i)=>`<div class="item-row"><div class="card" style="margin:0;padding:12px">${esc(x)}</div><button data-del="${i}" data-list="${id}">×</button></div>`).join('')}</div><label>Добавить</label><div class="item-row"><input type="text" id="${id}Input" placeholder="${placeholder}"><button data-add="${id}">+</button></div><div class="small">Минимум для продолжения: ${min}. Сейчас: ${arr.length}</div>`}
function controls(prev,nextStep,disabled=false,label='Продолжить'){return `<div class="footer-nav">${prev!==null?`<button class="btn alt" data-go="${prev}">Назад</button>`:'<span></span>'}<button class="btn" data-go="${nextStep}" ${disabled?'disabled':''}>${label}</button></div>`}
function render(){
 document.getElementById('bar').style.width=Math.min(100,(state.step/(total-1))*100)+'%';
 document.getElementById('topStep').textContent=state.step===0?'Прототип v0.1':`Дело / шаг ${state.step}`;
 const r=[start,onboard,confidence,m1,m2,m3,m4,m5,m6,m7,exam,finish][state.step]||start;r();bindCommon();
}
function start(){app.innerHTML=shell(`<div class="eyebrow">Онлайн / прототип для проверки</div><h1>ДУМАЙ<br><span class="red">С ОПАСНОСТЬЮ</span></h1><p class="lead">Курс последовательной деградации уверенности.</p><div class="card"><b>После курса вы сможете посмотреть на абсолютно нормальную ситуацию и обнаружить в ней минимум семь причин пока ничего не делать.</b></div><div class="note"><b>Что проверяем:</b> механику курса, один реальный decision, сквозные показатели и голос Валентина. E-mail в этом прототипе сохраняется только локально и ничего не отправляет.</div><div class="actions"><button class="btn red" data-go="1">Начать сомневаться</button><button class="btn alt" id="reset">Стереть мои тестовые данные</button></div>`)}
function onboard(){const ex=state.domain?examples[state.domain][0]:'Сначала выберите направление';app.innerHTML=shell(`<div class="eyebrow">Вход в дело</div><h2>У вас есть настоящее решение?</h2><p class="lead">Такое, последствия которого вам действительно небезразличны.</p><label>E-mail</label><input type="email" id="email" value="${esc(state.email)}" placeholder="you@example.com"><div class="small">Прототип: адрес не отправляется на сервер и используется только для проверки будущего e-mail-first flow.</div><label>Направление</label><div class="grid">${Object.entries(domains).map(([k,v])=>`<button class="choice ${state.domain===k?'selected':''}" data-domain="${k}">${v}</button>`).join('')}</div><label>Что вы собираетесь сделать?</label><input type="text" id="decision" value="${esc(state.decision)}" placeholder="${esc(ex)}"><div class="small">Формулируйте действие, а не тему.</div><div class="valentin"><b>Валентин</b>Вы уже знаете, что хотите сделать. Теперь попробуем выяснить почему.</div><div id="onErr" class="error"></div>${controls(0,2,true,'Зафиксировать решение')}`)}
function confidence(){app.innerHTML=shell(`<div class="eyebrow">Исходное показание</div><h2>Насколько это хорошая идея?</h2><div class="card"><b>${esc(state.decision)}</b><br><span class="small">${domains[state.domain]||''}</span></div><div class="range-wrap"><div class="range-value"><span id="cv">${state.currentConfidence}</span>%</div><input id="confidence" type="range" min="0" max="100" value="${state.currentConfidence}"><div class="small">0 — идея уже умерла · 50 — посмотрим · 100 — невозможно представить проблемы</div></div><div class="valentin"><b>Валентин</b>Хорошо. Решение у нас есть. Уверенность тоже.<br>Теперь посмотрим, переживут ли они знакомство друг с другом.</div>${controls(1,3,false,'Приступить к повреждению')}`)}
function m1(){const types=['ЗНАЮ','ПРЕДПОЛАГАЮ','МНЕ СКАЗАЛИ'];app.innerHTML=shell(`<div class="module-head"><div><div class="module-no">МОДУЛЬ 1 / О + П</div><h2>Да нормально будет</h2></div><div class="stamp">Предположение</div></div><div class="card"><b>Большинство проблем сначала выглядят именно так.</b></div><label>Что должно произойти, чтобы вы сказали «это было хорошее решение»?</label><textarea id="expected">${esc(state.expectedOutcome)}</textarea><h3>Что должно оказаться правдой?</h3><p>Добавьте минимум 7 условий.</p>${listInput('assumptions',state.assumptions,'Например: будет достаточно клиентов',7)}${state.assumptions.length>=5?`<div class="valentin"><b>Валентин</b>Пять обычно находится быстро. Интересное начинается после пятой.</div>`:''}${state.assumptions.length>=7?`<div class="card"><b>Разложите предпосылки</b><div class="list">${state.assumptions.map((a,i)=>`<div><div style="font-weight:800;margin:12px 0 6px">${i+1}. ${esc(a)}</div><div class="chips">${types.map(t=>`<span class="chip ${state.assumptionTypes[i]===t?'on':''}" data-type-i="${i}" data-type="${t}">${t}</span>`).join('')}</div></div>`).join('')}</div></div>`:''}<label>На основании чего вы решили, что всё будет нормально?</label><textarea id="m1control">${esc(state.m1control||'')}</textarea><label>Текущая уверенность</label><input id="m1conf" type="range" min="0" max="100" value="${state.currentConfidence}"><b id="m1cv">${state.currentConfidence}%</b><div class="valentin"><b>Валентин</b>${state.assumptions.length>=7?'Пока ваше решение держится на смеси фактов, прогнозов и чужих слов. Это популярный строительный материал.':'Не спешите менять решение. Сначала попробуйте понять, на чём оно вообще стояло.'}</div><div id="m1err" class="error"></div>${controls(2,4,true,'Зафиксировать показания')}`)}
function m2(){app.innerHTML=shell(`<div class="module-head"><div><div class="module-no">МОДУЛЬ 2</div><h2>Если тебе это сказали — это ещё не факт</h2></div><div class="stamp">Не доказано</div></div><div class="card"><h3>Обещание</h3><p class="lead" style="margin-bottom:0">Прогноз человека относительно собственного будущего поведения.</p></div><label>Кто дал важное для вашего решения обещание?</label><input id="agreementWho" type="text" value="${esc(state.agreementWho)}"><label>Что именно человек сказал?</label><textarea id="agreementSaid">${esc(state.agreementSaid)}</textarea><label>Что я из этого решил?</label><textarea id="agreementInference">${esc(state.agreementInference)}</textarea><label>Что я действительно знаю?</label><textarea id="agreementKnown">${esc(state.agreementKnown)}</textarea><label>Как это можно проверить?</label><textarea id="agreementCheck">${esc(state.agreementCheck)}</textarea><label>Если обещание не будет выполнено, что вы потеряете?</label><div class="chips">${['деньги','время','клиента','возможность','отношения','репутацию','почти ничего'].map(x=>`<span class="chip ${state.trustCost.includes(x)?'on':''}" data-trust="${x}">${x}</span>`).join('')}</div><label>Что изменится, если человек не врёт, а просто не может?</label><textarea id="trustReflection">${esc(state.trustReflection)}</textarea><div class="valentin"><b>Валентин</b>Самая неприятная версия: человек может быть совершенно искренним и всё равно не сделать то, что обещал.</div><div id="m2err" class="error"></div>${controls(3,5,true,'Продолжить дело')}`)}
function m3(){app.innerHTML=shell(`<div class="module-head"><div><div class="module-no">МОДУЛЬ 3 / А</div><h2>Где тут может быть пиздец</h2></div><div class="stamp">Premortem</div></div><div class="case">Прошёл год. Решение оказалось плохим.<br><b>Что произошло?</b></div><p>Найдите минимум 15 независимых причин провала. Первые пять — разминка.</p>${listInput('failureModes',state.failureModes,'Ещё один независимый способ провала',15)}${state.failureModes.length>=5?`<div class="valentin"><b>Валентин</b>Пять причин провала обычно называет оптимист. Продолжайте.</div>`:''}<label>Какую причину вам больше всего хочется считать маловероятной?</label><select id="uncomfortableFailure" style="width:100%;padding:14px;border:2px solid var(--ink);background:transparent;font-size:16px"><option value="">Выберите</option>${state.failureModes.map(x=>`<option ${state.uncomfortableFailure===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label>Почему?</label><textarea id="uncomfortableWhy">${esc(state.uncomfortableWhy)}</textarea><div id="m3err" class="error"></div>${controls(4,6,true,'Я достаточно испортил прогноз')}`)}
function m4(){app.innerHTML=shell(`<div class="module-head"><div><div class="module-no">МОДУЛЬ 4 / С</div><h2>Слабые сигналы</h2></div><div class="stamp">Требует проверки</div></div><div class="case">Подрядчик обычно отвечает за 20 минут. Теперь — за четыре часа. Потом переносит звонок. Потом пишет: «всё в процессе».</div><label>На каком моменте вы бы начали проверять?</label><textarea id="signalCase">${esc(state.signalCase||'')}</textarea><h3>Ваше решение</h3><p>Назовите минимум 5 ранних сигналов, что ситуация идёт не туда.</p>${listInput('signals',state.signals,'Например: цифры начинают расходиться',5)}<label>Какой сигнал вы скорее всего попытаетесь объяснить?</label><select id="rationalizedSignal" style="width:100%;padding:14px;border:2px solid var(--ink);background:transparent"><option value="">Выберите</option>${state.signals.map(x=>`<option ${state.rationalizedSignal===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label>«Это просто потому что...»</label><textarea id="rationalization">${esc(state.rationalization)}</textarea><label>После какого события вы обязаны перепроверить гипотезу?</label><textarea id="recheckTrigger">${esc(state.recheckTrigger)}</textarea><div class="valentin"><b>Валентин</b>Сигнал редко выглядит как доказательство. Если бы выглядел, он назывался бы уже проблемой.</div><div id="m4err" class="error"></div>${controls(5,7,true,'Зафиксировать сигналы')}`)}
function m5(){app.innerHTML=shell(`<div class="module-head"><div><div class="module-no">МОДУЛЬ 5 / Н</div><h2>Красные флаги для бедных. У нас — система</h2></div><div class="stamp">Опасно</div></div><label>Зелёное — всё допустимо</label><textarea id="greenState">${esc(state.greenState)}</textarea><label>Жёлтое — нужна перепроверка</label><textarea id="yellowState">${esc(state.yellowState)}</textarea><label>Красное — решение меняется или прекращается</label><textarea id="redLine">${esc(state.redLine)}</textarea><label>Что в этом решении трудно вернуть?</label><div class="chips">${['деньги','время','договор','репутацию','отношения','обязательства','здоровье / безопасность'].map(x=>`<span class="chip ${state.irreversible.includes(x)?'on':''}" data-irr="${x}">${x}</span>`).join('')}</div><div class="case">${state.domain==='business'?'Вы уже вложили €20 000.':state.domain==='people'?'Вы уже очень далеко зашли в договорённости и вовлекли других людей.':'Вы уже вложили значительную сумму и много времени.'}<br>Появился сигнал, который до начала вы назвали красным.</div><div class="grid" style="grid-template-columns:1fr 1fr"><button class="choice ${state.sunkChoice==='continue'?'selected':''}" data-sunk="continue">Продолжить</button><button class="choice ${state.sunkChoice==='stop'?'selected':''}" data-sunk="stop">Остановиться</button></div>${state.sunkChoice==='continue'?`<div class="valentin"><b>Валентин</b>Красная линия особенно полезна до того, как вы её пересекли.</div>`:''}<div id="m5err" class="error"></div>${controls(6,8,true,'Зафиксировать границы')}`)}
function m6(){app.innerHTML=shell(`<div class="module-head"><div><div class="module-no">МОДУЛЬ 6</div><h2>Не влюбляйся в собственную версию</h2></div><div class="stamp">Версия обвинения</div></div><label>Почему ваша идея хорошая?</label><textarea id="proArguments">${esc(state.proArguments)}</textarea><label>Почему человек, который знает больше вас, мог бы считать её плохой?</label><textarea id="counterArguments">${esc(state.counterArguments)}</textarea><label>Какой факт доказал бы, что вы ошибаетесь?</label><textarea id="falsificationFact">${esc(state.falsificationFact)}</textarea><div class="valentin"><b>Валентин</b>${/никак|никакой|уверен/i.test(state.falsificationFact||'')?'Если никакой факт не способен изменить ваше мнение, у вас не решение. У вас уже убеждение.':'Есть неприятная вероятность, что ваша идея действительно хорошая.'}</div><div id="m6err" class="error"></div>${controls(7,9,true,'Передать дело в финал')}`)}
function m7(){const unknowns=Object.values(state.assumptionTypes).filter(x=>x!=='ЗНАЮ').length;app.innerHTML=shell(`<div class="module-head"><div><div class="module-no">МОДУЛЬ 7 / О</div><h2>Смелость без идиотизма</h2></div><div class="stamp">Решение допускается</div></div><div class="stats"><div class="stat"><span>Исходная уверенность</span><b>${state.initialConfidence}%</b></div><div class="stat"><span>Способов провала</span><b>${state.failureModes.length}</b></div><div class="stat"><span>Неизвестных</span><b>${unknowns}</b></div></div><label>Что произойдёт, если вы сделаете и окажетесь неправы?</label><textarea id="errorCost">${esc(state.errorCost)}</textarea><label>Что произойдёт, если вы НЕ сделаете?</label><textarea id="inactionCost">${esc(state.inactionCost)}</textarea><label>Если произойдёт плохая версия — что вы будете делать?</label><textarea id="planB">${esc(state.planB)}</textarea><label>Текущая уверенность</label><div class="range-wrap"><div class="range-value"><span id="finalCv">${state.currentConfidence}</span>%</div><input id="finalConf" type="range" min="0" max="100" value="${state.currentConfidence}"></div><h3>Вы всё ещё хотите это делать?</h3><div class="grid"><button class="choice ${state.finalDecision==='do'?'selected':''}" data-final="do">Да. Делать.</button><button class="choice ${state.finalDecision==='change'?'selected':''}" data-final="change">Да, но изменить условия.</button><button class="choice ${state.finalDecision==='no'?'selected':''}" data-final="no">Нет.</button></div>${state.finalDecision?`<div class="valentin"><b>Валентин</b>${state.finalDecision==='do'?'Неприятный результат. После всех проверок идея всё ещё выглядит разумно. Придётся делать.':state.finalDecision==='change'?'Вы не отказались от решения. Вы перестали принимать его в первоначальной комплектации.':'Отказ от плохой идеи тоже является решением. Хотя выглядит значительно менее героически.'}</div>`:''}<div id="m7err" class="error"></div>${controls(8,10,true,'Перейти к экзамену')}`)}
function exam(){app.innerHTML=shell(`<div class="eyebrow">Итоговая проверка</div><h2>Экзамен</h2><div class="case">Знакомый предлагает вложить €40 000 в новый проект. Похожий бизнес он уже запускал в другом городе. По его расчётам проект окупится за 18 месяцев. Уже есть ещё два инвестора. Помещение найдено. Решение необходимо принять до пятницы.</div><h3 style="margin-top:30px">Что вам нужно узнать перед тем, как ответить?</h3><p>Добавьте минимум 6 вопросов. Не нужно принимать решение.</p>${listInput('examQuestions',state.examQuestions,'Например: откуда взялся расчёт 18 месяцев?',6)}<label>Какие области вы проверили?</label><div class="chips">${['люди','деньги','право','рынок','предпосылки','зависимости','необратимость','альтернативы','сигналы','цена бездействия'].map(x=>`<span class="chip ${state.examCoverage.includes(x)?'on':''}" data-exam="${x}">${x}</span>`).join('')}</div><div class="note">В реальной версии классификацию должен делать course engine/AI по содержанию вопросов. Здесь вы отмечаете области вручную — мы проверяем сам UX экзамена.</div><div id="examerr" class="error"></div>${controls(9,11,true,'Проверить подозрительность')}`)}
function finish(){const verdict={do:'ДЕЛАТЬ',change:'ИЗМЕНИТЬ УСЛОВИЯ',no:'НЕ ДЕЛАТЬ'}[state.finalDecision]||'НЕ ЗАФИКСИРОВАНО';const known=Object.values(state.assumptionTypes).filter(x=>x==='ЗНАЮ').length;const assumed=Object.values(state.assumptionTypes).filter(x=>x==='ПРЕДПОЛАГАЮ').length;const told=Object.values(state.assumptionTypes).filter(x=>x==='МНЕ СКАЗАЛИ').length;app.innerHTML=shell(`<div class="eyebrow">Дело завершено</div><h2>Решение не принято автоматически.</h2><p class="lead">Вы дошли до него сами. Это и была неприятная часть.</p><div class="danger-map"><section><b>РЕШЕНИЕ</b><p>${esc(state.decision)}</p></section><section><b>ОЖИДАЕМЫЙ РЕЗУЛЬТАТ</b><p>${esc(state.expectedOutcome)}</p></section><section><b>ПРЕДПОСЫЛКИ</b><p>${state.assumptions.map(esc).join(' · ')}</p><small>Знаю: ${known} · Предполагаю: ${assumed} · Мне сказали: ${told}</small></section><section><b>СПОСОБЫ ПРОВАЛА</b><p>${state.failureModes.map(esc).join(' · ')}</p></section><section><b>РАННИЕ СИГНАЛЫ</b><p>${state.signals.map(esc).join(' · ')}</p></section><section><b>КРАСНАЯ ЛИНИЯ</b><p>${esc(state.redLine)}</p></section><section><b>ЦЕНА ОШИБКИ</b><p>${esc(state.errorCost)}</p></section><section><b>ЦЕНА БЕЗДЕЙСТВИЯ</b><p>${esc(state.inactionCost)}</p></section><section><b>PLAN B</b><p>${esc(state.planB)}</p></section><section><b>УВЕРЕННОСТЬ</b><p>${state.initialConfidence}% → ${state.currentConfidence}%</p></section><section><b>ФИНАЛЬНОЕ РЕШЕНИЕ</b><p><strong>${verdict}</strong></p></section></div><div class="valentin"><b>Валентин</b>Мы не избавили вас от ошибок. Но перед следующей вы хотя бы будете лучше понимать, что происходит.</div><div class="cert"><div class="eyebrow">Министерство профилактики здравого смысла</div><h2>Сертификат повышенной подозрительности</h2><p>Настоящим подтверждается, что участник перестал считать отсутствие плохих новостей хорошей новостью.</p><h3>Опасно думающий гражданин I класса</h3><p>Валентин Лосев</p></div><div class="email-preview"><div class="subject">Прототип письма: ваше дело завершено</div><p>Исходная уверенность: <b>${state.initialConfidence}%</b><br>Финальная: <b>${state.currentConfidence}%</b></p><p>Финальное решение: <b>${verdict}</b>.</p><p>В production сюда придёт ссылка на сохранённую «Карту опасности» и следующий доступный шаг.</p><p>— Валентин</p></div><div class="actions"><button class="btn" id="restart">Испортить другое решение</button><button class="btn alt" onclick="window.print()">Распечатать карту</button></div>`)}
function bindCommon(){
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>next(+b.dataset.go));
 const reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('Стереть тестовое прохождение?')){state=fresh();save();render()}};
 const restart=document.getElementById('restart');if(restart)restart.onclick=()=>{const email=state.email;state=fresh();state.email=email;save();next(1)};
 if(state.step===1){const email=document.getElementById('email'),decision=document.getElementById('decision'),go=document.querySelector('[data-go="2"]');function valid(){state.email=email.value.trim();state.decision=decision.value.trim();save();go.disabled=!(state.email.includes('@')&&state.domain&&state.decision.length>=10);document.getElementById('onErr').textContent=go.disabled?'Нужны e-mail, направление и конкретное решение.':''}email.oninput=valid;decision.oninput=valid;document.querySelectorAll('[data-domain]').forEach(x=>x.onclick=()=>{state.domain=x.dataset.domain;save();render()});valid()}
 if(state.step===2){const r=document.getElementById('confidence'),v=document.getElementById('cv');r.oninput=()=>{state.currentConfidence=+r.value;v.textContent=r.value;save()};document.querySelector('[data-go="3"]').onclick=()=>{state.initialConfidence=state.currentConfidence;state.confidenceHistory=[state.currentConfidence];save();next(3)}}
 bindLists();
 if(state.step===3)bindM1();if(state.step===4)bindM2();if(state.step===5)bindM3();if(state.step===6)bindM4();if(state.step===7)bindM5();if(state.step===8)bindM6();if(state.step===9)bindM7();if(state.step===10)bindExam();
}
function bindLists(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add,inp=document.getElementById(k+'Input'),v=inp.value.trim();if(v){state[k].push(v);save();render()}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state[b.dataset.list].splice(+b.dataset.del,1);save();render()})}
function bindM1(){const exp=document.getElementById('expected'),ctrl=document.getElementById('m1control'),r=document.getElementById('m1conf'),cv=document.getElementById('m1cv'),go=document.querySelector('[data-go="4"]');function val(){state.expectedOutcome=exp.value;state.m1control=ctrl.value;state.currentConfidence=+r.value;cv.textContent=r.value+'%';save();const typed=Object.keys(state.assumptionTypes).length;go.disabled=!(state.expectedOutcome.trim()&&state.assumptions.length>=7&&typed>=7&&state.m1control.trim());document.getElementById('m1err').textContent=go.disabled?'Нужны результат, 7 предпосылок, их классификация и контрольный ответ.':''}exp.oninput=ctrl.oninput=r.oninput=val;document.querySelectorAll('[data-type-i]').forEach(x=>x.onclick=()=>{state.assumptionTypes[x.dataset.typeI]=x.dataset.type;save();render()});go.onclick=()=>{state.confidenceHistory.push(state.currentConfidence);save();next(4)};val()}
function bindM2(){const ids=['agreementWho','agreementSaid','agreementInference','agreementKnown','agreementCheck','trustReflection'],go=document.querySelector('[data-go="5"]');function val(){ids.forEach(k=>state[k]=document.getElementById(k).value);save();go.disabled=!(ids.every(k=>state[k].trim())&&state.trustCost.length);document.getElementById('m2err').textContent=go.disabled?'Заполните договорённость, проверку, цену доверия и контрольный ответ.':''}ids.forEach(k=>document.getElementById(k).oninput=val);document.querySelectorAll('[data-trust]').forEach(x=>x.onclick=()=>{const v=x.dataset.trust;state.trustCost=state.trustCost.includes(v)?state.trustCost.filter(y=>y!==v):[...state.trustCost,v];save();render()});val()}
function bindM3(){const go=document.querySelector('[data-go="6"]'),sel=document.getElementById('uncomfortableFailure'),why=document.getElementById('uncomfortableWhy');function val(){state.uncomfortableFailure=sel.value;state.uncomfortableWhy=why.value;save();go.disabled=!(state.failureModes.length>=15&&state.uncomfortableFailure&&state.uncomfortableWhy.trim());document.getElementById('m3err').textContent=go.disabled?'Нужно 15 способов провала и одна неприятная причина с объяснением.':''}sel.onchange=why.oninput=val;val()}
function bindM4(){const ids=['signalCase','rationalizedSignal','rationalization','recheckTrigger'],go=document.querySelector('[data-go="7"]');function val(){state.signalCase=document.getElementById('signalCase').value;state.rationalizedSignal=document.getElementById('rationalizedSignal').value;state.rationalization=document.getElementById('rationalization').value;state.recheckTrigger=document.getElementById('recheckTrigger').value;save();go.disabled=!(state.signals.length>=5&&state.signalCase.trim()&&state.rationalizedSignal&&state.rationalization.trim()&&state.recheckTrigger.trim());document.getElementById('m4err').textContent=go.disabled?'Нужны 5 сигналов, рационализация и конкретная точка перепроверки.':''}document.getElementById('signalCase').oninput=document.getElementById('rationalization').oninput=document.getElementById('recheckTrigger').oninput=val;document.getElementById('rationalizedSignal').onchange=val;val()}
function bindM5(){const ids=['greenState','yellowState','redLine'],go=document.querySelector('[data-go="8"]');function val(){ids.forEach(k=>state[k]=document.getElementById(k).value);save();go.disabled=!(ids.every(k=>state[k].trim())&&state.irreversible.length&&state.sunkChoice);document.getElementById('m5err').textContent=go.disabled?'Нужны три состояния, необратимые последствия и выбор в sunk-cost кейсе.':''}ids.forEach(k=>document.getElementById(k).oninput=val);document.querySelectorAll('[data-irr]').forEach(x=>x.onclick=()=>{const v=x.dataset.irr;state.irreversible=state.irreversible.includes(v)?state.irreversible.filter(y=>y!==v):[...state.irreversible,v];save();render()});document.querySelectorAll('[data-sunk]').forEach(x=>x.onclick=()=>{state.sunkChoice=x.dataset.sunk;save();render()});val()}
function bindM6(){const ids=['proArguments','counterArguments','falsificationFact'],go=document.querySelector('[data-go="9"]');function val(){ids.forEach(k=>state[k]=document.getElementById(k).value);save();go.disabled=!ids.every(k=>state[k].trim());document.getElementById('m6err').textContent=go.disabled?'Нужны защита, обвинение и факт, способный изменить мнение.':''}ids.forEach(k=>document.getElementById(k).oninput=val);val()}
function bindM7(){const ids=['errorCost','inactionCost','planB'],go=document.querySelector('[data-go="10"]'),r=document.getElementById('finalConf'),cv=document.getElementById('finalCv');function val(){ids.forEach(k=>state[k]=document.getElementById(k).value);state.currentConfidence=+r.value;cv.textContent=r.value;save();go.disabled=!(ids.every(k=>state[k].trim())&&state.finalDecision);document.getElementById('m7err').textContent=go.disabled?'Нужны цена ошибки, цена бездействия, Plan B и финальное решение.':''}ids.forEach(k=>document.getElementById(k).oninput=val);r.oninput=val;document.querySelectorAll('[data-final]').forEach(x=>x.onclick=()=>{state.finalDecision=x.dataset.final;save();render()});go.onclick=()=>{state.confidenceHistory.push(state.currentConfidence);save();next(10)};val()}
function bindExam(){const go=document.querySelector('[data-go="11"]');function val(){go.disabled=!(state.examQuestions.length>=6&&state.examCoverage.length>=4);document.getElementById('examerr').textContent=go.disabled?'Для прототипа: минимум 6 вопросов и 4 отмеченные области проверки.':''}document.querySelectorAll('[data-exam]').forEach(x=>x.onclick=()=>{const v=x.dataset.exam;state.examCoverage=state.examCoverage.includes(v)?state.examCoverage.filter(y=>y!==v):[...state.examCoverage,v];save();render()});go.onclick=()=>{state.examPassed=true;save();next(11)};val()}
render();
</script>
</body>
</html>
